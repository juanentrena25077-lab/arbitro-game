window.avanzarCalendario = function(){
  var cat = categoriaActual();
  state.match = null;
  state.bribeOffer = null;
  if(state.fecha >= cat.fechas){
    cerrarTemporada();
  } else {
    state.fecha++;
    state.screen = "dashboard";
    render();
  }
};

/* ---------- CIERRE DE TEMPORADA ---------- */
function cerrarTemporada(){
  var avg = promedio(state.temporadaNotas);
  var cat = categoriaActual();
  var resultado = { avg: Math.round(avg*10)/10, categoriaAnterior: cat.nombre, movimiento:"mantiene", mensaje:"" };

  if(avg >= 8){
    if(state.catIndex < CATEGORIAS.length-1){
      state.catIndex++;
      resultado.movimiento = "ascenso";
      resultado.mensaje = "La Federación te asciende a "+ CATEGORIAS[state.catIndex].nombre +" por tu excelente temporada.";
      state.seasonsBajas = 0;
    } else {
      resultado.mensaje = "Ya estás en la cima del arbitraje. Consolidás tu lugar en el Mundial.";
      state.seasonsBajas = 0;
    }
  } else if(avg < 5){
    state.seasonsBajas++;
    if(state.seasonsBajas >= 2){
      state.despedido = true;
      resultado.movimiento = "despido";
      resultado.mensaje = "Dos temporadas flojas consecutivas. La Federación decide desvincularte del cuerpo arbitral.";
    } else if(state.catIndex > 0){
      state.catIndex--;
      resultado.movimiento = "descenso";
      resultado.mensaje = "Tras una temporada floja, te reasignan a "+ CATEGORIAS[state.catIndex].nombre +".";
    } else {
      resultado.movimiento = "sancion";
      resultado.mensaje = "Recibís una seria advertencia de la Federación. Una temporada más así y quedás fuera.";
    }
  } else {
    resultado.mensaje = "Temporada pareja, sin sobresaltos. Seguís en "+ cat.nombre +".";
    state.seasonsBajas = 0;
  }

  state.lastSeasonResult = resultado;
  state.temporadaNotas = [];
  state.bajadasTemporada = 0; // Se resetea el contador de bajadas por temporada
  state.fecha = 1;
  state.ref.edad++;

  if(state.despedido){
    state.screen = "gameover";
  } else if(state.ref.edad >= 48){
    state.retirado = true;
    state.screen = "retirement";
  } else {
    state.screen = "seasonSummary";
  }
  render();
}

window.irADesignarFecha = function(){
  var ps = presState;
  var triggerEvent = (ps.fecha % 2 === 1) || Math.random() < 0.45;
  if(triggerEvent && !ps.eventoResueltoFecha){
    ps.eventoActual = pick(PRES_EVENTOS_CORRUPCION_Y_POLEMICAS);
    ps.screen = "pres_event";
  } else {
    ps.screen = "pres_assign";
  }
  render();
};

function screenPresidentEvent(){
  var ps = presState;
  var ev = ps.eventoActual;
  if(!ev){
    ps.screen = "pres_assign";
    return screenPresidentAssign();
  }

  var opcionesHtml = ev.opciones.map(function(op, idx){
    var impactMoney = op.fondosDelta !== 0 ? (op.fondosDelta > 0 ? ' <span class="delta-pill up">+' + fmtMoney(op.fondosDelta) + '</span>' : ' <span class="delta-pill down">' + fmtMoney(op.fondosDelta) + '</span>') : '';
    var impactAfa = op.confianzaDelta !== 0 ? (op.confianzaDelta > 0 ? ' <span class="delta-pill up">AFA +' + op.confianzaDelta + '%</span>' : ' <span class="delta-pill down">AFA ' + op.confianzaDelta + '%</span>') : '';
    var impactRep = op.reputacionDelta !== 0 ? (op.reputacionDelta > 0 ? ' <span class="delta-pill up">Prensa +' + op.reputacionDelta + '%</span>' : ' <span class="delta-pill down">Prensa ' + op.reputacionDelta + '%</span>') : '';
    var impactMoral = op.moralDelta !== 0 ? (op.moralDelta > 0 ? ' <span class="delta-pill up">Moral +' + op.moralDelta + '%</span>' : ' <span class="delta-pill down">Moral ' + op.moralDelta + '%</span>') : '';

    return '<button class="bribe-choice-btn" onclick="resolverEventoPresidente(' + idx + ')">' +
      '<div class="press-style-badge ' + op.cls + '">' + op.badge + '</div>' +
      '<div style="font-weight:700; color:#fff; font-size:14px; margin-top:4px;">' + op.texto + '</div>' +
      '<div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;">' + impactMoney + impactAfa + impactRep + impactMoral + '</div>' +
    '</button>';
  }).join("");

  return topbar() +
    '<div class="corrupt-event-box">' +
      '<div class="corrupt-caller-badge">📞 Despacho Presidencial · LLAMADA DE ALTA TENSIÓN</div>' +
      '<div class="corrupt-title">' + ev.titulo + '</div>' +
      '<div class="corrupt-caller-name">Emisor: ' + ev.emisor + ' · ' + ev.subtitulo + '</div>' +
      '<div class="corrupt-text">' + ev.descripcion + '</div>' +
      '<div class="eyebrow" style="margin-top:14px; color:var(--gold);">¿Cuál es tu resolución institucional como Presidente?</div>' +
      opcionesHtml +
    '</div>' +
    '<button class="btn btn-outline" style="margin-top:10px;" onclick="irAMenuModos()">← Volver al Menú Principal</button>';
}

window.resolverEventoPresidente = function(idx){
  var ps = presState;
  var ev = ps.eventoActual;
  var op = ev.opciones[idx];

  ps.fondos = Math.max(0, ps.fondos + op.fondosDelta);
  ps.confianzaAFA = clamp(ps.confianzaAFA + op.confianzaDelta, 0, 100);
  ps.reputacionPublica = clamp(ps.reputacionPublica + op.reputacionDelta, 0, 100);
  ps.moralPlantel = clamp(ps.moralPlantel + op.moralDelta, 0, 100);

  ps.resultadoEvento = {
    titulo: ev.titulo,
    opcion: op,
    impacto: op.impacto
  };
  ps.eventoActual = null;
  ps.eventoResueltoFecha = true;
  ps.screen = "pres_assign";
  guardarPresidente();
  render();
};

function screenPresidentAssign(){
  var ps = presState;
  var divId = ps.divisionSeleccionada || "liga";
  var fixIdx = (ps.fecha - 1) % 10;
  var fixturesDivision = PRES_FIXTURES_POR_DIVISION[divId] || PRES_FIXTURES_POR_DIVISION.liga;
  var partidos = fixturesDivision[fixIdx] || fixturesDivision[0];

  // Auto-init designations if empty
  if(!ps.designaciones) ps.designaciones = {};
  for(var i=0; i<partidos.length; i++){
    var desKey = divId + "_" + i;
    if(!ps.designaciones[desKey]){
      ps.designaciones[desKey] = ps.arbitros[i % ps.arbitros.length].id;
    }
  }

  var assignedSet = {};
  for(var k in ps.designaciones){
    assignedSet[ps.designaciones[k]] = true;
  }

  // Division selector pills
  var divPillsHtml = PRES_DIVISIONES.map(function(d){
    var active = d.id === divId ? " active" : "";

function simularFechaCompleta(){
  var ps = presState;
  var divId = ps.divisionSeleccionada || "liga";
  var fixIdx = (ps.fecha - 1) % 10;
  var fixturesDivision = PRES_FIXTURES_POR_DIVISION[divId] || PRES_FIXTURES_POR_DIVISION.liga;
  var partidos = fixturesDivision[fixIdx] || fixturesDivision[0];

  var assignedSet = {};
  var resultadosPartidos = [];
  var totalNota = 0;

  for(var i=0; i<partidos.length; i++){
    var p = partidos[i];
    var desKey = divId + "_" + i;
    var refId = ps.designaciones[desKey] || ps.arbitros[i % ps.arbitros.length].id;
    var ref = ps.arbitros.find(function(a){ return a.id === refId; }) || ps.arbitros[0];
    assignedSet[ref.id] = true;

    // Goles
    var gL = Math.floor(Math.random() * 3);
    var gV = Math.floor(Math.random() * 3);
    if(Math.random() < 0.3) gL += 1;

    // Calculo de desempeno arbitral
    var fatigaImpact = (100 - ref.energia) / 100;
    var templeBonus = (ref.temple - 80) * 0.08;
    var fisicoBonus = (ref.fisico - 80) * 0.06;
    
    // Mejoras activas
    if(ps.mejoras.simuladorVAR) templeBonus += 0.4;

    var baseNota = 7.0 + templeBonus + fisicoBonus - (fatigaImpact * 2.2) + ((Math.random() * 2.0) - 1.0);
    baseNota = clamp(baseNota, 3.0, 9.8);
    baseNota = Math.round(baseNota * 10) / 10;

    var incidentes = [];
    var amarillas = Math.floor(Math.random() * 5) + 2;
    var rojas = Math.random() < 0.28 ? 1 : 0;
    var penales = Math.random() < 0.35 ? 1 : 0;

    if(ref.energia < 45 && Math.random() < 0.65){
      incidentes.push("⚠️ Min 78': Calambre del árbitro y tardanza en consultar el VAR.");
      baseNota = Math.max(3.5, baseNota - 1.4);
    } else if(baseNota >= 8.5){
      incidentes.push("✨ Conducción impecable: acertó con el VAR en una jugada bisagra.");
    } else if(baseNota <= 5.0){
      incidentes.push("🚨 Polémica nacional: reclamos airados de los dos bancos de suplentes.");
    } else {
      incidentes.push("✔️ Arbitraje sobrio y sin sobresaltos reglamentarios.");
    }

    // Actualizar cansancio del arbitro
    var gastoEnergia = 35;
    if(ps.mejoras.preparadorFisico) gastoEnergia = 22;
    ref.energia = Math.max(10, ref.energia - gastoEnergia);
    ref.partidosSeguidos = (ref.partidosSeguidos || 0) + 1;
    ref.partidosTotal = (ref.partidosTotal || 0) + 1;

    resultadosPartidos.push({
      local: p.local,
      visitante: p.visitante,
      clasico: p.clasico,
      golesLocal: gL,
      golesVisitante: gV,
      arbitro: ref.nombre,
      avatarId: ref.avatarId,
      nota: baseNota,
      amarillas: amarillas,
      rojas: rojas,
      penales: penales,
      incidente: incidentes[0]
    });

    totalNota += baseNota;
  }

  // Arbitros en descanso recuperan energia
  ps.arbitros.forEach(function(a){
    if(!assignedSet[a.id]){
      a.energia = Math.min(100, a.energia + 45);
      a.partidosSeguidos = 0;
    }
  });

  // Calculo financiero con sponsors
  var ingresoDerechos = 60000;
  var ingresoPorSponsors = 0;
  for(var slotKey in ps.sponsors){
    var spId = ps.sponsors[slotKey];
    if(spId){
      var spObj = PRES_SPONSORS_CATALOGO.find(function(s){ return s.id === spId; });
      if(spObj) ingresoPorSponsors += spObj.montoPorFecha;
    }
  }

  var viaticos = 25000;
  var balanceNeto = ingresoDerechos + ingresoPorSponsors - viaticos;

  ps.fondos += balanceNeto;
  
  var promedioFecha = Math.round((totalNota / partidos.length) * 10) / 10;

  // Confianza AFA y prensa se ajustan segun promedio de notas
  if(promedioFecha >= 7.5){
    ps.confianzaAFA = clamp(ps.confianzaAFA + 8, 0, 100);
    ps.reputacionPublica = clamp(ps.reputacionPublica + 6, 0, 100);
    ps.moralPlantel = clamp(ps.moralPlantel + 5, 0, 100);
  } else if(promedioFecha < 6.0){
    ps.confianzaAFA = clamp(ps.confianzaAFA - 12, 0, 100);
    ps.reputacionPublica = clamp(ps.reputacionPublica - 10, 0, 100);
    ps.moralPlantel = clamp(ps.moralPlantel - 8, 0, 100);
  }

  ps.simulacionActual = {
    fecha: ps.fecha,
    promedioNota: promedioFecha,
    ingresoNeto: balanceNeto,
    ingresoSponsors: ingresoPorSponsors,
    partidos: resultadosPartidos
  };

  ps.historialFechas.push(ps.simulacionActual);
  ps.screen = "pres_round_summary";
  guardarPresidente();
  render();
}

  var cantFirmados = Object.keys(ps.sponsorsFirmadosAno).length;
  // Si el espacio ya está blindado o ya se alcanzó el límite de 3 por año, no permitir cambio

  triggerHaptic("success");
  guardarPresidente();
  render();
};

window.mejorarNivelAcademia = function(costo){
  var ps = presState;
  if(ps.fondos >= costo){
    ps.fondos -= costo;
    ps.academiaNivel++;
    triggerHaptic("success");
    guardarPresidente();
    render();
  }
};

window.promoverCandidatoAcademia = function(idx){
  var ps = presState;
  var c = ps.scoutingCandidatos[idx];
  if(c && ps.fondos >= 15000){
    ps.fondos -= 15000;
    ps.arbitros.push(c);
    ps.scoutingCandidatos.splice(idx, 1);
    ps.promocionesRealizadas = (ps.promocionesRealizadas || 0) + 1;
    triggerHaptic("success");
    guardarPresidente();
    render();
  }
};

window.renovarScoutingAcademia = function(){
  var ps = presState;
  if(ps.fondos >= 10000){
    ps.fondos -= 10000;
    ps.scoutingCandidatos = [
      generarCandidatoScouting(ps.academiaNivel),
      generarCandidatoScouting(ps.academiaNivel),
      generarCandidatoScouting(ps.academiaNivel)
    ];
    guardarPresidente();
    render();
  }
};

window.comprarMejoraPresidente = function(id, costo){
  var ps = presState;
  if(ps.fondos >= costo && !ps.mejoras[id]){
    triggerHaptic("success");
    ps.fondos -= costo;
    ps.mejoras[id] = true;

    if(id === "clinicaPsicologia"){
      ps.arbitros.forEach(function(a){ a.temple = Math.min(99, a.temple + 6); });
    }
    if(id === "intercomunicadoresHD"){
      ps.arbitros.forEach(function(a){ a.rigor = Math.min(99, a.rigor + 4); });
    }
    if(id === "aumentoViaticos"){
      ps.moralPlantel = Math.min(100, ps.moralPlantel + 25);
    }
    guardarPresidente();
    render();
  }
};

    reqDesc: "Ser reelecto para Años 5-8",
    check: function(ps){
      return ps.temporada > 4 || ps.mandatoAno > 4 || ps.mandatoReelecto;
    },
    progreso: function(ps){
      var actualAno = Math.min(4, ps.mandatoAno);
      return { actual: "Año " + actualAno + "/4", max: "Año 4", pct: Math.round((actualAno / 4) * 100) };
    }
  }
];

/* ---------- PANTALLA DE LOGROS DEL MODO DIRIGENTE ---------- */
function screenPresidentAchievements(){
  var ps = presState;
  var totalLogros = PRES_LOGROS_CATALOGO.length;
  var desbloqueados = 0;

  var cardsHtml = PRES_LOGROS_CATALOGO.map(function(l){
    var isUnlocked = l.check(ps);
    if(isUnlocked) desbloqueados++;
    var prog = l.progreso(ps);

    var cardCls = "pres-achievement-card" + (isUnlocked ? " unlocked" : " locked");
    var badgeHtml = isUnlocked ?
      '<span class="pres-achievement-badge unlocked">✓ Desbloqueado</span>' :
      '<span class="pres-achievement-badge locked">🔒 En Progreso</span>';

    return '<div class="' + cardCls + '">' +
      '<div class="pres-achievement-header">' +
        '<div class="pres-achievement-icon">' + l.icono + '</div>' +
        '<div class="pres-achievement-info">' +
          '<div class="pres-achievement-title">' + l.titulo + '</div>' +
          '<span class="pres-achievement-category">' + l.cat + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="pres-achievement-desc">' + l.desc + '</div>' +
      '<div class="pres-achievement-progress-wrap">' +
        '<div class="pres-achievement-progress-bar" style="width:' + prog.pct + '%;"></div>' +
      '</div>' +
      '<div class="pres-achievement-footer">' +
        '<span class="pres-achievement-prog-text">' + prog.actual + ' / ' + prog.max + '</span>' +
        badgeHtml +
      '</div>' +
    '</div>';
  }).join("");

  var pctTotal = Math.round((desbloqueados / totalLogros) * 100);

  return topbar() +
    navTabsPresidente("pres_achievements") +
    '<div class="panel" style="border-color:rgba(240,196,25,0.35); background:linear-gradient(135deg, rgba(240,196,25,0.08), rgba(0,0,0,0.5));">' +
      '<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">' +
        '<div>' +
          '<div class="eyebrow" style="color:var(--gold);">Colegio de Árbitros · Galería de Honor</div>' +
          '<h1 class="section-title" style="font-size:22px; margin-top:4px;">Sala de Logros & Hitos Institucionales</h1>' +
          '<p class="muted" style="font-size:12.5px; margin-top:4px;">Completá los objetivos de gestión, finanzas, infraestructura y formación arbitral durante tu presidencia.</p>' +
        '</div>' +
        '<div style="text-align:right;">' +
          '<div style="font-family:var(--font-display); font-size:24px; color:var(--gold); font-weight:800;">' + desbloqueados + ' / ' + totalLogros + '</div>' +
          '<div class="muted" style="font-size:11.5px;">' + pctTotal + '% Completado</div>' +
        '</div>' +
      '</div>' +
      '<div class="pres-achievement-progress-wrap" style="height:8px; margin-top:12px;">' +
        '<div class="pres-achievement-progress-bar" style="width:' + pctTotal + '%; background:linear-gradient(90deg, var(--gold), var(--green));"></div>' +
      '</div>' +
    '</div>' +

    '<div class="pres-achievement-grid">' + cardsHtml + '</div>' +

    '<div class="panel" style="margin-top:16px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">' +
      '<div>' +
        '<div style="font-size:14px; font-weight:700; color:#fff;">¿Querés comenzar una nueva gestión desde cero?</div>' +
        '<div class="muted" style="font-size:12px;">Podrás volver a elegir personaje, nombre y reiniciar todos los fondos e historial.</div>' +
      '</div>' +
      '<button class="btn btn-danger" style="font-size:13px; padding:10px 16px;" onclick="confirmarReinicioPresidencia()">🔄 Reiniciar Carrera de Dirigente</button>' +
    '</div>' +

    '<button class="btn btn-outline" style="margin-top:14px;" onclick="volverADashboardPresidente()">← Volver al Despacho Presidencial</button>' +
    '<button class="btn btn-outline" style="margin-top:6px;" onclick="irAMenuModos()">← Volver al Menú Principal</button>';
}

var modalConfirmReinicioActivo = false;

window.confirmarReinicioPresidencia = function(){
  if(confirm("¿Estás seguro de que deseás reiniciar tu carrera de Dirigente? Se borrarán todos los avances, árbitros promovidos, fondos y acuerdos de sponsors.")){
    reiniciarPresidencia();
  }
};

window.reiniciarPresidencia = function(){
  borrarGuardadoPresidente();
  presState = null;
  currentGameMode = "president";
  render();
};

/* ---------- RETIRO / GAME OVER ---------- */
function screenRetirement(){
  var conf = calcularConfianza();
  return topbar() +
    '<div class="panel center">' +
      '<div class="eyebrow">Fin de la carrera</div>' +
      '<h1 class="section-title" style="font-size:26px; margin-top:8px;">RETIRO DEL<br/>ÁRBITRO '+ escapeHtml(state.ref.nombre).toUpperCase() +'</h1>' +
      '<p class="muted" style="font-size:13px; margin-top:10px;">A los '+ state.ref.edad +' años, colgás el silbato. Así cierra tu paso por el arbitraje profesional.</p>' +
    '</div>' +
    resumenCarreraHtml(conf) +
    '<button class="btn btn-gold" onclick="reiniciarCarrera()">Iniciar una nueva carrera</button>';
}

function screenGameOver(){
  var conf = calcularConfianza();
  return topbar() +
    '<div class="panel center">' +
      '<div class="eyebrow">Desvinculado de la Federación</div>' +
      '<h1 class="section-title" style="font-size:24px; color:var(--red); margin-top:8px;">FIN DE LA CARRERA</h1>' +
      '<p class="muted" style="font-size:13px; margin-top:10px;">'+ state.lastSeasonResult.mensaje +'</p>' +
    '</div>' +
    resumenCarreraHtml(conf) +
    '<button class="btn btn-danger" onclick="reiniciarCarrera()">Empezar de nuevo</button>';
}

function resumenCarreraHtml(conf){
  return '<div class="stat-grid">' +
      '<div class="stat-box wide"><div class="v">'+ categoriaActual().nombre +'</div><div class="l">Categoría más alta alcanzada</div></div>' +
      '<div class="stat-box"><div class="v">'+ state.stats.partidos +'</div><div class="l">Partidos dirigidos</div></div>' +
      '<div class="stat-box gold"><div class="v">'+ (conf?conf.toFixed(1):"–") +'</div><div class="l">Valoración media histórica</div></div>' +
      '<div class="stat-box"><div class="v" style="color:var(--yellow);">'+ state.stats.amarillas +'</div><div class="l">Amarillas mostradas</div></div>' +
      '<div class="stat-box red"><div class="v">'+ state.stats.rojas +'</div><div class="l">Rojas mostradas</div></div>' +
      '<div class="stat-box wide gold"><div class="v">'+ fmtMoney(state.ingresos) +'</div><div class="l">Billetera final acumulada</div></div>' +
    '</div>';
}

window.reiniciarCarrera = function(){
  clearInterval(liveTimerHandle);
  detenerAmbienteMultitud();
  borrarGuardado();
  state = nuevoEstado();
  render();
};

/* =========================================================
   INICIO
   ========================================================= */

state = nuevoEstado();
var savedRef = cargarGuardado();
if(savedRef && savedRef.ref && savedRef.ref.nombre){
  // Si ya tiene una partida de árbitro guardada
  state = savedRef;
  state.screen = "mode_select";
}

var savedPres = cargarGuardadoPresidente();
if(savedPres && savedPres.nombre){
  presState = savedPres;
}

currentGameMode = "referee";
sfxEnabled = state.sonido !== false;
render();

})();
</script>
</body>
</html>
