/* =========================================================
   MINIJUEGO 1: REVISIÓN DE INDUMENTARIA EN EL TÚNEL (FIFA Regla 4)
   ========================================================= */
var PROHIBITED_ITEMS = [
  { id:"collar", icon:"📿", nombre:"Cadenita / Collar" },
  { id:"anillo", icon:"💍", nombre:"Anillo Metálico" },
  { id:"aros", icon:"👂", nombre:"Aros Colgantes" },
  { id:"reloj", icon:"⌚", nombre:"Reloj Pulsera" },
  { id:"pulsera", icon:"🧵", nombre:"Pulsera de Hilo" },
  { id:"trinchete", icon:"📎", nombre:"Hebilla / Trinchete" }
];

var tunnelMemoryState = null;
var tunnelTimerHandle = null;

function tickTunnelTimer(){
  if(!tunnelMemoryState || state.screen !== "tunnel_memory" || tunnelMemoryState.completado || tunnelMemoryState.tiempoAgotado){
    clearInterval(tunnelTimerHandle);
    return;
  }
  tunnelMemoryState.tiempoRestante--;

  var timeEl = document.getElementById("tunnelTimerVal");
  var barEl = document.getElementById("tunnelTimerBar");
  if(timeEl){
    var mins = Math.floor(Math.max(0, tunnelMemoryState.tiempoRestante) / 60);
    var secs = Math.max(0, tunnelMemoryState.tiempoRestante) % 60;
    timeEl.textContent = (mins < 10 ? "0" + mins : mins) + ":" + (secs < 10 ? "0" + secs : secs);
    if(tunnelMemoryState.tiempoRestante <= 15){
      timeEl.style.color = "var(--red)";
    }
  }
  if(barEl){
    var pct = Math.max(0, (tunnelMemoryState.tiempoRestante / 60) * 100);
    barEl.style.width = pct + "%";
    barEl.style.background = tunnelMemoryState.tiempoRestante <= 15 ? "var(--red)" : (tunnelMemoryState.tiempoRestante <= 30 ? "var(--yellow)" : "var(--green)");
  }

  if(tunnelMemoryState.tiempoRestante <= 0){
    clearInterval(tunnelTimerHandle);
    tunnelMemoryState.tiempoAgotado = true;
    tunnelMemoryState.bloqueado = true;
    if(!tunnelMemoryState.penalizado){
      tunnelMemoryState.penalizado = true;
      state.match.control = clamp(state.match.control - 15, 0, 100);
      sfxWhistle();
      triggerHaptic("error");
    }
    var footerEl = document.getElementById("tunnelFooterContainer");
    if(footerEl){
      footerEl.innerHTML = '<div class="feedback-box neg" style="margin-top:14px; text-align:center;">' +
        '<div class="feedback-title neg">⚠️ ¡Tiempo Agotado en el Túnel (60s)!</div>' +
        '<div class="headline" style="font-size:13px; margin-top:4px;">No alcanzaste a revisar la indumentaria antes de salir al campo. Hay desconcentración y desorden: <b style="color:var(--red);">-15% de Control de Partido</b>.</div>' +
      '</div>' +
      '<button class="btn btn-gold" style="margin-top:14px; font-size:14px;" onclick="iniciarSorteoCapitanes()">⚽ Salir al Sorteo de Capitanes en la Cancha →</button>';
    }
  }
}

window.iniciarTunelRevision = function(){
  var deck = [];
  PROHIBITED_ITEMS.forEach(function(it){
    deck.push({ id: it.id, icon: it.icon, nombre: it.nombre, uid: it.id+"_a" });
    deck.push({ id: it.id, icon: it.icon, nombre: it.nombre, uid: it.id+"_b" });
  });
  deck = shuffle(deck);

  clearInterval(tunnelTimerHandle);

  tunnelMemoryState = {
    cards: deck,
    flipped: [],
    matchedIds: {},
    intentos: 0,
    completado: false,
    bloqueado: false,
    tiempoRestante: 60,
    tiempoAgotado: false,
    penalizado: false
  };

  state.screen = "tunnel_memory";
  render();
  tunnelTimerHandle = setInterval(tickTunnelTimer, 1000);
};

window.voltearCartaMemoria = function(idx, event){
  if(event){
    if(event.preventDefault) event.preventDefault();
    if(event.stopPropagation) event.stopPropagation();
  }
  var s = tunnelMemoryState;
  if(!s || s.bloqueado || s.completado || s.tiempoAgotado) return;
  if(s.flipped.indexOf(idx) !== -1) return;
  if(s.matchedIds[s.cards[idx].id]) return;

  sfxCardFlip();
  s.flipped.push(idx);

  var cardEl = document.getElementById("memCard_" + idx);
  if(cardEl) cardEl.classList.add("flipped");

  if(s.flipped.length === 2){
    s.intentos++;
    var attemptsEl = document.getElementById("tunnelAttemptsCount");
    if(attemptsEl) attemptsEl.textContent = s.intentos;

    var idx1 = s.flipped[0];
    var idx2 = s.flipped[1];
    var c1 = s.cards[idx1];
    var c2 = s.cards[idx2];

    if(c1.id === c2.id){
      // Coincidencia
      s.matchedIds[c1.id] = true;
      s.flipped = [];
      sfxCardMatch();
      triggerHaptic("success");

      var el1 = document.getElementById("memCard_" + idx1);
      var el2 = document.getElementById("memCard_" + idx2);
      if(el1) el1.classList.add("matched");
      if(el2) el2.classList.add("matched");

      // Comprobar si completó todos los 6 pares
      var totalMatches = Object.keys(s.matchedIds).length;
      var matchesEl = document.getElementById("tunnelMatchesCount");
      if(matchesEl) matchesEl.textContent = totalMatches + "/" + PROHIBITED_ITEMS.length;

      if(totalMatches === PROHIBITED_ITEMS.length){
        s.completado = true;
        clearInterval(tunnelTimerHandle);
        // Bonificación
        state.match.control = clamp(state.match.control + 5, 0, 100);
        state.fama = clamp(state.fama + 1, 0, 100);

        var footerEl = document.getElementById("tunnelFooterContainer");
        if(footerEl){
          footerEl.innerHTML = '<div class="feedback-box pos" style="margin-top:14px; text-align:center;">' +
            '<div class="feedback-title pos">✅ ¡Revisión Impecable en Tiempo Récord!</div>' +
            '<div class="headline" style="font-size:13px; margin-top:4px;">Todos los futbolistas retiraron los accesorios peligrosos. Ganás <b style="color:var(--green);">+5 Control</b> y <b style="color:var(--gold);">+1 Fama</b>.</div>' +
          '</div>' +
          '<button class="btn btn-gold" style="margin-top:14px; font-size:14px;" onclick="iniciarSorteoCapitanes()">⚽ Salir al Sorteo de Capitanes en la cancha →</button>';
        }
      }
    } else {
      // No coincide, dar tiempo para memorizar y dar vuelta sin recrear el DOM
      s.bloqueado = true;
      setTimeout(function(){
        if(s.tiempoAgotado) return;
        var el1 = document.getElementById("memCard_" + idx1);
        var el2 = document.getElementById("memCard_" + idx2);
        if(el1) el1.classList.remove("flipped");
        if(el2) el2.classList.remove("flipped");
        s.flipped = [];
        s.bloqueado = false;
      }, 650);
    }
  }
};

  } else {

  return topbar() +

      '<h2 class="section-title" style="margin-top:4px;">Revisión de Indumentaria</h2>' +

];

function generarTickComentario(m){
  var r = Math.random();
  if(r < 0.026){
    var esLocal = Math.random() < 0.5;
    if(esLocal) m.golesLocal++; else m.golesVisitante++;
    var equipoGol = esLocal ? m.local : m.visitante;
    var txtGol = pick(COMENTARIOS_GOL).replace(/\{eq\}/g, equipoGol);
    m.ticker.push({ minuto:m.minuto, texto:"⚽ "+txtGol, gol:true });
    sfxGol();
  } else if(r < 0.38){
    var equipo2 = Math.random() < 0.5 ? m.local : m.visitante;
    var txt = pick(COMENTARIOS_JUEGO).replace(/\{eq\}/g, equipo2);
    m.ticker.push({ minuto:m.minuto, texto: txt });
  }
  if(Math.random() < 0.035){ sfxCantico(0.65); }
}

function renderActivePlaysHtml(m){
  if(!m || !m.ticker || !m.ticker.length){
    return '<div class="active-play-item"><span style="color:var(--text-faint);">⏱️ Esperando la próxima acción en el terreno...</span></div>';
  }
  // Tomamos solo las últimas 3 jugadas activas: las anteriores se van borrando por arriba
  var activeSlice = m.ticker.slice(-3);
  return activeSlice.map(function(item, idx){
    var isNewest = idx === activeSlice.length - 1;
    var isOldest = idx === 0 && activeSlice.length > 1;
    var cls = "active-play-item" + (isNewest ? " current" : (isOldest ? " old" : "")) + (item.gol ? " gol" : "");
    return '<div class="' + cls + '">' +
      '<span class="ticker-min" style="color:var(--gold); font-family:var(--font-display); font-size:13px; font-weight:700; width:34px; flex:none;">' + item.minuto + "'</span>" +
      '<span class="ticker-txt" style="flex:1; font-size:13px; line-height:1.4; color:#fff;">' + item.texto + '</span>' +
    '</div>';
  }).join("");
}

function renderMatchTimelineHtml(ticker){
  if(!ticker || !ticker.length) return "";
  var rows = ticker.map(function(item){
    return '<div class="timeline-event-row' + (item.gol ? " gol" : "") + '">' +
      '<span class="timeline-event-min">' + item.minuto + "'</span>" +
      '<span class="timeline-event-txt">' + item.texto + '</span>' +
    '</div>';
  }).join("");

  return '<div class="match-timeline-accordion">' +
    '<div class="eyebrow" style="color:var(--gold);">📜 Cronología Completa de Jugadas del Partido (90\')</div>' +
    '<div class="timeline-scroll-feed">' + rows + '</div>' +
  '</div>';
}

function getLiveTickMs(){
  return Math.round(BASE_TICK_MS / LIVE_SPEED_MULT);
}

window.cambiarVelocidadLive = function(mult){
  LIVE_SPEED_MULT = mult;
  if(liveTimerHandle && state.screen === "matchLive"){
    clearInterval(liveTimerHandle);
    liveTimerHandle = setInterval(tickLive, getLiveTickMs());
  }
  render();
};

window.saltarAlEventoLive = function(){
  var m = state.match;
  if(!m) return;
  clearInterval(liveTimerHandle);
  if(!m.descansoMostrado && m.minutoDestino > 45 && m.minuto < 45){
    m.minuto = 45;
    m.descansoMostrado = true;
    sfxWhistle();
    iniciarConfrontacionCapitanEntretiempo();
    return;
  }
  m.minuto = m.minutoDestino;
  resolverLlegadaEnVivo();
};

function iniciarTramoEnVivo(destino, onLlegada){
  var m = state.match;
  if(!m.ticker) m.ticker = [];
  if(!m.arrancoTicker){
    m.arrancoTicker = true;
    m.ticker.push({ minuto:0, texto:"⚽ ¡Pitazo inicial! Rueda la pelota en el choque "+ m.local +" vs "+ m.visitante +"." });
    iniciarAmbienteMultitud();
    sfxWhistle();
  }
  m._lastRenderedTickerLen = -1;
  m.minutoDestino = destino;
  m.onLlegada = onLlegada;
  state.screen = "matchLive";
  render();
  clearInterval(liveTimerHandle);
  liveTimerHandle = setInterval(tickLive, getLiveTickMs());
}

function tickLive(){
  var m = state.match;
  if(!m || state.screen !== "matchLive"){ clearInterval(liveTimerHandle); return; }
  if(m.minuto >= m.minutoDestino){
    clearInterval(liveTimerHandle);
    resolverLlegadaEnVivo();
    return;
  }
  m.minuto++;
  if(m.minuto === 45 && !m.descansoMostrado && m.minutoDestino > 45){
    m.descansoMostrado = true;
    clearInterval(liveTimerHandle);
    sfxWhistle();
    iniciarConfrontacionCapitanEntretiempo();
    return;
  }
  generarTickComentario(m);
  
  // Actualización limpia en vivo del DOM para evitar parpadeos y bugs de scroll
  var minEl = document.getElementById("liveMinuteEl");
  if(minEl) minEl.textContent = "⏱️ Minuto " + m.minuto + "'";
  var scoreEl = document.getElementById("liveScoreEl");
  if(scoreEl) scoreEl.textContent = m.golesLocal + " - " + m.golesVisitante;
  var stageEl = document.getElementById("liveActiveFeed");
  if(stageEl && m.ticker && m.ticker.length !== m._lastRenderedTickerLen){
    m._lastRenderedTickerLen = m.ticker.length;
    stageEl.innerHTML = renderActivePlaysHtml(m);
  }
  var fillEl = document.getElementById("liveMeterFillEl");
  if(fillEl){
    fillEl.style.width = Math.round(m.control) + "%";
    fillEl.style.background = controlColor(m.control);
  }
}

function resolverLlegadaEnVivo(){
  var m = state.match;
  var accion = m.onLlegada;
  if(accion === "final"){
    m.ticker.push({ minuto:m.minuto, texto:"🏁 ¡Final del partido! Pitazo final: "+ m.local +" "+ m.golesLocal +" - "+ m.golesVisitante +" "+ m.visitante +"." });
    sfxSilbatoFinal();
    render();
    setTimeout(function(){ detenerAmbienteMultitud(); cerrarPartido(); }, 1000);
  } else {
    state.screen = "event";
    render();
  }
}

window.iniciarMinijuegoFuerzaEntretiempo = function(){
  halftimePowerState = {
    fuerza: 50,
    tiempoRestante: 6.0,
    intervalo: null,
    resuelto: false,
    totalTaps: 0
  };
  state.screen = "halftime_power_game";
  render();

  if(halftimePowerState.intervalo) clearInterval(halftimePowerState.intervalo);
  halftimePowerState.intervalo = setInterval(function(){
    if(!halftimePowerState || halftimePowerState.resuelto || state.screen !== "halftime_power_game"){
      if(halftimePowerState && halftimePowerState.intervalo) clearInterval(halftimePowerState.intervalo);
      return;
    }
    // El capitán empuja continuamente hacia atrás (-0.65% cada 40ms)
    halftimePowerState.fuerza = Math.max(0, halftimePowerState.fuerza - 0.65);
    halftimePowerState.tiempoRestante -= 0.04;

    var fillEl = document.getElementById("powerFillEl");
    var valEl = document.getElementById("powerValEl");
    var timerEl = document.getElementById("powerTimerEl");
    var statusEl = document.getElementById("powerStatusEl");
    var refG = document.getElementById("powerRefGroup");
    var capG = document.getElementById("powerCapGroup");

    var f = Math.round(halftimePowerState.fuerza);
    var color = f >= 65 ? "var(--green)" : (f >= 40 ? "var(--gold)" : "var(--red)");

    if(fillEl){
      fillEl.style.width = f + "%";
      fillEl.style.backgroundColor = color;
      fillEl.style.boxShadow = "0 0 14px " + color;
    }
    if(valEl){
      valEl.textContent = f + "%";
      valEl.style.color = color;
    }
    if(timerEl){
      timerEl.textContent = Math.max(0, halftimePowerState.tiempoRestante).toFixed(1) + "s";
    }
    if(statusEl){
      if(f >= 65){
        statusEl.textContent = "💪 ¡TE PLANTÁS COMO UNA ROCA! ¡NO TE MUEVE!";
        statusEl.style.background = "rgba(0,230,118,0.18)";
        statusEl.style.color = "var(--green)";
        statusEl.style.border = "1px solid var(--green)";
      } else if(f >= 40){
        statusEl.textContent = "⚔️ ¡FORCEJEO CUERPO A CUERPO! ¡APRETÁ MÁS RÁPIDO!";
        statusEl.style.background = "rgba(240,196,25,0.18)";
        statusEl.style.color = "var(--gold)";
        statusEl.style.border = "1px solid var(--gold)";
      } else {
        statusEl.textContent = "⚠️ ¡EL CAPITÁN TE ESTÁ HACIENDO RETROCEDER!";
        statusEl.style.background = "rgba(255,77,94,0.18)";
        statusEl.style.color = "var(--red)";
        statusEl.style.border = "1px solid var(--red)";
      }
    }

    var offset = (halftimePowerState.fuerza - 50) * 0.35;
    if(refG) refG.setAttribute("transform", "translate(" + offset + ", 0)");
    if(capG) capG.setAttribute("transform", "translate(" + offset + ", 0)");

    if(halftimePowerState.tiempoRestante <= 0){
      clearInterval(halftimePowerState.intervalo);
      halftimePowerState.resuelto = true;
      finalizarMinijuegoFuerzaEntretiempo();
    }
  }, 40);
};
function iniciarMinijuegoFuerzaEntretiempo(){
  window.iniciarMinijuegoFuerzaEntretiempo();
}

window.empujarFuerzaEntretiempo = function(){
  if(!halftimePowerState || halftimePowerState.resuelto || state.screen !== "halftime_power_game") return;
  halftimePowerState.fuerza = Math.min(100, halftimePowerState.fuerza + 4.8);
  halftimePowerState.totalTaps++;
  triggerHaptic("selection");

  var btn = document.getElementById("powerMashBtn");
  if(btn){
    btn.style.transform = "scale(0.96) translateY(2px)";
    setTimeout(function(){ if(btn) btn.style.transform = ""; }, 60);
  }
};

document.addEventListener("keydown", function(e){
  if(state.screen === "halftime_power_game" && (e.code === "Space" || e.key === " ")){
    e.preventDefault();
    window.empujarFuerzaEntretiempo();
  }
});

window.finalizarMinijuegoFuerzaEntretiempo = function(){
  var m = state.match;
  var finalF = halftimePowerState.fuerza;
  var exito = finalF >= 50;

  var deltaControl = exito ? 12 : -12;
  var deltaFama = exito ? 2 : -2;
  var deltaNota = exito ? 0.3 : -0.4;

  m.control = clamp(m.control + deltaControl, 0, 100);
  state.fama = clamp(state.fama + deltaFama, 0, 100);
  m.nota = Math.max(1, m.nota + deltaNota);

  m.halftimePowerResult = {
    exito: exito,
    finalFuerza: finalF,
    totalTaps: halftimePowerState.totalTaps,
    deltaControl: deltaControl,
    deltaFama: deltaFama,
    deltaNota: deltaNota,
    capitanNombre: (m.halftimeConfrontation && m.halftimeConfrontation.capitanNombre) || "Capitán"
  };

  triggerHaptic(exito ? "success" : "error");
  if(exito) sfxWhistle(); else sfxCantico(1.2);

  state.screen = "halftime_power_result";
  render();
};
function finalizarMinijuegoFuerzaEntretiempo(){
  window.finalizarMinijuegoFuerzaEntretiempo();
}

window.elegirOpcion = function(i){
  var m = state.match;
  var ev = m.eventos[m.idx];
  var op = ev.opciones[i];
  var estilo = estiloActual();

  var efectos = {
    nota: op.efectos.nota || 0,
    control: op.efectos.control || 0,
    fama: op.efectos.fama || 0
  };

  // Bonus de reloj inteligente si es descuento
  if(ev.id === "descuento" && state.compras["reloj_spintso"] && efectos.nota > 0){
    efectos.nota += 1.0;
  }

  var sinergia = false;
  if(estilo && op.tipo===estilo.bonusTipo){
    efectos.control += estilo.bonusControl;
    efectos.fama += estilo.bonusFama;
    sinergia = true;
  }

  m.nota = m.nota + efectos.nota;
  m.control = clamp(m.control + efectos.control, 0, 100);
  state.fama = clamp(state.fama + efectos.fama, 0, 100);

  if(op.tarjeta==="amarilla"){ m.amarillas++; }
  if(op.tarjeta==="roja"){ m.rojas++; }
  var PENAL_EN_OPCION_0 = ["mano_area","plancha_penal","mano_intencional"];
  var PENAL_EN_OPCION_1 = ["simulacion_area","simulacion_area_real"];
  if(PENAL_EN_OPCION_0.indexOf(ev.id)!==-1 && i===0){ m.penales++; }
  if(PENAL_EN_OPCION_1.indexOf(ev.id)!==-1 && i===1){ m.penales++; }

  // Calcular efecto de soborno si existe
  var bribeDelta = 0;
  if(m.soborno){
    var resSob = calcularEfectoSoborno(ev.id, i, m.soborno.equipo);
    bribeDelta = resSob.delta;
    m.soborno.satisfaccion = clamp(m.soborno.satisfaccion + bribeDelta, 0, 100);
  }

  // Determinar tipo de animación visual
  var animType = "silbato";
  var resLower = (op.resultado || "").toLowerCase();
  var txtLower = (op.texto || "").toLowerCase();
  var evId = (ev.id || "").toLowerCase();

  if(ev.id === "descuento"){
    animType = "cartel_descuento";
  } else if(op.tarjeta === "roja" || resLower.indexOf("roja") !== -1 || txtLower.indexOf("roja") !== -1 || resLower.indexOf("expuls") !== -1){
    animType = "tarjeta_roja";
  } else if(op.tarjeta === "amarilla" || resLower.indexOf("amarilla") !== -1 || txtLower.indexOf("amarilla") !== -1 || resLower.indexOf("amonest") !== -1){
    animType = "tarjeta_amarilla";
  } else if(evId.indexOf("var") !== -1 || txtLower.indexOf("pantalla") !== -1 || resLower.indexOf("var") !== -1 || txtLower.indexOf("var") !== -1){
    animType = "var_check";
  } else if(resLower.indexOf("penal") !== -1 || txtLower.indexOf("penal") !== -1 || resLower.indexOf("doce pasos") !== -1){
    animType = "gesto_penal";
  } else if(resLower.indexOf("siga") !== -1 || txtLower.indexOf("seguir") !== -1 || resLower.indexOf("correr") !== -1 || resLower.indexOf("pegada al cuerpo") !== -1){
    animType = "gesto_siga";
  } else if(op.tipo === "verbal" || resLower.indexOf("calm") !== -1 || resLower.indexOf("habl") !== -1 || resLower.indexOf("avisa") !== -1){
    animType = "gesto_calma";
  }

  var esAcierto = (op.acierto !== undefined) ? op.acierto : (efectos.nota >= 0);

  // Respuesta háptica sutil en el dispositivo
  triggerHaptic(esAcierto ? "success" : "decision");

  if(op.tarjeta){ sfxTarjeta(); }

  m.lastFeedback = {
    resultado: op.resultado,
    efectos: efectos,
    tarjeta: op.tarjeta || null,
    sinergia: sinergia,
    bribeDelta: bribeDelta,
    animType: animType,
    acierto: esAcierto,
    minutosDescuento: op.minutos || (ev.id==="descuento" ? 5 : null)
  };

  if(esJugadaGrave(ev, op)){
    iniciarMinijuegoTension();
  } else {
    state.screen = "feedback";
    render();
  }
};

/* =========================================================
   MINIJUEGO: MANTENER LA AUTORIDAD (barra de tensión precisa)
   ========================================================= */
function esJugadaGrave(ev, op){
  if(op.tarjeta === "roja") return true;
  var tagLower = (ev.tag || "").toLowerCase();
  if(tagLower.indexOf("grave") !== -1) return true;
  if(tagLower.indexOf("violenta") !== -1) return true;
  return false;
}

var tensionAnimHandle = null;
var tensionState = null;
var TENSION_PERIODO_MS = 1850; // Ritmo cómodo y preciso
var TENSION_ZONA = { min:37.5, max:62.5 }; // Zona verde central exacta de 25% de ancho

function posicionAguja(){
  if(!tensionState) return 50;
  var elapsed = performance.now() - tensionState.inicio;
  var frac = (elapsed % TENSION_PERIODO_MS) / TENSION_PERIODO_MS;
  // Curva sinusoidal suave de ida y vuelta de 4% a 96%
  var rad = frac * Math.PI * 2;
  var sinVal = (Math.sin(rad - Math.PI/2) + 1) / 2; // de 0 a 1
  return 4 + sinVal * 92;
}

function iniciarMinijuegoTension(){
  tensionState = { inicio: performance.now(), resuelto:false, hitPos:50 };
  state.screen = "tension";
  render();
  cancelAnimationFrame(tensionAnimHandle);
  tensionLoop();
}

function tensionLoop(){
  if(!tensionState || tensionState.resuelto || state.screen !== "tension"){ return; }
  var needle = document.getElementById("tensionNeedle");
  if(needle){
    var pos = posicionAguja();
    needle.style.left = pos.toFixed(2) + "%";
  }
  tensionAnimHandle = requestAnimationFrame(tensionLoop);
}

window.intentarControlarTension = function(){
  if(!tensionState || tensionState.resuelto) return;
  tensionState.resuelto = true;
  cancelAnimationFrame(tensionAnimHandle);

  var pos = posicionAguja();
  tensionState.hitPos = pos;

  // Congelar la aguja en el DOM instantáneamente en el valor exacto
  var needle = document.getElementById("tensionNeedle");
  var exito = (pos >= TENSION_ZONA.min && pos <= TENSION_ZONA.max);

  if(needle){
    needle.style.left = pos.toFixed(2) + "%";
    needle.classList.add(exito ? "hit" : "miss");
  }

  var m = state.match;
  var fb = m.lastFeedback;
  var deltaControl = exito ? rand(5,9) : -rand(10,16);
  var deltaNota = exito ? 0.3 : -0.5;

  m.control = clamp(m.control + deltaControl, 0, 100);
  m.nota = m.nota + deltaNota;
  fb.tension = { exito:exito, deltaControl:deltaControl, deltaNota:deltaNota, pos:pos };

  triggerHaptic(exito ? "success" : "error");
  if(exito){ sfxWhistle(); } else { sfxCantico(1.3); }

  // Breve pausa para que el jugador aprecie la aguja congelada en el lugar exacto donde clickeó
  setTimeout(function(){
    state.screen = "tensionResultado";
    render();
  }, 420);
};

document.addEventListener("keydown", function(e){
  if(state.screen === "tension" && (e.code === "Space" || e.key === " ")){

/* ---------- CIERRE DE PARTIDO ---------- */
function cerrarPartido(){
  var m = state.match;
  var notaFinal = m.nota;

  if(m.control < 30) notaFinal -= 1.5;
  else if(m.control > 80) notaFinal += 0.4;

  notaFinal = clamp(Math.round(notaFinal*10)/10, 1, 10);

  var cat = categoriaActual();
  var pagoBase = cat.salario * (0.65 + notaFinal/10);
  state.ingresos += Math.round(pagoBase);

  // Pago de soborno según satisfacción
  var extraSoborno = 0;
  var mensajeSoborno = "";
  if(m.soborno){
    if(m.soborno.satisfaccion >= 65){
      extraSoborno = m.soborno.monto;
      state.ingresos += extraSoborno;
      mensajeSoborno = "💼 <b>Trato cumplido:</b> El dirigente de "+ m.soborno.equipoNombre +" quedó sumamente satisfecho y te entrega el sobre completo de "+ fmtMoney(extraSoborno) +".";
    } else if(m.soborno.satisfaccion >= 40){
      extraSoborno = Math.round(m.soborno.monto * 0.4);
      state.ingresos += extraSoborno;
      mensajeSoborno = "💼 <b>Pago parcial:</b> “No cobraste todo lo que pedimos”. Te entregan el 40% del sobre ("+ fmtMoney(extraSoborno) +").";
    } else {
      state.fama = clamp(state.fama - 6, 0, 100);
      mensajeSoborno = "⚠️ <b>Dirigente furioso:</b> No cumpliste el acuerdo. No ves ni un peso y recibís llamados amenazantes tras el partido (-Fama).";
    }
  }

  state.stats.partidos++;
  state.stats.amarillas += m.amarillas;
  state.stats.rojas += m.rojas;
  state.stats.penales += m.penales;

  state.carreraNotas.push(notaFinal);
  state.temporadaNotas.push(notaFinal);

  m.notaFinal = notaFinal;
  m.pago = Math.round(pagoBase);
  m.extraSoborno = extraSoborno;
  m.mensajeSoborno = mensajeSoborno;

  // Reacción de los hinchas en redes según la nota del veedor
  var tierMeme = notaFinal >= 8.5 ? "excelente" : (notaFinal >= 7 ? "buena" : (notaFinal >= 5.5 ? "normal" : "mala"));
  agregarPostRedes({
    tipo: "meme",
    icon: tierMeme==="excelente" ? "🔥" : (tierMeme==="buena" ? "👍" : (tierMeme==="normal" ? "😐" : "🤦")),
    plataforma: pick(["Twitter/X", "TikTok", "Instagram", "Foro de Hinchas"]),
    texto: pick(MEMES_HINCHAS[tierMeme]) + " (Partido: "+ m.local +" "+ m.golesLocal +"-"+ m.golesVisitante +" "+ m.visitante +", nota "+ notaFinal.toFixed(1) +")",
    tono: tierMeme==="excelente"||tierMeme==="buena" ? "pos" : (tierMeme==="mala" ? "neg" : "neu")
  });

  // Historial detallado de designaciones
  if(!Array.isArray(state.historialPartidos)) state.historialPartidos = [];
  state.historialPartidos.unshift({
    fecha: state.fecha,
    categoria: cat.corto,
    local: m.local,
    visitante: m.visitante,
    golesLocal: m.golesLocal,
    golesVisitante: m.golesVisitante,
    notaFinal: notaFinal,
    amarillas: m.amarillas,
    rojas: m.rojas,
    penales: m.penales,
    pago: Math.round(pagoBase),
    extraSoborno: extraSoborno
  });
  if(state.historialPartidos.length > 60) state.historialPartidos = state.historialPartidos.slice(0, 60);

  // Iniciar Conferencia de Prensa tras el partido
  state.pressConference = generarConferenciaDePrensa(m);
  state.screen = "press_conference";
  render();
}

window.responderPrensa = function(optIdx){
  var conf = state.pressConference;
  var idx = conf.indiceActual || 0;
  var pregObj = conf.preguntas[idx];
  if(pregObj.respondida) return;
  triggerHaptic("decision");
  var op = pregObj.opciones[optIdx];
  pregObj.respondida = true;
  pregObj.opcionElegida = op;

  state.fama = clamp(state.fama + (op.famaDelta || 0), 0, 100);

  agregarPostRedes({
    tipo: "declaracion",
    icon: "🎙️",
    plataforma: pregObj.medio,
    texto: "📰 " + op.titular,
    tono: (op.famaDelta||0) > 0 ? "pos" : ((op.famaDelta||0) < 0 ? "neg" : "neu")
  });

  render();
};

window.avanzarCalendario = function(){

};

/* ---------- CIERRE DE TEMPORADA ---------- */
function cerrarTemporada(){
  var avg = promedio(state.temporadaNotas);
  var cat = categoriaActual();
  var resultado = { avg: Math.round(avg*10)/10, categoriaAnterior: cat.nombre, movimiento:"mantiene", mensaje:"" };

  if(avg >= 8){
    if(state.catIndex < CATEGORIAS.length-1){
      state.catIndex++;
      resultado.movimiento = "ascenso";
      resultado.mensaje = "La Federación te asciende a "+ CATEGORIAS[state.catIndex].nombre +" por tu excelente temporada.";
      state.seasonsBajas = 0;
    } else {
      resultado.mensaje = "Ya estás en la cima del arbitraje. Consolidás tu lugar en el Mundial.";
      state.seasonsBajas = 0;
    }
  } else if(avg < 5){
    state.seasonsBajas++;
    if(state.seasonsBajas >= 2){
      state.despedido = true;
      resultado.movimiento = "despido";
      resultado.mensaje = "Dos temporadas flojas consecutivas. La Federación decide desvincularte del cuerpo arbitral.";
    } else if(state.catIndex > 0){
      state.catIndex--;
      resultado.movimiento = "descenso";
      resultado.mensaje = "Tras una temporada floja, te reasignan a "+ CATEGORIAS[state.catIndex].nombre +".";
    } else {
      resultado.movimiento = "sancion";
      resultado.mensaje = "Recibís una seria advertencia de la Federación. Una temporada más así y quedás fuera.";
    }
  } else {
    resultado.mensaje = "Temporada pareja, sin sobresaltos. Seguís en "+ cat.nombre +".";
    state.seasonsBajas = 0;
  }

  state.lastSeasonResult = resultado;
  state.temporadaNotas = [];
  state.bajadasTemporada = 0; // Se resetea el contador de bajadas por temporada
  state.fecha = 1;
  state.ref.edad++;

  if(state.despedido){
    state.screen = "gameover";
  } else if(state.ref.edad >= 48){
    state.retirado = true;
    state.screen = "retirement";
  } else {
    state.screen = "seasonSummary";
  }
  render();
}

  var r = state.lastSeasonResult;

  var tag = { ascenso:"ASCENSO", descenso:"DESCENSO", sancion:"ADVERTENCIA", mantiene:"SE MANTIENE" }[r.movimiento] || "TEMPORADA CERRADA";

    { id: "pres_achievements", label: "🏆 Logros", icon: "🏆" }
  ];

  var html = '<div class="pres-nav-tabs">';
  for(var i = 0; i < tabs.length; i++){
    var t = tabs[i];
    var activeCls = currentScreen === t.id ? " active" : "";

  return html;
}

window.seleccionarDirigentePreStart = function(id){
  tempDirigenteAvatarId = id;
  var d = AVATARES_DIRIGENTES.find(function(it){ return it.id === id; });
  if(d){
    var inp = document.getElementById("inpPresNombre");
    if(inp){
      var esNombreCatalogo = AVATARES_DIRIGENTES.some(function(other){ return other.nombre === inp.value.trim(); });
      if(!inp.value.trim() || esNombreCatalogo || inp.value.trim() === "Ángel Sánchez" || inp.value.trim() === "Presidente del Colegio"){
        inp.value = d.nombre;
      }
    }
  }
  render();
};

function presHudCard(icon, valueDisplay, label, pct, delta, statusText){
  var stateCls = pct===null ? "" : (pct>=65?"good":(pct>=40?"warn":"bad"));

  if(delta){
    var cls = delta>0 ? "up" : "down";
    var sign = delta>0 ? "+" : "";
    deltaHtml = '<span class="pres-hud-delta '+cls+'">'+sign+delta+'</span>';
  }
  var barColor = pct===null ? "" : (pct>=65?"var(--green)":(pct>=40?"var(--gold)":"var(--red)"));
  var barHtml = pct===null ? "" : '<div class="pres-hud-track"><div class="pres-hud-track-fill" style="width:'+clamp(pct,0,100)+'%; background:'+barColor+';"></div></div>';
  return '<div class="pres-hud-card '+stateCls+'">' +
    '<div class="pres-hud-top"><span class="pres-hud-icon">'+icon+'</span>'+deltaHtml+'</div>' +
    '<div class="pres-hud-value">'+valueDisplay+'</div>' +
    '<div class="pres-hud-label">'+label+'</div>' +
    barHtml +
    (statusText ? '<div class="pres-hud-status">'+statusText+'</div>' : '') +
  '</div>';
}

function agregarNoticiaPeriodico(ps, noticia){
  if(!Array.isArray(ps.periodico)) ps.periodico = [];
  noticia.id = "news_" + Date.now() + "_" + Math.floor(Math.random()*9999);
  noticia.fecha = ps.fecha;
  noticia.temporada = ps.temporada;
  ps.periodico.unshift(noticia);
  if(ps.periodico.length > 40) ps.periodico = ps.periodico.slice(0, 40);
}

window.resolverEventoPresidente = function(idx){
  var ps = presState;
  var ev = ps.eventoActual;
  var op = ev.opciones[idx];

  ps.fondos = Math.max(0, ps.fondos + op.fondosDelta);
  ps.confianzaAFA = clamp(ps.confianzaAFA + op.confianzaDelta, 0, 100);
  ps.reputacionPublica = clamp(ps.reputacionPublica + op.reputacionDelta, 0, 100);
  ps.moralPlantel = clamp(ps.moralPlantel + op.moralDelta, 0, 100);

  ps.hudDeltas = {
    confianzaAFA: op.confianzaDelta || 0,
    reputacionPublica: op.reputacionDelta || 0,
    fondos: op.fondosDelta || 0,
    moralPlantel: op.moralDelta || 0
  };

  ps.resultadoEvento = {
    titulo: ev.titulo,
    opcion: op,
    impacto: op.impacto
  };

  var tono = (op.confianzaDelta||0) + (op.reputacionDelta||0) + (op.moralDelta||0);
  agregarNoticiaPeriodico(ps, {
    tipo: "evento",
    icon: "📞",
    titular: ev.titulo,
    cuerpo: op.impacto,
    tag: tono > 0 ? "positivo" : (tono < 0 ? "negativo" : "neutral")
  });

  ps.eventoActual = null;
  ps.eventoResueltoFecha = true;
  ps.screen = "pres_assign";
  guardarPresidente();
  render();
};

function obtenerTodosPartidosFecha(fecha){
  var ps = presState;
  var acLevel = (ps && ps.academiaNivel) ? ps.academiaNivel : 1;
  var nivelObj = PRES_ACADEMIA_NIVELES.find(function(n){ return n.nivel === acLevel; }) || PRES_ACADEMIA_NIVELES[0];
  var cuotas = (nivelObj && nivelObj.cuotas) ? nivelObj.cuotas : { liga: 3, nacional: 2, bmetro: 2, regional: 2 };

  var fixIdx = (fecha - 1) % 10;
  var list = [];
  PRES_DIVISIONES.forEach(function(d){
    var fixDiv = PRES_FIXTURES_POR_DIVISION[d.id] || PRES_FIXTURES_POR_DIVISION.liga;
    var partidos = fixDiv[fixIdx] || fixDiv[0];
    var maxCuota = cuotas[d.id] || partidos.length;
    var seleccionados = partidos.slice(0, maxCuota);
    seleccionados.forEach(function(m, idx){
      list.push({
        desKey: d.id + "_" + idx,
        divId: d.id,
        divNombre: d.nombre,
        divIcon: d.icon,
        idx: idx,
        match: m
      });
    });
  });
  return list;
}

function screenPresidentAssign(){
  var ps = presState;
  var todosPartidos = obtenerTodosPartidosFecha(ps.fecha);
  var totalMatches = todosPartidos.length;

  if(!ps.designaciones) ps.designaciones = {};

  // Build assigned reverse map: refId => { desKey, matchTitle, divNombre }
  var assignedRefsMap = {};
  var assignedCount = 0;
  for(var i=0; i<todosPartidos.length; i++){
    var item = todosPartidos[i];
    var rId = ps.designaciones[item.desKey];
    if(rId){
      assignedRefsMap[rId] = {
        desKey: item.desKey,
        matchTitle: item.match.local + " vs " + item.match.visitante,
        divNombre: item.divNombre
      };
      assignedCount++;

  // Referees in rest
  var restingRefs = ps.arbitros.filter(function(a){ return !assignedRefsMap[a.id]; });

  // Generate sections for all 4 divisions
  var divisionSectionsHtml = PRES_DIVISIONES.map(function(d){
    var divisionMatches = todosPartidos.filter(function(it){ return it.divId === d.id; });
    if(!divisionMatches.length) return "";

    var matchesInDivHtml = divisionMatches.map(function(item){
      var desKey = item.desKey;
      var m = item.match;
      var currentRefId = ps.designaciones[desKey] || "";

      if(!refObj){

      var triggerHtml;

        triggerHtml = '<button type="button" class="ref-select-trigger" onclick="abrirSelectorArbitro(\'' + desKey + '\')">' +

    var recoveryPreview = Math.min(100, a.energia + recoveryRate);

window.cambiarDesignacionGlobal = function(targetKey, newRefId){
  var ps = presState;
  if(!ps.designaciones) ps.designaciones = {};
  
  if(!newRefId){
    delete ps.designaciones[targetKey];
    triggerHaptic("light");
    guardarPresidente();
    render();
    return;
  }

  // If this ref was already assigned to another match in this date, remove from other match
  for(var k in ps.designaciones){
    if(ps.designaciones[k] === newRefId && k !== targetKey){
      delete ps.designaciones[k];
    }
  }

  ps.designaciones[targetKey] = newRefId;
  triggerHaptic("decision");
  guardarPresidente();
  render();
};

window.autoAsignarTernasFecha = function(){
  var ps = presState;
  if(!ps) return;
  var todos = obtenerTodosPartidosFecha(ps.fecha);
  
  // Sort matches by difficulty descending
  var sortedMatches = todos.slice().sort(function(a, b){
    return b.match.dif - a.match.dif;
  });

  // Sort referees by energy, temple and fisico descending
  var availableRefs = ps.arbitros.slice().sort(function(a, b){
    var scoreA = (a.energia * 2) + a.temple + a.fisico;
    var scoreB = (b.energia * 2) + b.temple + b.fisico;
    return scoreB - scoreA;
  });

  var assignedMap = {};
  var usedRefs = {};

  sortedMatches.forEach(function(item){
    var candidate = availableRefs.find(function(r){
      return !usedRefs[r.id];
    });
    if(candidate){
      assignedMap[item.desKey] = candidate.id;
      usedRefs[candidate.id] = true;
    }
  });

  ps.designaciones = assignedMap;
  triggerHaptic("success");
  guardarPresidente();
  render();
};

window.confirmarYSimularFecha = function(){
  var ps = presState;
  var todos = obtenerTodosPartidosFecha(ps.fecha);
  var unassigned = todos.filter(function(it){
    return !ps.designaciones || !ps.designaciones[it.desKey];
  });

  if(unassigned.length > 0){
    if(confirm("Hay " + unassigned.length + " partido(s) sin árbitro asignado. ¿Deseás auto-designar a los mejores árbitros disponibles y simular la fecha?")){
      window.autoAsignarTernasFecha();
      sfxWhistle();
      simularFechaCompleta();
    }
    return;
  }

  triggerHaptic("success");
  sfxWhistle();
  simularFechaCompleta();
};

function simularFechaCompleta(){
  var ps = presState;
  var todos = obtenerTodosPartidosFecha(ps.fecha);

  var assignedSet = {};
  var resultadosPartidos = [];
  var totalNota = 0;
  var promocionesPlantel = [];

  // Salarios por división y descanso
  var salarioPorDivision = {
    liga: 7500,
    nacional: 5200,
    bmetro: 3800,
    regional: 2600
  };
  var salarioDescanso = 1200;
  var totalSueldosArbitros = 0;

  // Bonificaciones de la comisión directiva
  var comTecnica = (PRES_COMISION_CATALOGO.tecnica || []).find(function(c){ return c.id === (ps.comision && ps.comision.tecnica); });
  var comMedica = (PRES_COMISION_CATALOGO.medica || []).find(function(c){ return c.id === (ps.comision && ps.comision.medica); });

  var bonusNotaTecnica = 0;
  if(comTecnica && comTecnica.perk === "nota_boost") bonusNotaTecnica += 0.3;
  if(ps.mejoras.simuladorVAR) bonusNotaTecnica += 0.4;
  if(ps.mejoras.analisisVideo) bonusNotaTecnica += 0.2;

  todos.forEach(function(item){
    var p = item.match;
    var desKey = item.desKey;
    var refId = ps.designaciones ? ps.designaciones[desKey] : null;
    var ref = ps.arbitros.find(function(a){ return a.id === refId; });
    if(!ref){
      ref = ps.arbitros.find(function(a){ return !assignedSet[a.id]; }) || ps.arbitros[0];
    }
    assignedSet[ref.id] = true;

    // Sueldo correspondiente al árbitro por este partido
    var sPartido = salarioPorDivision[item.divId] || 3500;
    totalSueldosArbitros += sPartido;

    // Goles
    var gL = Math.floor(Math.random() * 3);
    var gV = Math.floor(Math.random() * 3);
    if(Math.random() < 0.3) gL += 1;

    // Desempeño arbitral adaptado a la dificultad de la división
    var fatigaImpact = (100 - ref.energia) / 100;
    var diffFactor = (p.dif - 65) * 0.04; // Divisiones menores (dif 35-55) tienen menor exigencia
    var templeBonus = (ref.temple - 80) * 0.08;
    var fisicoBonus = (ref.fisico - 80) * 0.06;
    
    var baseNota = 7.2 + templeBonus + fisicoBonus + bonusNotaTecnica - diffFactor - (fatigaImpact * 2.2) + ((Math.random() * 1.8) - 0.9);
    baseNota = clamp(baseNota, 3.5, 9.9);
    baseNota = Math.round(baseNota * 10) / 10;

    var incidentes = [];
    var amarillas = Math.floor(Math.random() * 5) + 2;
    var rojas = Math.random() < 0.25 ? 1 : 0;
    var penales = Math.random() < 0.30 ? 1 : 0;

    if(ref.energia < 45 && Math.random() < 0.65){
      incidentes.push("⚠️ Min 78': Fatiga del juez central y demoras en revisar las jugadas.");
      baseNota = Math.max(3.5, baseNota - 1.4);
    } else if(baseNota >= 8.5){
      incidentes.push("✨ Arbitraje de jerarquía: control absoluto y decisiones respaldadas.");
    } else if(baseNota <= 5.2){
      incidentes.push("🚨 Polémica y reclamos caldeados por fallos en jugadas divididas.");
    } else {
      incidentes.push("✔️ Arbitraje sobrio y sin sobresaltos reglamentarios.");
    }

    // Progreso y crecimiento de estadísticas del árbitro si tuvo buen desempeño en divisiones menores
    if(baseNota >= 7.0){
      var growthExp = (baseNota >= 8.2) ? 3 : 2;
      var growthTemple = (baseNota >= 8.0) ? 2 : 1;
      ref.exp = Math.min(99, (ref.exp || 60) + growthExp);
      ref.temple = Math.min(99, (ref.temple || 60) + growthTemple);
      ref.fisico = Math.min(99, (ref.fisico || 60) + 1);
      ref.integridad = Math.min(99, (ref.integridad || 60) + 1);

      // Promociones de categoría por mérito deportivo
      if(ref.divisionPreferida === "regional" && ref.exp >= 74 && ref.temple >= 76){
        ref.divisionPreferida = "bmetro";
        promocionesPlantel.push({ nombre: ref.nombre, de: "Torneo Regional", a: "Primera B Metropolitana", icon: "🥈" });
        ps.promocionesRealizadas = (ps.promocionesRealizadas || 0) + 1;
      } else if(ref.divisionPreferida === "bmetro" && ref.exp >= 82 && ref.temple >= 83){
        ref.divisionPreferida = "nacional";
        promocionesPlantel.push({ nombre: ref.nombre, de: "Primera B Metropolitana", a: "Primera Nacional", icon: "🥇" });
        ps.promocionesRealizadas = (ps.promocionesRealizadas || 0) + 1;
      } else if(ref.divisionPreferida === "nacional" && ref.exp >= 88 && ref.temple >= 88){
        ref.divisionPreferida = "liga";
        ref.esInternacional = true;
        promocionesPlantel.push({ nombre: ref.nombre, de: "Primera Nacional", a: "Liga Profesional (Categoría FIFA)", icon: "🏆" });
        ps.promocionesRealizadas = (ps.promocionesRealizadas || 0) + 1;
      }
    }

    // Actualizar cansancio del árbitro asignado
    var gastoEnergia = 34;
    if(ps.mejoras.preparadorFisico) gastoEnergia = 20;
    if(comMedica && comMedica.perk === "energia_boost") gastoEnergia = Math.max(15, gastoEnergia - 4);
    ref.energia = Math.max(10, ref.energia - gastoEnergia);
    ref.partidosSeguidos = (ref.partidosSeguidos || 0) + 1;
    ref.partidosTotal = (ref.partidosTotal || 0) + 1;

    resultadosPartidos.push({
      divId: item.divId,
      divNombre: item.divNombre,
      divIcon: item.divIcon,
      local: p.local,
      visitante: p.visitante,
      clasico: p.clasico,
      dif: p.dif,
      golesLocal: gL,
      golesVisitante: gV,
      arbitro: ref.nombre,
      avatarId: ref.avatarId,
      nota: baseNota,
      amarillas: amarillas,
      rojas: rojas,
      penales: penales,
      incidente: incidentes[0]
    });

    totalNota += baseNota;
  });

  // Árbitros en descanso: recuperan energía y cobran sueldo de viático base
  var recoveryPct = ps.mejoras.crioTerapia ? 65 : 45;
  ps.arbitros.forEach(function(a){
    if(!assignedSet[a.id]){
      a.energia = Math.min(100, a.energia + recoveryPct);
      a.partidosSeguidos = 0;
      totalSueldosArbitros += salarioDescanso;
    }
  });

  // Sueldos de la Comisión Directiva (4 departamentos)
  var totalSueldosComision = 0;
  for(var deptKey in (ps.comision || {})){
    var mId = ps.comision[deptKey];
    var cat = PRES_COMISION_CATALOGO[deptKey] || [];
    var mObj = cat.find(function(c){ return c.id === mId; });
    if(mObj) totalSueldosComision += mObj.sueldoPorFecha;
  }

  // Gastos de logística, traslado y viáticos
  var gastosLogistica = 12000;

  // Cálculo de ingresos: Derechos de TV + Patrocinios comerciales
  var ingresoDerechos = 95000;
  var ingresoPorSponsors = 0;
  for(var slotKey in ps.sponsors){
    var spId = ps.sponsors[slotKey];
    if(spId){
      var spObj = PRES_SPONSORS_CATALOGO.find(function(s){ return s.id === spId; });
      if(spObj) ingresoPorSponsors += spObj.montoPorFecha;
    }
  }

  var totalIngresos = ingresoDerechos + ingresoPorSponsors;
  var totalGastos = totalSueldosArbitros + totalSueldosComision + gastosLogistica;
  var balanceNeto = totalIngresos - totalGastos;

  ps.fondos = Math.max(0, ps.fondos + balanceNeto);
  
  var promedioFecha = Math.round((totalNota / Math.max(1, todos.length)) * 10) / 10;

  // Ajuste de confianza AFA y prensa
  var appliedConfDelta = 0, appliedRepDelta = 0, appliedMoralDelta = 0;
  if(promedioFecha >= 7.5){
    appliedConfDelta = 8; appliedRepDelta = 6; appliedMoralDelta = 5;
  } else if(promedioFecha < 6.0){
    appliedConfDelta = -12; appliedRepDelta = -10; appliedMoralDelta = -8;
  }
  ps.confianzaAFA = clamp(ps.confianzaAFA + appliedConfDelta, 0, 100);
  ps.reputacionPublica = clamp(ps.reputacionPublica + appliedRepDelta, 0, 100);
  ps.moralPlantel = clamp(ps.moralPlantel + appliedMoralDelta, 0, 100);

  ps.hudDeltas = {
    confianzaAFA: appliedConfDelta,
    reputacionPublica: appliedRepDelta,
    fondos: balanceNeto,
    moralPlantel: appliedMoralDelta
  };

  // ---- Generación de noticias para el Periódico ----
  var tonoBalance = promedioFecha >= 7.5 ? "positivo" : (promedioFecha < 6.0 ? "negativo" : "neutral");
  agregarNoticiaPeriodico(ps, {
    tipo: "balance",
    icon: "🗞️",
    titular: promedioFecha >= 7.5 ? "EXCELENTE FECHA ARBITRAL: LA AFA DESTACA EL NIVEL DE LA JORNADA" :
             (promedioFecha < 6.0 ? "FECHA PARA EL OLVIDO: FUERTES CRÍTICAS AL RENDIMIENTO ARBITRAL" :
             "FECHA CORRECTA SIN GRANDES SOBRESALTOS EN LAS CUATRO DIVISIONES"),
    cuerpo: "El promedio de calificación de la Fecha " + ps.fecha + " fue de " + promedioFecha.toFixed(1) + "/10 en " + todos.length + " partidos oficiales. Balance económico de la jornada: " + (balanceNeto>=0?"+":"") + fmtMoney(balanceNeto) + ".",
    tag: tonoBalance
  });

  // Noticia del partido más importante de la fecha (mayor tensión/clásico)
  var partidoDestacado = resultadosPartidos.slice().sort(function(a,b){ return (b.dif||0) - (a.dif||0); })[0];
  if(partidoDestacado){
    var tagPartido = partidoDestacado.nota >= 7.5 ? "positivo" : (partidoDestacado.nota <= 5.5 ? "negativo" : "neutral");
    agregarNoticiaPeriodico(ps, {
      tipo: "partido",
      icon: "⚽",
      titular: (partidoDestacado.clasico ? partidoDestacado.clasico + ": " : partidoDestacado.divIcon + " " + partidoDestacado.divNombre + ": ") +
               partidoDestacado.local + " " + partidoDestacado.golesLocal + " - " + partidoDestacado.golesVisitante + " " + partidoDestacado.visitante,
      cuerpo: "Dirigió " + partidoDestacado.arbitro + ", calificado con " + partidoDestacado.nota.toFixed(1) + "/10. " + partidoDestacado.incidente,
      tag: tagPartido
    });

    // Declaración del árbitro protagonista tras el partido destacado
    var poolDeclaraciones = partidoDestacado.nota >= 8.0 ? DECLARACIONES_ARBITRALES.excelente :
                             (partidoDestacado.nota <= 5.2 ? DECLARACIONES_ARBITRALES.polemica : DECLARACIONES_ARBITRALES.normal);
    agregarNoticiaPeriodico(ps, {
      tipo: "declaracion",
      icon: "🎙️",
      titular: partidoDestacado.arbitro.toUpperCase() + " HABLÓ TRAS EL " + partidoDestacado.local + " VS " + partidoDestacado.visitante,
      cuerpo: "“" + pick(poolDeclaraciones) + "”",
      tag: tagPartido
    });
  }

  // Noticia de promociones de categoría, si las hubo
  if(promocionesPlantel.length){
    agregarNoticiaPeriodico(ps, {
      tipo: "ascenso",
      icon: "🏅",
      titular: "ASCENSOS EN EL ESCALAFÓN ARBITRAL DE LA AFA",
      cuerpo: promocionesPlantel.map(function(pr){ return pr.icon + " " + pr.nombre + " asciende de " + pr.de + " a " + pr.a + "."; }).join(" "),
      tag: "positivo"
    });
  }

  ps.simulacionActual = {
    fecha: ps.fecha,
    promedioNota: promedioFecha,
    ingresoDerechos: ingresoDerechos,
    ingresoSponsors: ingresoPorSponsors,
    totalIngresos: totalIngresos,
    sueldosArbitros: totalSueldosArbitros,
    sueldosComision: totalSueldosComision,
    gastosLogistica: gastosLogistica,
    totalGastos: totalGastos,
    ingresoNeto: balanceNeto,
    promociones: promocionesPlantel,
    partidos: resultadosPartidos
  };

  ps.historialFechas.push(ps.simulacionActual);
  ps.screen = "pres_round_summary";
  guardarPresidente();
  render();
}

window.avanzarFechaPresidente = function(){
  var ps = presState;
  if(ps.confianzaAFA <= 0){
    ps.screen = "pres_gameover";
    render();
    return;
  }
  ps.totalFechasDirigidas = (ps.totalFechasDirigidas || 0) + 1;
  ps.fecha++;
  ps.eventoResueltoFecha = false;
  ps.simulacionActual = null;
  ps.screen = "pres_dashboard";
  guardarPresidente();
  render();
};

window.irABalanceFinTemporadaPresidente = function(){
  var ps = presState;
  ps.totalFechasDirigidas = (ps.totalFechasDirigidas || 0) + 1;
  // Si completa el año 4, va a la Reelección Cuatrienal
  if(ps.mandatoAno >= 4){

    ps.screen = "pres_season_summary";

};

function screenPresidentSponsors(){
  var ps = presState;
  if(!ps.sponsorsFirmadosAno || typeof ps.sponsorsFirmadosAno !== "object") ps.sponsorsFirmadosAno = {};

  var slots = [

  var bannerCupoHtml = '<div class="panel" style="background:linear-gradient(135deg, rgba(240,196,25,0.08), rgba(0,0,0,0.5)); border-color:rgba(240,196,25,0.35);">' +

        slotsFirmadosCount + ' / 3 Firmados' +
      '</span>' +
    '</div>' +
    '<div style="margin-top:8px; font-size:13px; color:#e0e0e0; line-height:1.4;">' +
      (slotsFirmadosCount >= 3 ?
        '🔒 <b style="color:var(--gold);">Cupo anual completo (3/3):</b> Los contratos firmados son <b style="color:#fff;">incambiables</b> durante todo el Año ' + ps.mandatoAno + ' de mandato. Se renovarán al iniciar el próximo año.' :
        '✍️ Podés elegir hasta un máximo de <b style="color:var(--gold);">3 sponsors por año</b> (te restan <b style="color:var(--green);">' + slotsRestantes + '</b> cupos). Una vez firmado un sponsor, el contrato es <b style="color:#fff;">incambiable</b> durante todo el año de mandato.') +
    '</div>' +
  '</div>';

  var slotsHtml = slots.map(function(sl){
    var currentSponsorId = ps.sponsors[sl.key];
    var isSlotLocked = !!ps.sponsorsFirmadosAno[sl.key];
    var currentSponsor = PRES_SPONSORS_CATALOGO.find(function(s){ return s.id === currentSponsorId; });

    var availableOptions = PRES_SPONSORS_CATALOGO.filter(function(s){ return s.slot === sl.key; });

    var optionsCardsHtml = availableOptions.map(function(s){
      var isSigned = currentSponsorId === s.id;
      var canSign = ps.reputacionPublica >= s.reqReputacion;

      var btnHtml = "";
      if(isSigned && isSlotLocked){
        btnHtml = '<span class="sponsor-signed-badge" style="background:rgba(240,196,25,0.18); border:1px solid var(--gold); color:var(--gold);">🔒 Contrato Anual Blindado (Incambiable)</span>';
      } else if(isSlotLocked){
        btnHtml = '<span class="muted" style="font-size:11.5px; opacity:0.6;">Espacio cubierto por contrato anual</span>';
      } else if(slotsFirmadosCount >= 3){
        btnHtml = '<button class="btn btn-sm btn-outline" disabled style="opacity:0.45;">🔒 Cupo Anual Lleno (3/3)</button>';
      } else if(!canSign){
        btnHtml = '<button class="btn btn-sm btn-outline" disabled style="opacity:0.5;">Exige ' + s.reqReputacion + '% Reputación Prensa</button>';

        btnHtml = '<button class="btn btn-sm btn-gold" onclick="firmarSponsorPresidente(\'' + sl.key + '\', \'' + s.id + '\', ' + s.bonoFirma + ')">✍️ Firmar Contrato Anual (Bono +' + fmtMoney(s.bonoFirma) + ')</button>';

          '<div style="font-size:24px;">' + s.icono + '</div>' +
          '<div style="flex:1;">' +

            '<div class="sponsor-company">' + s.empresa + '</div>' +

        '<div class="sponsor-desc">' + s.desc + '</div>' +

          '<span class="sponsor-payout">+' + fmtMoney(s.montoPorFecha) + ' / Fecha</span>' +

    '<button class="btn btn-outline" style="margin-top:6px;" onclick="irAMenuModos()">← Volver al Menú Principal</button>';

window.firmarSponsorPresidente = function(slotKey, sponsorId, bonoFirma){
  var ps = presState;
  if(!ps.sponsorsFirmadosAno || typeof ps.sponsorsFirmadosAno !== "object") ps.sponsorsFirmadosAno = {};

  var cantFirmados = Object.keys(ps.sponsorsFirmadosAno).length;
  // Si el espacio ya está blindado o ya se alcanzó el límite de 3 por año, no permitir cambio
  if(ps.sponsorsFirmadosAno[slotKey] || cantFirmados >= 3){
    return;
  }

  ps.sponsors[slotKey] = sponsorId;
  ps.sponsorsFirmadosAno[slotKey] = sponsorId;
  ps.fondos += bonoFirma;
  triggerHaptic("success");
  guardarPresidente();
  render();
};

window.comprarMejoraPresidente = function(id, costo){
  var ps = presState;
  if(ps.fondos >= costo && !ps.mejoras[id]){
    triggerHaptic("success");
    ps.fondos -= costo;
    ps.mejoras[id] = true;

    if(id === "clinicaPsicologia"){
      ps.arbitros.forEach(function(a){ a.temple = Math.min(99, a.temple + 6); });
    }
    if(id === "intercomunicadoresHD"){
      ps.arbitros.forEach(function(a){ a.rigor = Math.min(99, a.rigor + 4); });
    }
    if(id === "aumentoViaticos"){
      ps.moralPlantel = Math.min(100, ps.moralPlantel + 25);
    }
    if(id === "pasantiaFIFA"){
      ps.arbitros.forEach(function(a){ a.exp = Math.min(99, (a.exp || 60) + 8); });
    }
    guardarPresidente();
    render();
  }
};

/* ---------- PANTALLA DE LOGROS DEL MODO DIRIGENTE ---------- */
function screenPresidentAchievements(){
  var ps = presState;
  var totalLogros = PRES_LOGROS_CATALOGO.length;
  var desbloqueados = 0;

  var cardsHtml = PRES_LOGROS_CATALOGO.map(function(l){
    var isUnlocked = l.check(ps);
    if(isUnlocked) desbloqueados++;
    var prog = l.progreso(ps);

    var cardCls = "pres-achievement-card" + (isUnlocked ? " unlocked" : " locked");
    var badgeHtml = isUnlocked ?
      '<span class="pres-achievement-badge unlocked">✓ Desbloqueado</span>' :
      '<span class="pres-achievement-badge locked">🔒 En Progreso</span>';

    return '<div class="' + cardCls + '">' +
      '<div class="pres-achievement-header">' +
        '<div class="pres-achievement-icon">' + l.icono + '</div>' +
        '<div class="pres-achievement-info">' +
          '<div class="pres-achievement-title">' + l.titulo + '</div>' +
          '<span class="pres-achievement-category">' + l.cat + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="pres-achievement-desc">' + l.desc + '</div>' +
      '<div class="pres-achievement-progress-wrap">' +
        '<div class="pres-achievement-progress-bar" style="width:' + prog.pct + '%;"></div>' +
      '</div>' +
      '<div class="pres-achievement-footer">' +
        '<span class="pres-achievement-prog-text">' + prog.actual + ' / ' + prog.max + '</span>' +
        badgeHtml +
      '</div>' +
    '</div>';
  }).join("");

  var pctTotal = Math.round((desbloqueados / totalLogros) * 100);

  return topbar() +
    navTabsPresidente("pres_achievements") +
    '<div class="panel" style="border-color:rgba(240,196,25,0.35); background:linear-gradient(135deg, rgba(240,196,25,0.08), rgba(0,0,0,0.5));">' +
      '<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">' +
        '<div>' +
          '<div class="eyebrow" style="color:var(--gold);">Colegio de Árbitros · Galería de Honor</div>' +
          '<h1 class="section-title" style="font-size:22px; margin-top:4px;">Sala de Logros & Hitos Institucionales</h1>' +
          '<p class="muted" style="font-size:12.5px; margin-top:4px;">Completá los objetivos de gestión, finanzas, infraestructura y formación arbitral durante tu presidencia.</p>' +
        '</div>' +
        '<div style="text-align:right;">' +
          '<div style="font-family:var(--font-display); font-size:24px; color:var(--gold); font-weight:800;">' + desbloqueados + ' / ' + totalLogros + '</div>' +
          '<div class="muted" style="font-size:11.5px;">' + pctTotal + '% Completado</div>' +
        '</div>' +
      '</div>' +
      '<div class="pres-achievement-progress-wrap" style="height:8px; margin-top:12px;">' +
        '<div class="pres-achievement-progress-bar" style="width:' + pctTotal + '%; background:linear-gradient(90deg, var(--gold), var(--green));"></div>' +
      '</div>' +
    '</div>' +

    '<div class="pres-achievement-grid">' + cardsHtml + '</div>' +

    '<div class="panel" style="margin-top:16px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">' +
      '<div>' +
        '<div style="font-size:14px; font-weight:700; color:#fff;">¿Querés comenzar una nueva gestión desde cero?</div>' +
        '<div class="muted" style="font-size:12px;">Podrás volver a elegir personaje, nombre y reiniciar todos los fondos e historial.</div>' +
      '</div>' +
      '<button class="btn btn-danger" style="font-size:13px; padding:10px 16px;" onclick="confirmarReinicioPresidencia()">🔄 Reiniciar Carrera de Dirigente</button>' +
    '</div>' +

    '<button class="btn btn-outline" style="margin-top:14px;" onclick="volverADashboardPresidente()">← Volver al Despacho Presidencial</button>' +
    '<button class="btn btn-outline" style="margin-top:6px;" onclick="irAMenuModos()">← Volver al Menú Principal</button>';
}

var modalConfirmReinicioActivo = false;

  modalConfirmReinicioActivo = true;
  triggerHaptic("light");
  render();
};

window.cancelarReinicioPresidencia = function(){
  modalConfirmReinicioActivo = false;
  triggerHaptic("light");
  render();
};

window.ejecutarReinicioPresidenciaConfirmado = function(){
  modalConfirmReinicioActivo = false;
  borrarGuardadoPresidente();
  presState = null;
  currentGameMode = "president";
  triggerHaptic("warning");
  render();
};

window.reiniciarPresidencia = function(){
  modalConfirmReinicioActivo = false;
  borrarGuardadoPresidente();
  presState = null;
  currentGameMode = "president";
  render();
};

window.comprarItemVAR = function(itemId){
  var vs = varState;
  var item = VAR_SHOP_ITEMS.find(function(it){ return it.id === itemId; });
  if(!item || vs.billetera < item.precio) return;

  vs.billetera -= item.precio;
  if(!vs.shopItemsComprados) vs.shopItemsComprados = [];
  vs.shopItemsComprados.push(itemId);
  vs.puntosPrecision += 15;
  sfxBilletera();
  guardarVAR();
  render();
};

window.saltarAlIncidenteVAR = function(){
  var m = varState.match;
  if(!m) return;
  clearInterval(varLiveTimerHandle);
  varLiveTimerHandle = null;
  m.minuto = m.minutoDestino;
  ejecutarLlegadaDestinoVAR();
};

function siguienteTramoVAR(){
  var m = varState.match;
  if(!m) return;
  
  if(m.incidentesPendientes && m.incidentesPendientes.length > 0){
    var prox = m.incidentesPendientes[0];
    m.minutoDestino = prox.minuto;
  } else if(m.minuto < 45){
    m.minutoDestino = 45;
  } else {
    m.minutoDestino = 90;
  }

  clearInterval(varLiveTimerHandle);
  varLiveTimerHandle = setInterval(tickLiveVAR, getVarLiveTickMs());
}

function tickLiveVAR(){
  var m = varState.match;
  if(!m || varState.screen !== "var_match_live"){
    clearInterval(varLiveTimerHandle);
    return;
  }

  m.minuto++;
  generarTickComentario(m);

  var minEl = document.getElementById("varLiveMinuteEl");
  var scoreEl = document.getElementById("varLiveScoreEl");
  var feedEl = document.getElementById("varActiveFeed");
  if(minEl) minEl.innerHTML = "⏱️ Minuto " + m.minuto + "'";
  if(scoreEl) scoreEl.innerHTML = m.golesLocal + " - " + m.golesVisitante;
  if(feedEl) feedEl.innerHTML = renderActivePlaysHtml(m);

  if(m.minuto >= m.minutoDestino){
    clearInterval(varLiveTimerHandle);
    varLiveTimerHandle = null;
    ejecutarLlegadaDestinoVAR();
  }
}

function ejecutarLlegadaDestinoVAR(){
  var m = varState.match;
  if(m.incidentesPendientes && m.incidentesPendientes.length > 0 && m.minuto >= m.incidentesPendientes[0].minuto){
    var inc = m.incidentesPendientes.shift();
    m.incidenteActual = inc;
    VAR_CAM_ACTIVA = "saot_3d";
    sfxVARAlert();
    triggerHaptic("decision");
    varState.screen = "var_incident_review";
    render();
  } else if(m.minuto === 45 && !m.primerTiempoFinalizado){
    m.primerTiempoFinalizado = true;
    sfxWhistle();
    varState.screen = "var_halftime";
    render();
  } else if(m.minuto >= 90){
    sfxSilbatoFinal();
    varState.screen = "var_postmatch";
    render();
  } else {
    siguienteTramoVAR();
  }
}

window.tomarDecisionVAR = function(opcionId){
  var m = varState.match;
  var inc = m.incidenteActual;
  if(!inc) return;

  var op = inc.opciones.find(function(o){ return o.id === opcionId; }) || inc.opciones[0];
  var esCorrecta = op.correcta;

  if(esCorrecta){
    varState.stats.aciertos++;
    varState.puntosPrecision += 5;
    m.calificacionVOR = Math.min(10, m.calificacionVOR + 0.6);
    sfxVARConfirmed();
    triggerHaptic("success");
  } else {
    varState.stats.errores++;
    varState.puntosPrecision = Math.max(0, varState.puntosPrecision - 10);
    m.calificacionVOR = Math.max(1, m.calificacionVOR - 1.8);
    sfxTarjeta();
    triggerHaptic("error");
  }

  // Actualizar estadísticas globales
  varState.stats.partidos = Math.max(varState.stats.partidos, 1);
  var totalChecks = (varState.stats.aciertos + varState.stats.errores);
  varState.stats.precisionQuirurgica = totalChecks > 0 ? Math.round((varState.stats.aciertos / totalChecks) * 100) : 100;
  m.intervencionesRealizadas++;

  m.ultimoResultado = {
    op: op,
    inc: inc,
    esCorrecta: esCorrecta
  };

  varState.screen = "var_incident_result";
  render();
};

/* 6. RESULTADO Y REACCIÓN DEL ÁRBITRO DE CAMPO */
function screenVARIncidentResult(){
  var m = varState.match;
  var res = m.ultimoResultado;
  if(!res) return screenVARMatchLive();

  var op = res.op;
  var inc = res.inc;
  var esCorrecta = res.esCorrecta;

  return topbar() +
    '<div class="panel center">' +
      '<div class="eyebrow" style="color:#00e5ff;">Resolución de la Jugada</div>' +
      '<h2 class="section-title" style="font-size:22px; margin-top:4px;">VEREDICTO FINAL DE LA SALA VOR</h2>' +
    '</div>' +
    '<div class="feedback-box '+(esCorrecta ? "pos" : "neg")+'" style="margin-top:12px; text-align:left;">' +
      '<div class="feedback-title '+(esCorrecta ? "pos" : "neg")+'">'+(esCorrecta ? "✅ Decisión Impecable y Respaldada" : "❌ Error en la Intervención")+'</div>' +
      '<div class="headline" style="font-size:13.5px; margin-top:4px;">'+op.feedback+'</div>' +
    '</div>' +
    '<div class="dialogue-balloon" style="margin-top:12px;">' +
      '<b>Árbitro de Campo ('+m.arbitroCampo.nombre+'):</b> '+op.arbitroRespuesta+
    '</div>' +
    '<button class="btn" style="margin-top:16px; background:linear-gradient(135deg, #00b4d8, #0077b6); color:#fff; border:1px solid #00e5ff; font-weight:900;" onclick="reanudarDespuesDeVAR()">Continuar Monitoreo del Partido →</button>';
}

window.reanudarDespuesDeVAR = function(){
  var m = varState.match;
  m.incidenteActual = null;
  m.ultimoResultado = null;
  varState.screen = "var_match_live";
  render();
  siguienteTramoVAR();
};

/* 7. ENTRETIEMPO EN SALA VOR */
function screenVARHalftime(){
  var m = varState.match;
  return topbar() +
    '<div class="panel center">' +
      '<div class="eyebrow" style="color:#00e5ff;">Entretiempo · Cabina VOR</div>' +
      '<h2 class="section-title" style="margin-top:6px;">Fin del Primer Tiempo</h2>' +
      '<div class="live-scoreboard" style="margin-top:10px; align-items:center;">' +
        '<div style="display:flex; align-items:center; gap:8px; flex:1; justify-content:flex-end;">' +
          '<div class="live-team">'+ m.local +'</div>' +
          renderTeamCrest(m.local, 32) +
        '</div>' +
        '<div class="live-score">'+ m.golesLocal +' - '+ m.golesVisitante +'</div>' +
        '<div style="display:flex; align-items:center; gap:8px; flex:1; justify-content:flex-start;">' +
          renderTeamCrest(m.visitante, 32) +
          '<div class="live-team">'+ m.visitante +'</div>' +
        '</div>' +
      '</div>' +
      '<p class="muted" style="font-size:13px; margin-top:10px;">Recalibrando cámaras SAOT y sincronizando audio con el asistente AVAR.</p>' +
    '</div>' +
    '<div class="stat-grid">' +
      '<div class="stat-box" style="border-color:rgba(0,229,255,0.3);"><div class="v" style="color:#00e5ff;">'+m.calificacionVOR.toFixed(1)+'</div><div class="l">Nota Parcial VOR</div></div>' +
      '<div class="stat-box gold"><div class="v">'+m.intervencionesRealizadas+'</div><div class="l">Intervenciones</div></div>' +
    '</div>' +
    '<button class="btn" style="margin-top:14px; background:linear-gradient(135deg, #00b4d8, #0077b6); color:#fff; border:1px solid #00e5ff; font-weight:900;" onclick="reanudarSegundoTiempoVAR()">Iniciar Segundo Tiempo en Cabina →</button>';
}

window.reanudarSegundoTiempoVAR = function(){
  var m = varState.match;
  m.ticker.push({ minuto:45, texto:"🔄 Arranca el segundo tiempo. Cabina VOR en alerta máxima." });
  sfxWhistle();
  varState.screen = "var_match_live";
  render();
  siguienteTramoVAR();
};

/* 8. POSTPARTIDO Y AUDIOS DEL VAR */
function screenVARPostMatch(){
  var vs = varState;
  var m = vs.match;
  var pago = Math.round(55000 * (m.calificacionVOR / 8.0));
  vs.billetera += pago;
  vs.stats.partidos++;

  // Chequeo de ascenso de certificación
  if(vs.puntosPrecision >= 150 && vs.nivelCertificacion === 1){
    vs.nivelCertificacion = 2;
    vs.rango = "Oficial VAR Internacional FIFA";
  } else if(vs.puntosPrecision >= 250 && vs.nivelCertificacion === 2){
    vs.nivelCertificacion = 3;
    vs.rango = "Director de Sala VOR Conmebol / UEFA";
  }

  // Guardar en historial
  vs.historial.unshift({
    fecha: new Date().toLocaleDateString(),
    rivales: m.local + " vs " + m.visitante,
    score: m.golesLocal + " - " + m.golesVisitante,
    nota: m.calificacionVOR.toFixed(1),
    pago: pago
  });

  guardarVAR();

  return topbar() +
    '<div class="panel center">' +
      '<div class="eyebrow" style="color:#00e5ff;">Final del Partido · Informe Oficial VOR</div>' +
      '<h2 class="section-title" style="font-size:24px; margin-top:6px;">PARTIDO CONCLUIDO</h2>' +
      '<div style="font-size:16px; font-weight:bold; color:#fff; margin-top:6px;">'+m.local+' '+m.golesLocal+' - '+m.golesVisitante+' '+m.visitante+'</div>' +
      '<div style="font-size:12px; color:var(--text-dim); margin-top:2px;">'+m.torneo+' · '+m.estadio+'</div>' +
    '</div>' +
    '<div class="stat-grid" style="margin-top:12px;">' +
      '<div class="stat-box" style="border-color:rgba(0,229,255,0.3);"><div class="v" style="color:#00e5ff;">'+m.calificacionVOR.toFixed(1)+'</div><div class="l">Calificación VOR</div></div>' +
      '<div class="stat-box gold"><div class="v">'+fmtMoney(pago)+'</div><div class="l">Honorarios Ganados</div></div>' +
      '<div class="stat-box"><div class="v" style="color:var(--green);">'+vs.stats.precisionQuirurgica+'%</div><div class="l">Precisión Global</div></div>' +
      '<div class="stat-box"><div class="v" style="color:var(--gold);">Nivel '+vs.nivelCertificacion+'</div><div class="l">'+vs.rango+'</div></div>' +
    '</div>' +
    // Sección de Audios del VAR Liberados
    '<div class="panel" style="margin-top:12px; background:#070d14; border:1px solid #1c354d;">' +
      '<div class="eyebrow" style="color:#00e5ff;">📢 Audios del VAR Liberados por la Comisión</div>' +
      '<div style="font-size:12.5px; color:#e0e6ed; margin-top:8px; line-height:1.45;">' +
        '“La Comisión de Árbitros publicó las grabaciones de cabina VOR de la jornada. Tu comunicación fue catalogada como <b>'+(m.calificacionVOR>=8?"CLARA, TÉCNICA Y PRECISA":"CON DUDAS EN EL PROTOCOLO")+'</b> por los veedores internacionales.”' +
      '</div>' +
    '</div>' +
    '<button class="btn" style="margin-top:16px; background:linear-gradient(135deg, #00b4d8, #0077b6); color:#fff; border:1px solid #00e5ff; font-weight:900;" onclick="finalizarPartidoVARAlDashboard()">Volver a la Cabina VOR →</button>';
}

window.finalizarPartidoVARAlDashboard = function(){
  varState.match = null;
  varState.screen = "var_dashboard";
  render();
};

/* 9. HISTORIAL DE PARTIDOS VAR */
function screenVARHistory(){
  var vs = varState;
  var rows = (vs.historial||[]).map(function(h){
    return '<div style="background:#09121a; border:1px solid var(--border); border-radius:8px; padding:10px; margin-top:8px; display:flex; justify-content:space-between; align-items:center;">' +
      '<div>' +
        '<div style="font-family:var(--font-display); font-size:14px; font-weight:bold; color:#fff;">'+h.rivales+' ('+h.score+')</div>' +
        '<div style="font-size:11px; color:var(--text-dim);">'+h.fecha+' · Nota VOR: '+h.nota+'</div>' +
      '</div>' +
      '<div style="color:var(--gold); font-weight:bold; font-size:13px;">+'+fmtMoney(h.pago)+'</div>' +
    '</div>';
  }).join("");

  return topbar() +
    '<div class="panel center">' +
      '<div class="eyebrow" style="color:#00e5ff;">Archivo Oficial VOR</div>' +
      '<h2 class="section-title" style="margin-top:6px;">HISTORIAL DE VIDEOARBITRAJE</h2>' +
    '</div>' +
    '<div class="panel" style="margin-top:12px;">' +
      (rows || '<div class="muted">No hay partidos registrados aún en el historial.</div>') +
    '</div>' +
    '<button class="btn btn-outline" style="margin-top:14px;" onclick="volverDashboardVAR()">← Volver al Panel VOR</button>';
}

window.volverDashboardVAR = function(){
  varState.screen = "var_dashboard";
  render();
};



/* =========================================================
   INICIO
   ========================================================= */

state = nuevoEstado();
var savedRef = cargarGuardado();
if(savedRef && savedRef.ref && savedRef.ref.nombre){
  // Si ya tiene una partida de árbitro guardada
  state = savedRef;
  state.screen = "mode_select";
}

var savedPres = cargarGuardadoPresidente();
if(savedPres && savedPres.nombre){
  presState = savedPres;
}

currentGameMode = "referee";
sfxEnabled = state.sonido !== false;
render();

})();
</script>
</body>
</html>
