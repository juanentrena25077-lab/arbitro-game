<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Carrera Arbitral — Simulador de Árbitro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap');

:root{
  --bg:#0a0e13;
  --bg-grad:#0d1420;
  --panel:#131a23;
  --card:#181f2a;
  --card-hi:#1e2733;
  --border:#262f3b;
  --text:#e9eef3;
  --text-dim:#8b96a3;
  --text-faint:#5c6673;
  --green:#00e676;
  --green-deep:#00a856;
  --gold:#f0c419;
  --gold-deep:#c99e0e;
  --red:#ff4d5e;
  --yellow:#ffd400;
  --purple:#b388ff;
  --font-display:'Oswald', 'Arial Narrow', sans-serif;
  --font-body:'Inter', -apple-system, sans-serif;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html,body{
  margin:0; padding:0;
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(0,230,118,0.07), transparent 60%),
    linear-gradient(180deg, var(--bg-grad) 0%, var(--bg) 100%);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
}

#app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  padding:18px 16px 40px;
  position:relative;
}

/* ---------- Scrollbar / focus ---------- */
::-webkit-scrollbar{ width:8px; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
  outline:2px solid var(--green); outline-offset:2px;
}

/* ---------- Typography helpers ---------- */
h1,h2,h3{ font-family:var(--font-display); margin:0; letter-spacing:0.3px; }
.eyebrow{
  font-family:var(--font-body); font-weight:800; font-size:10.5px;
  letter-spacing:1.6px; text-transform:uppercase; color:var(--text-faint);
}
.muted{ color:var(--text-dim); }

/* ---------- Buttons ---------- */
.btn{
  display:block; width:100%; box-sizing:border-box;
  font-family:var(--font-display); font-size:18px; font-style:italic;
  text-align:center; text-transform:uppercase; letter-spacing:0.4px;
  padding:15px 14px; border-radius:12px; border:none; cursor:pointer;
  font-weight:600; margin-top:10px; transition:transform .08s ease, filter .15s ease, opacity .15s ease;
}
.btn:active{ transform:scale(0.97); }
.btn-primary{
  background:linear-gradient(180deg, var(--green) 0%, var(--green-deep) 100%);
  color:#04140b;
  box-shadow:0 6px 18px rgba(0,230,118,0.25);
}
.btn-primary:hover{ filter:brightness(1.06); }
.btn-gold{
  background:linear-gradient(180deg, var(--gold) 0%, var(--gold-deep) 100%);
  color:#221a02;
  box-shadow:0 6px 18px rgba(240,196,25,0.2);
}
.btn-purple{
  background:linear-gradient(180deg, #b388ff 0%, #7c4dff 100%);
  color:#0d051a;
  box-shadow:0 6px 18px rgba(179,136,255,0.25);
}
.btn-outline{
  background:transparent; color:var(--text); border:1.5px solid var(--border);
  box-shadow:none;
}
.btn-outline:hover{ border-color:var(--text-dim); }
.btn-danger{
  background:linear-gradient(180deg, #ff5b6b 0%, #d8283a 100%); color:#1a0508;
}
.btn:disabled{ opacity:0.4; cursor:not-allowed; }
.btn-small{ font-size:13px; padding:9px 10px; border-radius:9px; margin-top:8px; }

/* ---------- Cards / panels ---------- */
.panel{
  background:var(--panel); border:1px solid var(--border); border-radius:16px;
  padding:16px; margin-top:14px;
}
.card{
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  padding:14px; margin-top:12px;
}

/* ---------- Referee ID card ---------- */
.id-card{
  position:relative; overflow:hidden;
  border-radius:18px; padding:18px 16px 16px;
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 22px),
    linear-gradient(160deg, #111820 0%, #0c1117 100%);
  border:1px solid var(--border);
  box-shadow: inset 0 0 0 1px rgba(0,230,118,0.06), 0 10px 30px rgba(0,0,0,0.35);
}
.id-card::before{
  content:"FEDERACIÓN";
  position:absolute; right:-38px; top:22px; width:180px;
  transform:rotate(35deg); text-align:center;
  font-family:var(--font-display); font-size:13px; font-weight:700;
  letter-spacing:3px; color:rgba(240,196,25,0.10);
}
.id-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.id-serial{ font-family:'Courier New', monospace; font-size:10.5px; color:var(--text-faint); letter-spacing:1px; }
.id-badge{
  font-family:var(--font-body); font-weight:800; font-size:9.5px; letter-spacing:1px;
  text-transform:uppercase; color:#04140b; background:var(--green);
  padding:4px 9px; border-radius:20px; white-space:nowrap;
}
.id-main{ display:flex; align-items:center; gap:14px; margin-top:12px; }
.id-photo{
  width:58px; height:58px; border-radius:50%; flex:none;
  background:radial-gradient(circle at 35% 30%, #2a3542, #0e131a 75%);
  border:2px solid var(--gold);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-size:22px; color:var(--gold);
}
.id-name{ font-family:var(--font-display); font-size:21px; color:#fff; line-height:1.1; }
.id-sub{ font-size:11.5px; color:var(--text-dim); margin-top:3px; }
.id-ovr{
  margin-left:auto; text-align:center; flex:none;
}
.id-ovr .num{ font-family:var(--font-display); font-size:30px; color:var(--gold); line-height:1; }
.id-ovr .lbl{ font-size:9px; letter-spacing:1.5px; color:var(--text-faint); text-transform:uppercase; }
.id-stamp{
  margin-top:14px; padding-top:12px; border-top:1px dashed var(--border);
  display:flex; justify-content:space-between; font-size:11px; color:var(--text-dim);
}
.id-stamp b{ color:var(--text); }

/* ---------- Stat grid ---------- */
.stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:12px; }
.stat-box{
  background:var(--card); border:1px solid var(--border); border-radius:12px;
  padding:11px 12px; text-align:left;
}
.stat-box .v{ font-family:var(--font-display); font-size:19px; color:var(--green); font-weight:600; }
.stat-box .l{ font-size:9.5px; color:var(--text-faint); text-transform:uppercase; font-weight:800; letter-spacing:0.6px; margin-top:2px; }
.stat-box.gold .v{ color:var(--gold); }
.stat-box.red .v{ color:var(--red); }
.stat-box.purple .v{ color:var(--purple); }
.stat-box.wide{ grid-column:span 2; }

/* ---------- Meters ---------- */
.meter-row{ margin-top:10px; }
.meter-head{ display:flex; justify-content:space-between; font-size:11px; margin-bottom:5px; }
.meter-head b{ color:var(--text); font-weight:700; }
.meter-track{ height:8px; background:#0d131a; border-radius:6px; overflow:hidden; border:1px solid var(--border); }
.meter-fill{ height:100%; border-radius:6px; transition:width .4s ease; }

/* ---------- Match header ---------- */
.match-title{
  text-align:center; margin-top:6px;
}
.match-title .vs{
  font-family:var(--font-display); font-size:23px; font-style:italic; color:#fff; margin-top:4px;
}
.match-title .vs .sep{ color:var(--green); margin:0 8px; }
.minute-badge{
  display:inline-flex; align-items:center; gap:6px; margin-top:10px;
  background:#0d131a; border:1px solid var(--border); border-radius:20px;
  padding:6px 14px; font-family:var(--font-display); font-size:14px; color:var(--gold);
}

/* ---------- Event card ---------- */
.event-tag{
  display:inline-block; font-size:9.5px; font-weight:800; letter-spacing:1px;
  text-transform:uppercase; color:var(--bg); background:var(--gold);
  padding:3px 9px; border-radius:6px; margin-bottom:9px;
}
.event-text{ font-size:15.5px; line-height:1.5; color:var(--text); }
.option-btn{
  display:block; width:100%; text-align:left; background:var(--card-hi);
  border:1.5px solid var(--border); color:var(--text); border-radius:12px;
  padding:13px 14px; margin-top:10px; font-family:var(--font-body); font-size:14.5px;
  font-weight:600; cursor:pointer; position:relative; overflow:hidden;
  transition:border-color .18s ease, transform .12s cubic-bezier(0.2, 0, 0.2, 1), background .18s ease, box-shadow .18s ease;
  user-select:none; -webkit-tap-highlight-color:transparent;
}
.option-btn:hover{ border-color:var(--green); background:#1c2632; }
.option-btn:active{
  transform:scale(0.97) translateY(1px);
  background:#223040; border-color:var(--green);
  box-shadow:0 0 14px rgba(0,230,118,0.3);
}

/* Transiciones Fluidas entre Partido y Feedback */
.trans-event-container{
  animation: transEventIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes transEventIn{
  0%{ opacity:0; transform:translateY(14px) scale(0.985); }
  100%{ opacity:1; transform:translateY(0) scale(1); }
}

.trans-feedback-container{
  animation: transFeedbackIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes transFeedbackIn{
  0%{ opacity:0; transform:translateY(18px) scale(0.97); }
  60%{ opacity:1; transform:translateY(-2px) scale(1.006); }
  100%{ opacity:1; transform:translateY(0) scale(1); }
}

.verdict-banner-enter{
  animation: verdictBannerPop 0.42s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}
@keyframes verdictBannerPop{
  0%{ opacity:0; transform:scale(0.86) translateY(-10px); }
  100%{ opacity:1; transform:scale(1) translateY(0); }
}

.feedback-box-enter{
  animation: feedbackBoxSlide 0.38s cubic-bezier(0.16, 1, 0.3, 1) 0.06s both;
}
@keyframes feedbackBoxSlide{
  0%{ opacity:0; transform:translateY(12px); }
  100%{ opacity:1; transform:translateY(0); }
}

/* Bribe Hint on Option */
.bribe-hint-tag{
  display:inline-block; font-size:10px; font-weight:800; letter-spacing:0.5px;
  padding:2px 8px; border-radius:6px; margin-bottom:6px; text-transform:uppercase;
}
.bribe-hint-tag.pos{ background:rgba(0,230,118,0.18); color:var(--green); border:1px solid rgba(0,230,118,0.4); }
.bribe-hint-tag.neg{ background:rgba(255,77,94,0.18); color:var(--red); border:1px solid rgba(255,77,94,0.4); }
.bribe-hint-tag.neu{ background:rgba(139,150,163,0.15); color:var(--text-dim); border:1px solid var(--border); }

/* ---------- Feedback ---------- */
.feedback-box{
  border-radius:14px; padding:14px; margin-top:12px; border:1px solid var(--border);
  background:var(--card);
}
.feedback-box.pos{ border-color:rgba(0,230,118,0.35); background:rgba(0,230,118,0.06); }
.feedback-box.neg{ border-color:rgba(255,77,94,0.35); background:rgba(255,77,94,0.06); }
.feedback-box.bribe{ border-color:rgba(179,136,255,0.4); background:rgba(179,136,255,0.08); }
.feedback-title{ font-family:var(--font-display); font-size:14px; text-transform:uppercase; letter-spacing:0.5px; }
.feedback-title.pos{ color:var(--green); }
.feedback-title.neg{ color:var(--red); }
.feedback-title.bribe{ color:var(--purple); }
.delta-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
.delta-pill{
  font-size:11px; font-weight:700; padding:3px 8px; border-radius:20px;
  background:#0d131a; border:1px solid var(--border);
}
.delta-pill.up{ color:var(--green); border-color:rgba(0,230,118,0.3); }
.delta-pill.down{ color:var(--red); border-color:rgba(255,77,94,0.3); }
.delta-pill.purple{ color:var(--purple); border-color:rgba(179,136,255,0.4); }
.card-flag{
  display:inline-block; width:14px; height:19px; border-radius:2px; margin-right:6px; vertical-align:middle;
}
.card-flag.amarilla{ background:var(--yellow); }
.card-flag.roja{ background:var(--red); }

/* ---------- Simulación en vivo ---------- */
.live-panel{ position:relative; }
.live-dot{
  display:inline-block; width:7px; height:7px; border-radius:50%;
  background:var(--red); margin:0 3px 0 8px; vertical-align:middle;
  animation: liveDotPulse 1.1s ease-in-out infinite;
}
@keyframes liveDotPulse{
  0%,100%{ opacity:1; box-shadow:0 0 0 0 rgba(255,77,94,0.5); }
  50%{ opacity:0.5; box-shadow:0 0 0 5px rgba(255,77,94,0); }
}
.live-scoreboard{
  display:flex; align-items:center; justify-content:center; gap:12px;
  margin-top:12px;
}
.live-team{
  font-family:var(--font-display); font-size:14.5px; color:#fff; text-align:center; flex:1;
  text-transform:uppercase; letter-spacing:0.3px; line-height:1.2;
}
.live-score{
  font-family:var(--font-display); font-size:27px; color:var(--gold); letter-spacing:2px;
  background:#0d131a; border:1px solid var(--border); border-radius:10px; padding:4px 14px;
  flex:none;
}
.ticker-feed{
  max-height:280px; overflow-y:auto; scroll-behavior:smooth;
}
.ticker-item{
  display:flex; gap:9px; align-items:baseline; padding:7px 0; border-bottom:1px dashed var(--border);
  font-size:13px; color:var(--text-dim); animation: tickerIn 0.25s ease forwards;
}
.ticker-item:last-child{ border-bottom:none; }
.ticker-item.gol{ color:var(--green); font-weight:700; }
.ticker-min{
  font-family:var(--font-display); font-size:12px; color:var(--text-faint); flex:none; width:30px;
}
.ticker-txt{ flex:1; line-height:1.4; }
@keyframes tickerIn{ 0%{ opacity:0; transform:translateY(4px); } 100%{ opacity:1; transform:translateY(0); } }

/* ---------- Toggle de sonido ---------- */
.sound-toggle{
  background:transparent; border:1px solid var(--border); color:var(--text-dim);
  border-radius:8px; padding:4px 8px; font-size:13px; cursor:pointer; line-height:1;
}
.sound-toggle:active{ transform:scale(0.94); }

/* ---------- Escudos de Equipos (Vector Crests) ---------- */
.team-crest-box{
  display:inline-flex; align-items:center; justify-content:center;
  vertical-align:middle; filter:drop-shadow(0 2px 5px rgba(0,0,0,0.45));
}
.team-match-box{
  display:flex; flex-direction:column; align-items:center; gap:6px; flex:1;
}
.team-match-box .crest-wrap{
  transition:transform 0.2s ease;
}
.team-match-box:hover .crest-wrap{ transform:scale(1.06); }
.team-match-name{
  font-family:var(--font-display); font-size:13.5px; text-transform:uppercase;
  color:#fff; text-align:center; letter-spacing:0.4px; line-height:1.2;
}

/* ---------- Minijuego de tensión / autoridad ---------- */
.tension-card{ padding:18px 14px; text-align:center; }
.tension-track{
  position:relative; height:42px; border-radius:12px; overflow:hidden;
  background:#141a22;
  border:2px solid var(--border);
  box-shadow:inset 0 2px 6px rgba(0,0,0,0.6);
  margin-top:10px;
}
.tension-zone-danger-left{
  position:absolute; left:0; width:37.5%; top:0; bottom:0;
  background:linear-gradient(90deg, rgba(255,77,94,0.35), rgba(255,77,94,0.18));
}
.tension-zone-danger-right{
  position:absolute; right:0; width:37.5%; top:0; bottom:0;
  background:linear-gradient(90deg, rgba(255,77,94,0.18), rgba(255,77,94,0.35));
}
.tension-zone-green{
  position:absolute; left:37.5%; width:25%; top:0; bottom:0;
  background:rgba(0,230,118,0.32);
  border-left:2px solid var(--green); border-right:2px solid var(--green);
  box-shadow:0 0 16px rgba(0,230,118,0.35) inset;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-size:11px; font-weight:800;
  color:var(--green); letter-spacing:1px; text-shadow:0 0 4px rgba(0,0,0,0.8);
  user-select:none;
}
.tension-needle{
  position:absolute; top:-4px; bottom:-4px; width:6px; background:#fff;
  left:50%; transform:translateX(-50%); border-radius:3px;
  box-shadow:0 0 12px #fff, 0 0 4px #00e676;
  z-index:5; pointer-events:none;
  transition:none;
}
.tension-needle.hit{
  background:var(--green) !important;
  box-shadow:0 0 20px var(--green), 0 0 8px #fff !important;
  animation: needleHitPulse 0.4s ease infinite alternate;
}
.tension-needle.miss{
  background:var(--red) !important;
  box-shadow:0 0 20px var(--red), 0 0 8px #fff !important;
}
@keyframes needleHitPulse{
  0%{ transform:translateX(-50%) scaleY(1); }
  100%{ transform:translateX(-50%) scaleY(1.15); }
}
.tension-btn{ margin-top:16px; width:100%; font-size:15px; font-weight:700; }

/* ---------- Minijuego 1: Túnel y Revisión de Memoria ---------- */
.memory-grid{
  display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin-top:14px;
}
@media(max-width:380px){
  .memory-grid{ grid-template-columns:repeat(3, 1fr); gap:6px; }
}
.memory-card{
  aspect-ratio: 1/1;
  perspective: 600px;
  cursor:pointer; user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.memory-card-inner{
  position:relative; width:100%; height:100%;
  text-align:center; transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  transform-style: preserve-3d;
  border-radius:12px;
}
.memory-card.flipped .memory-card-inner,
.memory-card.matched .memory-card-inner{
  transform: rotateY(180deg);
}
.memory-card-front, .memory-card-back{
  position:absolute; width:100%; height:100%;
  -webkit-backface-visibility: hidden; backface-visibility: hidden;
  border-radius:12px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; padding:6px;
}
.memory-card-front{
  background:linear-gradient(145deg, #18222d, #0f161e);
  border:1.5px solid var(--border);
  color:var(--gold);
}
.memory-card-front:hover{ border-color:var(--green); }
.memory-card-back{
  background:linear-gradient(145deg, #1f2b38, #131c25);
  border:1.5px solid var(--gold);
  transform: rotateY(180deg);
}
.memory-card.matched .memory-card-back{
  border-color:var(--green);
  background:rgba(0,230,118,0.12);
  box-shadow:0 0 10px rgba(0,230,118,0.3);
}
.memory-icon{ font-size:24px; line-height:1; }
.memory-label{
  font-size:9.5px; font-weight:700; color:#fff;
  margin-top:4px; text-transform:uppercase; letter-spacing:0.3px;
  line-height:1.1; text-align:center;
}
.memory-stats-bar{
  display:flex; justify-content:space-between; align-items:center;
  background:#0d131a; border:1px solid var(--border); border-radius:10px;
  padding:8px 12px; margin-top:10px; font-size:12.5px;
}

/* ---------- Minijuego 2: Sorteo de Capitanes ---------- */
.sorteo-stage{
  background:radial-gradient(circle at 50% 30%, #172433, #0c1218 80%);
  border:1px solid var(--border); border-radius:16px; padding:18px 14px;
  margin-top:14px; text-align:center;
}
.sorteo-captains-row{
  display:flex; justify-content:space-around; align-items:flex-end;
  gap:12px; margin-top:8px;
}
.sorteo-captain-card{
  display:flex; flex-direction:column; align-items:center; flex:1;
  padding:10px 8px; border-radius:12px; background:rgba(0,0,0,0.25);
  border:1px solid var(--border); position:relative;
}
.sorteo-captain-card.winner{
  border-color:var(--green); background:rgba(0,230,118,0.1);
  box-shadow:0 0 14px rgba(0,230,118,0.25);
}
.captain-armband{
  position:absolute; top:6px; right:6px; background:var(--gold);
  color:#000; font-size:9px; font-weight:900; width:16px; height:16px;
  border-radius:50%; display:flex; align-items:center; justify-content:center;
}
.coin-box{
  width:72px; height:72px; margin:16px auto; position:relative; perspective:800px;
}
.coin-disc{
  width:100%; height:100%; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff7a1, #e5a700 70%, #996e00 100%);
  border:2.5px solid #fff;
  box-shadow:0 6px 16px rgba(0,0,0,0.6), 0 0 14px rgba(240,196,25,0.4);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-family:var(--font-display); font-size:20px; font-weight:900; color:#422a00;
  text-shadow:0 1px 1px rgba(255,255,255,0.6);
  user-select:none;
}
.coin-flipping{
  animation: coinFlip3D 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}
@keyframes coinFlip3D{
  0%{ transform: rotateY(0) scale(1) translateY(0); }
  25%{ transform: rotateY(720deg) scale(1.4) translateY(-35px); }
  50%{ transform: rotateY(1440deg) scale(1.6) translateY(-50px); }
  75%{ transform: rotateY(2160deg) scale(1.2) translateY(-20px); }
  100%{ transform: rotateY(2880deg) scale(1) translateY(0); }
}
.dialogue-balloon{
  background:#131c26; border:1px solid var(--border); border-radius:12px;
  padding:12px; margin-top:12px; font-size:13.5px; line-height:1.45; text-align:left;
  position:relative;
}
.dialogue-balloon::after{
  content:""; position:absolute; bottom:-7px; left:28px;

/* ---------- Misc ---------- */

.badge-cat{

.shop-progress-bar-wrap{

}
.shop-progress-head{

/* ---------- Shop Styles ---------- */

}
.shop-item-name{ font-family:var(--font-display); font-size:17px; color:#fff; }
.shop-item-price{ font-family:var(--font-display); font-size:16px; color:var(--gold); font-weight:700; }
.shop-item-desc{ font-size:12.5px; color:var(--text-dim); margin-top:5px; line-height:1.4; }

.tag-owned{

.social-post-card.pos{ border-left-color: var(--green); }

.social-post-card.neu{ border-left-color: var(--gold); }

.social-post-meta{

/* Historial de Designaciones (modo Árbitro) */
.history-card{

}
.history-card-meta{

.history-nota-pill.alta{ background: rgba(0,230,118,0.15); color: var(--green); }
.history-nota-pill.media{ background: rgba(240,196,25,0.15); color: var(--gold); }
.history-nota-pill.baja{ background: rgba(255,77,94,0.15); color: var(--red); }
.history-teams-row{

.history-pay-chip{

.id-photo{
  width:58px; height:58px; border-radius:50%; flex:none;
  background:#121820;
  border:2px solid var(--gold);
  overflow:hidden;
  display:flex; align-items:center; justify-content:center;
}
.id-photo svg{ width:100%; height:100%; display:block; }

.avatar-tabs{ display:flex; gap:8px; margin-top:12px; }
.avatar-tab-btn{
  flex:1; padding:9px 12px; border-radius:10px; font-family:var(--font-display);
  font-size:14px; background:var(--card); color:var(--text-dim); border:1px solid var(--border);
  cursor:pointer; text-transform:uppercase; text-align:center;
}
.avatar-tab-btn.active{
  background:rgba(0,230,118,0.12); color:var(--green); border-color:rgba(0,230,118,0.4); font-weight:700;
}

.avatar-grid{
  display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-top:12px;
}
.avatar-card{
  background:var(--card); border:1.5px solid var(--border); border-radius:14px;
  padding:10px 8px; text-align:center; cursor:pointer;
  transition:border-color .15s ease, background .15s ease, transform .08s ease;
}
.avatar-card:hover{ border-color:var(--text-dim); }
.avatar-card:active{ transform:scale(0.96); }
.avatar-card.selected{
  border-color:var(--green); background:rgba(0,230,118,0.08); box-shadow:0 0 0 1px var(--green);
}
.avatar-preview-box{
  width:64px; height:64px; border-radius:50%; margin:0 auto; overflow:hidden;
  border:2px solid var(--gold); background:#121820;
}
.avatar-name{ font-family:var(--font-display); font-size:13.5px; color:#fff; margin-top:6px; }
.avatar-desc{ font-size:9.5px; color:var(--text-faint); margin-top:2px; line-height:1.2; }

/* ---------- ANIMACIONES ARBITRALES MEJORADAS ---------- */
.anim-stage{
  position:relative; background:radial-gradient(circle at 50% 25%, #1f2c3d 0%, #0c1219 90%);
  border:1.5px solid var(--border); border-radius:14px; padding:16px 12px; margin-bottom:12px;
  overflow:hidden; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,0.45);
}
.anim-stage::before{
  content:""; position:absolute; inset:0;
  background:radial-gradient(circle at 50% -10%, rgba(0,230,118,0.14), transparent 70%);
  pointer-events:none;
}
.anim-stage::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(255,255,255,0.04) 0%, transparent 60%);
  pointer-events:none;
}
.anim-badge{
  display:inline-block; font-family:var(--font-display); font-size:13px; letter-spacing:1px;
  text-transform:uppercase; padding:5px 14px; border-radius:20px; font-weight:700; margin-top:10px;
  animation:animPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.anim-badge.amarilla{ background:var(--yellow); color:#121820; box-shadow:0 0 20px rgba(255,212,0,0.6); }
.anim-badge.roja{ background:var(--red); color:#fff; box-shadow:0 0 20px rgba(255,77,94,0.7); }
.anim-badge.var{ background:#00d2ff; color:#04141e; box-shadow:0 0 20px rgba(0,210,255,0.6); }
.anim-badge.penal{ background:var(--gold); color:#121820; box-shadow:0 0 18px rgba(240,196,25,0.6); }
.anim-badge.siga{ background:var(--green); color:#04140b; box-shadow:0 0 18px rgba(0,230,118,0.5); }
.anim-badge.calma{ background:#9c27b0; color:#fff; box-shadow:0 0 18px rgba(156,39,176,0.5); }
.anim-badge.silbato{ background:var(--gold); color:#121820; box-shadow:0 0 16px rgba(240,196,25,0.4); }

@keyframes animPop{ 0%{ transform:scale(0.5) translateY(8px); opacity:0; } 70%{ transform:scale(1.08) translateY(-2px); } 100%{ transform:scale(1) translateY(0); opacity:1; } }

/* Tarjeta subiendo con inercia elástica */
.anim-arm-raise{
  transform-origin: bottom center;
  animation: armUp 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}
@keyframes armUp{
  0%{ transform: translateY(45px) scale(0.8); opacity:0; }
  65%{ transform: translateY(-6px) scale(1.04); opacity:1; }
  100%{ transform: translateY(0) scale(1); opacity:1; }
}

.anim-card-glow{
  animation: cardFlash 1.4s infinite alternate ease-in-out;
}
@keyframes cardFlash{
  0%{ filter: drop-shadow(0 0 6px rgba(255,255,255,0.5)); }
  50%{ filter: drop-shadow(0 0 14px currentColor) brightness(1.1); }
  100%{ filter: drop-shadow(0 0 22px currentColor) brightness(1.2); }
}

.anim-shine-sweep{
  animation: shineSweep 2s infinite ease-in-out;
}
@keyframes shineSweep{
  0%{ transform: translateX(-40px) skewX(-20deg); opacity:0; }
  30%{ opacity:0.8; }
  60%{ transform: translateX(50px) skewX(-20deg); opacity:0; }
  100%{ transform: translateX(50px) skewX(-20deg); opacity:0; }
}

/* VAR Dibujando pantalla */
.anim-var-screen{
  stroke-dasharray: 260;
  stroke-dashoffset: 260;
  animation: drawRect 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}
@keyframes drawRect{
  0%{ stroke-dashoffset: 260; opacity:0; }
  50%{ opacity:1; }
  100%{ stroke-dashoffset: 0; opacity:1; }
}

.anim-var-scanline{
  animation: scanMove 1.4s infinite linear;
}
@keyframes scanMove{
  0%{ transform: translateY(-4px); opacity:0.8; }
  50%{ opacity:1; filter: drop-shadow(0 0 6px #00ffff); }
  100%{ transform: translateY(36px); opacity:0.1; }
}

/* Gesto Siga-Siga con inercia fluida */
.anim-wave-left{
  transform-origin: 30px 60px;
  animation: waveArmL 1.1s infinite alternate ease-in-out;
}
@keyframes waveArmL{
  0%{ transform: rotate(-10deg) translateX(-3px); }
  100%{ transform: rotate(20deg) translateX(6px); }
}
.anim-wave-right{
  transform-origin: 70px 60px;
  animation: waveArmR 1.1s infinite alternate ease-in-out;
}
@keyframes waveArmR{
  0%{ transform: rotate(10deg) translateX(3px); }
  100%{ transform: rotate(-20deg) translateX(-6px); }
}

/* Gesto Señalar Penal con pulso de radar */
.anim-point-penal{
  transform-origin: 20px 70px;
  animation: pointPenal 0.9s cubic-bezier(0.25, 1, 0.3, 1.2) infinite alternate;
}
@keyframes pointPenal{
  0%{ transform: rotate(-10deg) scale(0.96); }
  100%{ transform: rotate(10deg) scale(1.06); }
}

.anim-radar-ping{
  animation: radarPing 1.2s infinite ease-out;
}
@keyframes radarPing{
  0%{ transform: scale(0.5); opacity:1; }
  100%{ transform: scale(2.2); opacity:0; }
}

/* Ondas del Silbato */
.anim-whistle-ring{
  transform-origin: 65px 45px;
  animation: whistlePulse 1.1s infinite ease-out;
}
@keyframes whistlePulse{
  0%{ transform: scale(0.5); opacity:1; stroke-width:3.5; }
  100%{ transform: scale(2.4); opacity:0; stroke-width:0.4; }
}

/* Cartel electrónico de descuento */
.anim-board-glow{
  animation: boardPulse 1.2s infinite alternate ease-in-out;
}
@keyframes boardPulse{
  0%{ filter: drop-shadow(0 0 6px #00e676); transform: scale(0.99); }
  100%{ filter: drop-shadow(0 0 18px #00e676); transform: scale(1.02); }
}

/* ---------- ANIMACIONES DE SITUACIONES DE JUEGO (EN CANCHA) ---------- */
.play-stage{
  position:relative; background:radial-gradient(ellipse at 50% 35%, #183323 0%, #0d1a12 70%, #070d09 100%);
  border:1.5px solid rgba(0,230,118,0.28); border-radius:14px; padding:14px 10px; margin-bottom:12px;
  overflow:hidden; text-align:center; box-shadow:inset 0 0 32px rgba(0,0,0,0.65), 0 6px 20px rgba(0,0,0,0.4);
}
.play-stage::before{
  content:""; position:absolute; inset:0;
  background:radial-gradient(ellipse at 50% 0%, rgba(0,230,118,0.15) 0%, transparent 65%);
  pointer-events:none;
}
.play-stage::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(255,255,255,0.04) 0%, transparent 55%);
  pointer-events:none;
}
.play-badge{
  display:inline-block; font-family:var(--font-display); font-size:12px; letter-spacing:1px;
  text-transform:uppercase; padding:4px 12px; border-radius:18px; font-weight:700;
  background:rgba(0,230,118,0.18); color:var(--green); border:1px solid rgba(0,230,118,0.4);
  margin-top:8px; box-shadow:0 0 12px rgba(0,230,118,0.25);
}

.anim-tackle-slide{
  animation: tackleSlide 1.7s infinite cubic-bezier(0.45, 0.05, 0.55, 0.95);
}
@keyframes tackleSlide{
  0%{ transform: translateX(-26px) rotate(6deg); }
  45%{ transform: translateX(8px) rotate(-14deg); }
  75%{ transform: translateX(6px) rotate(-10deg); }
  100%{ transform: translateX(-26px) rotate(6deg); }
}

.anim-grass-burst{
  animation: grassBurst 1.7s infinite ease-out;
}
@keyframes grassBurst{
  0%, 40%{ transform: scale(0); opacity:0; }
  50%{ transform: scale(1.2) translateY(-6px); opacity:1; }
  80%{ transform: scale(1) translateY(4px); opacity:0; }
  100%{ transform: scale(0); opacity:0; }
}

.anim-ball-bounce{
  animation: ballBounce 1.4s infinite cubic-bezier(0.28, 0.84, 0.42, 1);
}
@keyframes ballBounce{
  0%, 100%{ transform: translateY(0) rotate(0deg); }
  50%{ transform: translateY(-18px) rotate(180deg); }
}

.anim-dive-fall{
  animation: diveFall 1.8s infinite ease-in-out;
}
@keyframes diveFall{
  0%{ transform: translate(0, 0) rotate(0deg); }
  35%{ transform: translate(16px, -12px) rotate(-28deg); }
  70%{ transform: translate(24px, 8px) rotate(38deg); }
  100%{ transform: translate(0, 0) rotate(0deg); }
}

.anim-brawl-push{
  animation: brawlPush 1.1s infinite alternate ease-in-out;
}
@keyframes brawlPush{
  0%{ transform: translateX(-5px) scale(0.98); }
  50%{ transform: translateX(6px) scale(1.02); }
  100%{ transform: translateX(-5px) scale(0.98); }
}

.anim-dt-rage{
  animation: dtRage 0.75s infinite alternate ease-in-out;
}
@keyframes dtRage{
  0%{ transform: rotate(-7deg) translateY(0); }
  100%{ transform: rotate(10deg) translateY(-5px); }
}

.anim-line-scan{
  animation: lineScan 1.5s infinite linear;
}
@keyframes lineScan{
  0%{ stroke-dashoffset: 80; opacity:0.3; }
  50%{ opacity:1; filter:drop-shadow(0 0 6px #00e676); }
  100%{ stroke-dashoffset: 0; opacity:0.3; }
}

.anim-smoke-float{
  animation: smokeFloat 2.2s infinite ease-in-out alternate;
}
@keyframes smokeFloat{
  0%{ transform: translateY(0) scale(1); opacity:0.5; }
  50%{ transform: translateY(-8px) scale(1.08); opacity:0.85; }
  100%{ transform: translateY(-14px) scale(1.15); opacity:0.4; }
}

.anim-light-sweep{
  animation: lightSweep 2.5s infinite alternate ease-in-out;
}
@keyframes lightSweep{
  0%{ transform: rotate(-25deg); opacity:0.4; }
  50%{ opacity:0.85; }
  100%{ transform: rotate(25deg); opacity:0.4; }
}

.anim-flag-wave{
  transform-origin: 0 0;
  animation: flagWave 0.8s infinite alternate ease-in-out;
}
@keyframes flagWave{
  0%{ transform: skewY(-8deg) scaleX(0.95); }
  100%{ transform: skewY(12deg) scaleX(1.05); }
}

.press-opt-btn{

}
.press-progress-dot.done{ background: var(--green); border-color: var(--green); }

/* Murmullos de la sala de prensa */
.press-murmurs{
  display: flex;
  align-items: center;
  gap: 7px;

  border: 1px solid rgba(255,255,255,0.06);

}
.press-murmurs .dot{
  width: 6px; height: 6px; border-radius: 50%;

}
@keyframes murmurPulse{ 0%,100%{ opacity:.62; } 50%{ opacity:1; } }
@keyframes murmurBlink{ 0%,100%{ opacity:.3; transform:scale(0.85); } 50%{ opacity:1; transform:scale(1); } }

  align-items: center;
  justify-content: space-between;
}
.vor-cam-selector-strip{
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 6px 0;
  margin-top: 8px;
}
.vor-cam-btn{
  background: #0f1722;
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-family: var(--font-display);
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.5px;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s ease;
}
.vor-cam-btn:hover{
  border-color: #00e5ff;
  color: #fff;
}
.vor-cam-btn.active{
  background: rgba(0,229,255,0.18);
  border-color: #00e5ff;
  color: #00e5ff;
  box-shadow: 0 0 8px rgba(0,229,255,0.3);
}
.vor-intercom-chat{
  background: #080d14;
  border: 1px solid #1c2b3a;
  border-radius: 10px;
  padding: 10px 12px;
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.vor-audio-waveform{
  display: flex;
  align-items: center;
  gap: 3px;
  height: 16px;
}
.vor-wave-bar{
  width: 3px;
  background: #00e5ff;
  border-radius: 2px;
  animation: soundWave 0.8s infinite ease-in-out alternate;
}
.vor-wave-bar:nth-child(2){ animation-delay: 0.15s; height: 14px; }
.vor-wave-bar:nth-child(3){ animation-delay: 0.3s; height: 8px; }
.vor-wave-bar:nth-child(4){ animation-delay: 0.45s; height: 16px; }
.vor-wave-bar:nth-child(5){ animation-delay: 0.1s; height: 10px; }
.vor-wave-bar:nth-child(6){ animation-delay: 0.25s; height: 12px; }
@keyframes soundWave {
  0% { transform: scaleY(0.3); }
  100% { transform: scaleY(1.1); }
}

.mode-title{
  font-family: var(--font-display);
  font-size: 20px;
  color: #fff;
  margin-top: 8px;
  letter-spacing: 0.3px;
}
.mode-desc{
  font-size: 12.5px;
  color: var(--text-dim);
  margin-top: 6px;
  line-height: 1.45;
}
.mode-features-list{
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}
.mode-feat-pill{
  font-size: 10.5px;
  background: #0d131a;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 2px 7px;
  color: var(--text-dim);
}

/* =========================================================
   ESTILOS: BOTONES DE DECISIÓN VAR & SALA VOR (HUD OSCURO)
   ========================================================= */
.choice-btn, .vor-decision-btn{
  display: block;
  width: 100%;
  text-align: left;
  background: linear-gradient(145deg, #101c29, #081018);
  border: 1.5px solid #1a364e;
  border-left: 4.5px solid #00e5ff;
  border-radius: 12px;
  padding: 13px 15px;
  margin-top: 10px;
  cursor: pointer;
  color: #ffffff;
  position: relative;
  overflow: hidden;
  box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  transition: all 0.16s cubic-bezier(0.2, 0, 0.2, 1);
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  box-sizing: border-box;
}
.choice-btn:hover, .vor-decision-btn:hover{
  border-color: #00e5ff;
  background: linear-gradient(145deg, #15273b, #0d1a27);
  box-shadow: 0 0 18px rgba(0,229,255,0.25);
  transform: translateY(-1px);
}
.choice-btn:active, .vor-decision-btn:active{
  transform: scale(0.975) translateY(1px);
  background: #19314a;
  border-color: #00e5ff;
  box-shadow: 0 0 12px rgba(0,229,255,0.35);
}
.choice-btn-title, .vor-btn-title{
  font-family: var(--font-display);
  font-size: 14.5px;
  font-weight: 800;
  color: #ffffff;
  letter-spacing: 0.3px;
  line-height: 1.35;
}
.choice-btn-sub, .vor-btn-sub{
  font-size: 12px;
  color: #a3c4dc;
  margin-top: 4px;
  line-height: 1.45;
  font-weight: 400;
}

/* =========================================================
   ESTILOS: TICKER EN VIVO REFINADO & CRONOLOGÍA
   ========================================================= */
.live-active-stage{
  background: #0c1218;
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 12px;
  margin-top: 12px;

  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: 8px;
  overflow: hidden;

}

  content: "CANCHA EN VIVO";

  top: 8px;
  right: 12px;

  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: 1.2px;
  color: var(--text-faint);
}
.active-play-item{
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  display: flex;
  gap: 10px;
  align-items: baseline;
  transition: opacity 0.25s ease, transform 0.25s ease, border-color 0.25s ease;
}
.active-play-item.current{

}
.active-play-item.gol{
  border-color: rgba(240,196,25,0.6);

  box-shadow: 0 0 16px rgba(240,196,25,0.25);
}
.active-play-item.old{

  transform: scale(0.98);
}

/* Timer para revisión técnica de indumentaria */
.tunnel-timer-container{
  background: #0d131a;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  margin-top: 10px;

  flex-direction: column;

}
.tunnel-timer-top{

  align-items: center;
}
.tunnel-timer-label{

  font-weight: 700;
  color: var(--text-dim);

  letter-spacing: 0.5px;
}

  font-size: 16px;
  font-weight: 800;

.tunnel-timer-bar-wrap{

.pres-achievement-card{

.pres-achievement-body{

.pres-achievement-title{

.pres-achievement-desc{

}
.pres-achievement-badge{

/* Timeline completo de fin de partido */
.match-timeline-accordion{

}
.timeline-event-row{

/* =========================================================

   ========================================================= */

}
.pres-stats-grid{

  grid-template-columns: repeat(2, 1fr);

}
@media(min-width: 500px){
  .pres-stats-grid{ grid-template-columns: repeat(4, 1fr); }
}
.pres-stat-card{
  background: #0d131a;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 12px;

}
.pres-stat-card:hover{
  border-color: rgba(240,196,25,0.4);
}
.pres-stat-card .v{

  font-size: 20px;
  font-weight: 800;
  color: #fff;
  line-height: 1.1;
}
.pres-stat-card .l{
  font-size: 9.5px;
  color: var(--text-faint);
  text-transform: uppercase;
  font-weight: 800;
  letter-spacing: 0.6px;
  margin-top: 4px;
}

/* HUD de estadísticas del Despacho Presidencial (rediseño) */
.pres-hud-grid{
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 14px;
}
@media(min-width: 500px){
  .pres-hud-grid{ grid-template-columns: repeat(4, 1fr); }
}
.pres-hud-card{
  background: linear-gradient(160deg, #131b25 0%, #0a0e14 100%);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 12px 13px 11px;
  position: relative;
  overflow: hidden;
  transition: border-color 0.18s ease, transform 0.15s ease;
}
.pres-hud-card:hover{ transform: translateY(-2px); }
.pres-hud-card.good{ border-color: rgba(0,230,118,0.35); }
.pres-hud-card.warn{ border-color: rgba(240,196,25,0.4); }
.pres-hud-card.bad{ border-color: rgba(255,77,94,0.45); }
.pres-hud-top{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}
.pres-hud-icon{ font-size: 16px; opacity: 0.92; line-height: 1; }
.pres-hud-delta{
  font-family: var(--font-display);
  font-size: 10px;
  font-weight: 800;
  padding: 1px 6px;
  border-radius: 8px;
  letter-spacing: 0.3px;
}
.pres-hud-delta.up{ background: rgba(0,230,118,0.15); color: var(--green); }
.pres-hud-delta.down{ background: rgba(255,77,94,0.15); color: var(--red); }
.pres-hud-value{
  font-family: var(--font-display);
  font-size: 21px;
  font-weight: 800;
  color: #fff;
  margin-top: 7px;
  line-height: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pres-hud-label{
  font-size: 9.5px;
  color: var(--text-faint);
  text-transform: uppercase;
  font-weight: 800;
  letter-spacing: 0.6px;
  margin-top: 4px;
}
.pres-hud-track{
  height: 5px;
  border-radius: 4px;
  background: rgba(255,255,255,0.07);
  margin-top: 9px;
  overflow: hidden;
}
.pres-hud-track-fill{
  height: 100%;
  border-radius: 4px;
  transition: width 0.35s ease;
}
.pres-hud-status{
  font-size: 10px;
  color: var(--text-dim);
  margin-top: 6px;
  font-weight: 600;
  line-height: 1.3;
}

/* Pestañas de Navegación del Despacho */
.pres-nav-tabs-wrapper{
  position: relative;
  width: 100%;
  margin-top: 12px;
}
.pres-nav-tabs{
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 4px 2px 8px 2px;
  scrollbar-width: thin;
  scrollbar-color: var(--gold) #0d131a;
  -webkit-overflow-scrolling: touch;
}
.pres-nav-tabs::-webkit-scrollbar{
  height: 6px;
  display: block;
}
.pres-nav-tabs::-webkit-scrollbar-track{
  background: #0d131a;
  border-radius: 4px;
  border: 1px solid var(--border);
}
.pres-nav-tabs::-webkit-scrollbar-thumb{
  background: linear-gradient(90deg, var(--gold), #ffd54f);
  border-radius: 4px;
}
.pres-nav-tab{
  flex: none;
  background: #0d131a;
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 10px;
  padding: 8px 14px;
  font-family: var(--font-display);
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
}
@media(min-width: 680px){
  .pres-nav-tabs{
    flex-wrap: wrap;
    overflow-x: visible;
  }
  .pres-nav-tab{
    flex: 1 1 calc(25% - 6px);
    text-align: center;
  }
}
.pres-nav-tab:hover{
  border-color: var(--gold);
  color: #fff;
  background: #141c26;
}
.pres-nav-tab.active{
  background: rgba(240,196,25,0.15);
  border-color: var(--gold);
  color: var(--gold);
  box-shadow: 0 0 12px rgba(240,196,25,0.2);
}

.ref-roster-grid{

}
.ref-roster-card{

function hashString(str){
  var hash = 0;
  for(var i=0; i<str.length; i++){
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}

function getTeamCrestConfig(name){
  if(CLUB_CRESTS[name]) return CLUB_CRESTS[name];
  // Deterministic generator if not in list
  var h = hashString(name);
  var palette = [
    { p:"#002b7f", s:"#fdb913", border:"#fff", pattern:"stripes" },
    { p:"#e30613", s:"#ffffff", border:"#111", pattern:"sash" },
    { p:"#007a3d", s:"#ffffff", border:"#fff", pattern:"solid" },
    { p:"#5bc2e7", s:"#ffffff", border:"#003366", pattern:"stripes" },
    { p:"#000000", s:"#e30613", border:"#fff", pattern:"halves" },
    { p:"#7a0026", s:"#ffffff", border:"#fff", pattern:"solid" },
    { p:"#002855", s:"#c8102e", border:"#fff", pattern:"band" }
  ];
  var chosen = palette[h % palette.length];
  var initials = name.replace(/[^A-Za-z0-9]/g, "").substring(0,3).toUpperCase();
  return {
    p: chosen.p, s: chosen.s, border: chosen.border,
    pattern: chosen.pattern, text: initials, textColor: chosen.s === "#ffffff" ? "#ffffff" : chosen.p
  };
}

function renderTeamCrest(name, size, showLabel){
  size = size || 40;
  var cfg = getTeamCrestConfig(name);
  var svgInner = "";

  // Base Shield Path (viewBox 0 0 48 54)
  var shieldD = "M 6 4 L 42 4 Q 44 4 44 8 L 44 28 Q 44 44 24 50 Q 4 44 4 28 L 4 8 Q 4 4 6 4 Z";

      '<g clip-path="url(#clip-'+hashString(name)+')">' +
        '<rect x="14" y="0" width="7" height="54" fill="'+cfg.s+'"/>' +
        '<rect x="28" y="0" width="7" height="54" fill="'+cfg.s+'"/>' +

    svgInner =
      '<path d="'+shieldD+'" fill="'+cfg.p+'"/>' +

        '<polygon points="-4,10 38,56 48,56 6,-2" fill="'+cfg.s+'"/>' +
      '</g>';
  } else if(cfg.pattern === "band"){

      '<path d="'+shieldD+'" fill="'+cfg.p+'"/>' +

        '<rect x="0" y="17" width="48" height="15" fill="'+cfg.s+'"/>' +
      '</g>';
  } else if(cfg.pattern === "band_h"){

      '<g clip-path="url(#clip-'+hashString(name)+')">' +
        '<rect x="24" y="0" width="24" height="54" fill="'+cfg.s+'"/>' +
      '</g>';
  } else if(cfg.pattern === "v_shape"){
    svgInner =
      '<path d="'+shieldD+'" fill="'+cfg.p+'"/>' +
      '<g clip-path="url(#clip-'+hashString(name)+')">' +
        '<polygon points="4,4 44,4 24,32" fill="'+cfg.s+'"/>' +
      '</g>';
  } else if(cfg.pattern === "cross"){
    svgInner =
      '<path d="'+shieldD+'" fill="'+cfg.p+'"/>' +
      '<g clip-path="url(#clip-'+hashString(name)+')">' +
        '<rect x="20" y="0" width="8" height="54" fill="'+cfg.s+'"/>' +
        '<rect x="0" y="18" width="48" height="8" fill="'+cfg.s+'"/>' +
      '</g>';
  } else if(cfg.pattern === "globo"){
    svgInner =
      '<path d="'+shieldD+'" fill="'+cfg.p+'"/>' +
      '<circle cx="24" cy="22" r="11" fill="'+cfg.s+'"/>' +
      '<polygon points="21,33 27,33 24,38" fill="'+cfg.s+'"/>';
  } else if(cfg.pattern === "checkered"){
    svgInner =
      '<path d="'+shieldD+'" fill="'+cfg.p+'"/>' +
      '<g clip-path="url(#clip-'+hashString(name)+')">' +
        '<rect x="0" y="0" width="12" height="12" fill="'+cfg.s+'"/>' +

      '</g>';
  } else {
    // Solid

    texto:function(l,v){ return "Tu asistente número 2 sanciona un fuera de juego milimétrico. El delantero de <b>"+l+"</b> corre 25 metros furioso a increparlo cara a cara levantándole los brazos de forma intimidante."; },

      { texto:"Correr a respaldar a tu asistente y amonestar con amarilla al atacante por conducta antideportiva", tipo:"riguroso", acierto:true, efectos:{nota:1.6,control:7,fama:2}, tarjeta:"amarilla", quien:"local",
        resultado:"Intervenís con celeridad y protegés a tu compañero de terna con tarjeta amarilla. Un arbitraje en equipo de primer nivel." },
      { texto:"Gritarle desde el centro del campo que vuelva a su posición", tipo:"verbal", acierto:false, efectos:{nota:-1.0,control:-5,fama:-1},
        resultado:"Tu asistente queda desamparado ante el reclamo violento. En el vestuario se genera tensión interna en la terna." },
      { texto:"No intervenir y esperar que tu asistente resuelva la situación solo", tipo:"permisivo", acierto:false, efectos:{nota:-1.8,control:-8,fama:-2},
        resultado:"La falta de respaldo al línea proyecta una imagen de debilidad y desconexión total del equipo arbitral." }
    ]},

  { id:"falta_temeraria_barrida", tag:"Juego Temerario / Regla 12", playAnim:"plancha",
    texto:function(l,v){ return "Dividida rápida en la banda. El zaguero de <b>"+v+"</b> barre con vehemencia extrema: toca la pelota de refilón pero levanta por el aire al atacante de <b>"+l+"</b> con arrastre desmedido."; },
    opciones:[
      { texto:"Tiro libre directo y tarjeta amarilla por acción imprudente y temeraria", tipo:"riguroso", acierto:true, efectos:{nota:1.5,control:6,fama:1}, tarjeta:"amarilla", quien:"visitante",
        resultado:"Sancionás la falta y mostrás la amarilla justa por juego temerario. Cuidás el físico de los jugadores con firmeza." },
      { texto:"Hacer seña de 'pelota' y dejar seguir la jugada", tipo:"permisivo", acierto:false, efectos:{nota:-1.7,control:-8,fama:-2},
        resultado:"No cobrás nada. En la siguiente jugada los rivales van a buscar revancha y el partido se te llena de patadas desleales." },
      { texto:"Cobrar la falta pero perdonarle la amonestación", tipo:"verbal", acierto:false, efectos:{nota:-0.8,control:-3,fama:0},
        resultado:"Cobrás el foul pero te guardás la tarjeta. El defensor vuelve a cometer faltas duras al saber que tiene impunidad." }
    ]},

  { id:"ingreso_sin_permiso_arbitro", tag:"Infracción a la Regla 3", playAnim:"falta_tactica",
    texto:function(l,v){ return "Un mediocampista de <b>"+l+"</b> que había salido a cambiarse los botines se mete a la cancha sin esperar tu autorización e intercepta un contraataque de <b>"+v+"</b>."; },
    opciones:[
      { texto:"Detener el juego, amonestar con tarjeta amarilla por entrar sin permiso y reanudar con tiro libre indirecto", tipo:"riguroso", acierto:true, efectos:{nota:1.7,control:7,fama:2}, tarjeta:"amarilla", quien:"local",
        resultado:"Aplicación quirúrgica de la regla 3 del IFAB: tarjeta amarilla por ingreso antirreglamentario y reanudación correcta." },
      { texto:"Hacerle un gesto de 'ok' con la mano mientras corre y dejar seguir la jugada", tipo:"permisivo", acierto:false, efectos:{nota:-2.1,control:-9,fama:-3},
        resultado:"Permitís que un jugador fuera de nómina activa intervenga ilegalmente. La protesta del equipo afectado es feroz." },
      { texto:"Pausar la jugada y llamarle la atención verbalmente sin amonestarlo", tipo:"verbal", acierto:false, efectos:{nota:-1.2,control:-5,fama:-1},
        resultado:"Cortás la jugada pero no mostrás la amarilla estipulada en el reglamento. El Colegio de Árbitros lo apunta en el informe." }
    ]},

  { id:"agarrar_camiseta_descarada", tag:"Conducta Antideportiva / SPA", playAnim:"falta_tactica",
    texto:function(l,v){ return "El hábil volante de <b>"+v+"</b> desborda en velocidad. El defensor de <b>"+l+"</b>, totalmente desbordado, lo agarra de la camiseta estirando la tela hasta tirarlo al suelo."; },
    opciones:[
      { texto:"Cobrar tiro libre directo y mostrar tarjeta amarilla por sujeción descarada (SPA)", tipo:"riguroso", acierto:true, efectos:{nota:1.4,control:6,fama:1}, tarjeta:"amarilla", quien:"local",
        resultado:"Amonestás la sujeción táctica antideportiva de forma impecable. Decisión incuestionable para cualquier tribunal." },
      { texto:"Cobrar solo la falta sin mostrar tarjeta para 'manejar los tiempos'", tipo:"permisivo", acierto:false, efectos:{nota:-1.5,control:-7,fama:-2},
        resultado:"Perdonás una tarjeta cantada. Los jugadores empiezan a cometer agarrones sistemáticos en cada avance." },
      { texto:"Avisarle al defensor cara a cara que no tolerarás otro agarrón", tipo:"verbal", acierto:false, efectos:{nota:-0.7,control:-3,fama:0},
        resultado:"Le hablás enérgicamente, pero la infracción requería sanción disciplinaria según las directivas FIFA." }
    ]},

  { id:"pedido_reiterado_tarjeta_rival", tag:"Protocolo de Conducta / Disenso", playAnim:"protesta_insulto",
    texto:function(l,v){ return "Tras una infracción común, cuatro futbolistas de <b>"+l+"</b> te rodean en manada y el número 10 hace insistentemente con sus manos el gesto del 'rectángulo de tarjeta' exigiendo amonestación."; },
    opciones:[
      { texto:"Amonestar con tarjeta amarilla al número 10 por pedir tarjeta de forma antideportiva y desmedida", tipo:"riguroso", acierto:true, efectos:{nota:1.6,control:7,fama:2}, tarjeta:"amarilla", quien:"local",
        resultado:"Le mostrás la amarilla al que gesticulaba. La manada se disuelve de inmediato al ver tu firmeza reglamentaria." },
      { texto:"Llamar enérgicamente al capitán y exigirle que ordene a sus compañeros de inmediato", tipo:"verbal", acierto:true, efectos:{nota:1.4,control:5,fama:1},
        resultado:"Utilizás el protocolo de capitanes con aplomo y autoridad. El capitán calma a su equipo y se reanuda el juego." },
      { texto:"Ignorar las señas y mirar para otro lado mientras apurás el saque", tipo:"permisivo", acierto:false, efectos:{nota:-1.4,control:-6,fama:-2},
        resultado:"Los jugadores notan que pueden rodearte y condicionarte sin consecuencias. El partido se torna ingobernable." }
    ]},

  { id:"simulacion_piscina_tropezon", tag:"Engaño y Simulación (Regla 12)", playAnim:"simulacion",
    texto:function(l,v){ return "El centrodelantero de <b>"+v+"</b> entra al área grande con pelota dominada y se tira de cabeza a la piscina teatralmente ante el amague de un defensor de <b>"+l+"</b> que ni lo rozó."; },
    opciones:[
      { texto:"Señalar saque de arco y amonestar al atacante con tarjeta amarilla por simulación flagrante", tipo:"riguroso", acierto:true, efectos:{nota:1.8,control:7,fama:2}, tarjeta:"amarilla", quien:"visitante",
        resultado:"Tarjeta amarilla al simulador sin vacilar. La tribuna y la transmisión aplauden de pie tu ojo clínico." },
      { texto:"Cobrar penal comprando el piscinazo del delantero", tipo:"permisivo", acierto:false, efectos:{nota:-2.7,control:-12,fama:-4},
        resultado:"Comprás la simulación y sancionás penal inexistente. La televisión repite el blooper arbitral en horario central." },
      { texto:"Hacerle señas de que se levante y llamarle la atención verbalmente", tipo:"verbal", acierto:false, efectos:{nota:-1.0,control:-4,fama:-1},
        resultado:"Le decís que se levante pero no castigás el intento de estafa deportiva. El defensor inocente te reclama con indignación." }
    ]},

  { id:"gol_fantasma_travesano_pique_linea", tag:"Línea de Meta · ¿Entró o No?", playAnim:"gol_fantasma_pique_fuera",
    texto:function(l,v){ return "Bombazo furibundo de media distancia de <b>"+l+"</b> que se estrella en el travesaño, pica violentamente hacia abajo mordiendo la línea de cal blanca y sale eyectada hacia el área chica. Todos los delanteros salen corriendo con los brazos abiertos gritando gol."; },
    opciones:[
      { texto:"Hacer señas de 'siga, siga' con los brazos: el balón picó en la línea y no cruzó en su totalidad", tipo:"permisivo", acierto:true, efectos:{nota:1.8,control:6,fama:3},
        resultado:"Mantenés el juego en marcha con serenidad total. La repetición en cámara lenta y el ojo de halcón confirman que un 2% del balón cubría la línea. Acierto supremo." },
      { texto:"Convalidar el gol comprando el grito eufórico y la presión de los hinchas", tipo:"riguroso", acierto:false, efectos:{nota:-2.4,control:-10,fama:-4},
        resultado:"Convalidás un gol fantasma inexistente. El club visitante explota de furia y en la televisión el error es calificado como mayúsculo." },
      { texto:"Consultar con tu asistente de línea que estaba perfectamente perfilado", tipo:"verbal", acierto:true, efectos:{nota:1.5,control:4,fama:2},
        resultado:"Te apoyás en tu línea, quien confirma que la pelota no ingresó íntegramente. Buen trabajo en equipo para evitar el error." }
    ]},

  { id:"gol_salvada_arquero_brazos_adentro", tag:"Línea de Meta · Posición del Balón", playAnim:"gol_fantasma_adentro",
    texto:function(l,v){ return "Centro llovido al segundo palo. El arquero de <b>"+v+"</b> retrocede apresurado, salta y atrapa el balón en el aire: sus pies quedan apoyados fuera de la línea de cal, pero sus brazos y la pelota ingresan 40 centímetros adentro del arco antes de sacarla."; },
    opciones:[
      { texto:"Convalidar el gol: lo que define es la posición total del balón, no los pies del arquero", tipo:"riguroso", acierto:true, efectos:{nota:1.9,control:7,fama:3},
        resultado:"¡Gol convalidado! Aplicás la regla a la perfección: el arquero estaba afuera pero la pelota cruzó la línea completamente en sus guantes." },
      { texto:"Dejar seguir considerando que el arquero estaba parado en campo de juego", tipo:"permisivo", acierto:false, efectos:{nota:-2.5,control:-11,fama:-4},
        resultado:"Grave error conceptual: ignorás que el balón traspasó la línea aérea dentro del arco. El cuerpo técnico local te increpa con razón." },
      { texto:"Cobrar falta en ataque inventando una carga contra el arquero", tipo:"verbal", acierto:false, efectos:{nota:-1.6,control:-7,fama:-2},
        resultado:"Inventás una infracción para sacarte el problema de encima. Tu fallo pierde toda credibilidad." }
    ]},

  { id:"gol_red_lateral_rota_ilusion", tag:"Ilusión Óptica · Red Rota Externa", playAnim:"gol_red_lateral",
    texto:function(l,v){ return "Tiro libre rasante y violento de <b>"+l+"</b>. El disparo viaja por fuera del poste, se mete a través de un agujero descosido en la red lateral externa y queda descansando en el fondo del arco. Todo el estadio festeja el gol."; },
    opciones:[
      { texto:"No convalidar gol, señalar saque de arco e intimar al cuarto árbitro a parchar la red", tipo:"riguroso", acierto:true, efectos:{nota:1.9,control:8,fama:3},
        resultado:"Vas directo a revisar la red lateral y mostrás el agujero externo: ¡no fue gol! Valentía y precisión visual ante la presión de 40.000 personas." },
      { texto:"Convalidar el gol al ver la pelota descansando dentro de la red del arco", tipo:"permisivo", acierto:false, efectos:{nota:-3.0,control:-14,fama:-5},
        resultado:"Das por válido un tiro que pasó por afuera del arco. El blooper histórico recorre las cadenas de noticias del mundo entero." },
      { texto:"Hacer repetir el tiro libre argumentando desperfecto del terreno de juego", tipo:"verbal", acierto:false, efectos:{nota:-1.8,control:-8,fama:-2},
        resultado:"Fallo antirreglamentario: debías sancionar saque de meta. La AFA te pide explicaciones técnicas." }
    ]},

  { id:"gol_despeje_chilena_linea_dentro", tag:"Línea de Meta · Despeje Acrobático", playAnim:"despeje_linea_acrobatico",
    texto:function(l,v){ return "Cabezazo bombeado de <b>"+v+"</b> que supera al arquero. El balón pica claramente 10 centímetros detrás de la línea de meta antes de que el zaguero de <b>"+l+"</b> la saque con una espectacular chilena aérea sobre la raya."; },
    opciones:[
      { texto:"Convalidar el gol respaldando la carrera firme de tu asistente hacia la mitad de cancha", tipo:"riguroso", acierto:true, efectos:{nota:1.8,control:6,fama:2},
        resultado:"Señalás el centro de la cancha: ¡GOL! La chilena fue brillante pero la pelota ya había entrado completamente en el pique previo." },
      { texto:"Dejar seguir deslumbrado por la pirueta acrobática del defensor", tipo:"permisivo", acierto:false, efectos:{nota:-2.3,control:-10,fama:-3},
        resultado:"Comprás la acrobacia del defensor e ignorás el pique 10 cm adentro. El equipo atacante protesta con furia justificada." },
      { texto:"Cobrar tiro de esquina creyendo que la pelota había salido por arriba del travesaño", tipo:"verbal", acierto:false, efectos:{nota:-1.5,control:-6,fama:-1},
        resultado:"Decisión confusa que desorienta a ambos conjuntos y evidencia tu desatención de la jugada." }
    ]},

  { id:"gol_poste_interno_rebote_afuera", tag:"Trayectoria Confusa · Poste Interno", playAnim:"gol_fantasma_adentro",
    texto:function(l,v){ return "Zurdazo cruzado y furioso de <b>"+l+"</b>. El tiro entra con comba, golpea con violencia en el caño tensor interno del fondo del arco y sale eyectado hacia el punto penal pareciendo un impacto en el palo exterior."; },
    opciones:[
      { texto:"Hacer sonar el silbato de inmediato y señalar el centro del campo: ¡gol legítimo!", tipo:"riguroso", acierto:true, efectos:{nota:1.8,control:6,fama:2},
        resultado:"Pitás el gol con total seguridad. Las cámaras demuestran que pegó en el hierro del fondo de la red. Ojo de halcón humano." },
      { texto:"Hacer seña de 'poste' y dejar seguir la jugada en el rebote alocadamente", tipo:"permisivo", acierto:false, efectos:{nota:-2.4,control:-10,fama:-3},
        resultado:"Dejás seguir un gol clarísimo porque la pelota salió despedida del arco. Los jugadores locales no lo pueden creer." },
      { texto:"Detener el partido y pedir consulta urgente por intercomunicador", tipo:"verbal", acierto:true, efectos:{nota:1.4,control:4,fama:1},
        resultado:"Frenás las acciones, confirmás el impacto interno con el asistente y otorgás el gol en justicia." }
    ]},

  { id:"gol_obstruccion_arquero_offside_linea", tag:"Regla 11 · Interferencia al Arquero", playAnim:"offside_interferencia",
    texto:function(l,v){ return "Tiro de esquina cerrado de <b>"+v+"</b> que va directo al arco. El balón ingresa, pero un delantero de <b>"+v+"</b> en posición adelantada abraza al arquero de <b>"+l+"</b> sobre la línea impidiéndole manotear el balón."; },
    opciones:[
      { texto:"Anular el gol y cobrar fuera de juego por interferir físicamente en el adversario", tipo:"riguroso", acierto:true, efectos:{nota:1.7,control:7,fama:2},
        resultado:"Anulás el gol con total rigor reglamentario: la interferencia activa del atacante adelantado anuló la respuesta del arquero." },
      { texto:"Convalidar el gol olímpico argumentando que la trayectoria iba al arco de todos modos", tipo:"permisivo", acierto:false, efectos:{nota:-2.2,control:-9,fama:-3},
        resultado:"Das el gol ignorando el bloqueo ilícito al guardameta. El capitán local te muestra el video en su celular." },
      { texto:"Amonestar al arquero por protestar de forma efusiva antes de reanudar", tipo:"verbal", acierto:false, efectos:{nota:-1.6,control:-7,fama:-2}, tarjeta:"amarilla", quien:"local",
        resultado:"Sanción autoritaria e injusta contra la víctima de la infracción que desata una rechifla generalizada." }
    ]},

  { id:"gol_barrida_desesperada_linea_salvada", tag:"Línea de Meta · Salvada Milimétrica", playAnim:"gol_fantasma_pique_fuera",
    texto:function(l,v){ return "Mano a mano en el minuto 88. El delantero define con sutileza, la pelota rueda lentamente hacia el arco vacío y el defensor se arroja en plancha extrema sobre la raya sacándola cuando el balón cubría el 99% de la línea de cal."; },
    opciones:[
      { texto:"Hacer seña de 'siga' con los dos brazos: la pelota no traspasó la línea en un 100%", tipo:"permisivo", acierto:true, efectos:{nota:1.8,control:6,fama:3},
        resultado:"No comprás la ilusión óptica y dejás seguir: la salvada fue milimétricamente lícita antes de cruzar entera. Arbitraje de élite." },
      { texto:"Cobrar gol asumiendo que era matemáticamente imposible sacarla a tiempo", tipo:"riguroso", acierto:false, efectos:{nota:-2.4,control:-11,fama:-3},
        resultado:"Cobrás gol por intuición sin que haya entrado. La tecnología deja al descubierto tu error de cálculo." },
      { texto:"Cobrar tiro libre indirecto por juego peligroso del defensor al tirarse", tipo:"verbal", acierto:false, efectos:{nota:-1.5,control:-6,fama:-1},
        resultado:"Fallo insólito que anula una de las salvadas más espectaculares del campeonato." }
    ]},

  { id:"cesion_pase_atras_pie_mano", tag:"Regla 12 · Cesión al Arquero", playAnim:"cesion_arquero_mano",
    texto:function(l,v){ return "Presión alta de <b>"+v+"</b> en la salida. El defensor central de <b>"+l+"</b> le entrega un pase bombeado y voluntario con el pie a su arquero, quien para evitar el gol la embolsa con las dos manos dentro del área."; },
    opciones:[
      { texto:"Sancionar tiro libre indirecto dentro del área por cesión deliberada con el pie", tipo:"riguroso", acierto:true, efectos:{nota:1.7,control:7,fama:2},
        resultado:"Marcás tiro libre indirecto en el punto de la infracción con brazo en alto. Conocimiento y aplicación perfecta de la regla 12." },
      { texto:"Dejar seguir interpretando que fue un rechazo apurado por la presión rival", tipo:"permisivo", acierto:false, efectos:{nota:-1.9,control:-8,fama:-2},
        resultado:"Ignorás el pase voluntario con el pie. El equipo atacante te rodea reclamando la cesión antirreglamentaria." },
      { texto:"Sancionar penal creyendo erróneamente que cualquier mano del arquero es penal", tipo:"verbal", acierto:false, efectos:{nota:-2.6,control:-12,fama:-4},
        resultado:"Grosero error reglamentario: cobrás penal en una infracción castigada exclusivamente con tiro indirecto." }
    ]},

  { id:"tiro_libre_indirecto_gol_directo", tag:"Regla 13 · Tiro Libre Indirecto", playAnim:"gol_red_lateral",
    texto:function(l,v){ return "Sancionás tiro libre indirecto al borde del área de <b>"+v+"</b> y mantenés el brazo en alto. El ejecutante de <b>"+l+"</b> patea directo al ángulo sin que ningún otro jugador la toque y sale a festejar el gol."; },
    opciones:[
      { texto:"Anular el tanto y reanudar con saque de arco para el equipo defensor (Regla 13)", tipo:"riguroso", acierto:true, efectos:{nota:1.8,control:7,fama:2},
        resultado:"Anulás el gol y señalás el área chica: un tiro indirecto que entra directo no es gol. Cátedra reglamentaria en vivo." },
      { texto:"Convalidar el golazo ignorando la condición de tiro libre indirecto", tipo:"permisivo", acierto:false, efectos:{nota:-2.8,control:-13,fama:-4},
        resultado:"Convalidás un gol ilegal con tu brazo aún en alto. Quedás en evidencia ante todo el país." },
      { texto:"Hacer repetir el tiro libre argumentando falta de entendimiento", tipo:"verbal", acierto:false, efectos:{nota:-1.4,control:-5,fama:-1},
        resultado:"Mandás a repetir erróneamente en vez de otorgar el saque de meta estipulado por el IFAB." }
    ]},

  { id:"agresion_fuera_del_terreno_juego", tag:"Regla 12 · Infracción Fuera de Cancha", playAnim:"tumulto",
    texto:function(l,v){ return "La pelota rueda en disputa limpia sobre la banda. A dos metros fuera de la línea de cal, el lateral de <b>"+l+"</b> le propina un golpe de puño en las costillas al delantero de <b>"+v+"</b> que había quedado fuera por inercia."; },
    opciones:[
      { texto:"Detener el juego, expulsar con roja directa y sancionar tiro libre directo sobre la línea limítrofe más cercana", tipo:"riguroso", acierto:true, efectos:{nota:1.8,control:8,fama:2}, tarjeta:"roja", quien:"local",
        resultado:"Expulsión directa impecable y reanudación sobre la línea más cercana según las enmiendas FIFA. Impecable." },
      { texto:"Amonestar solo con amarilla argumentando que 'ocurrió fuera de la cancha'", tipo:"permisivo", acierto:false, efectos:{nota:-2.0,control:-9,fama:-2}, tarjeta:"amarilla", quien:"local",
        resultado:"Te quedás corto con la amarilla ante una agresión física deliberada. La víctima se retira lesionada." },
      { texto:"Dejar seguir y no intervenir porque la jugada ya estaba en otra parte del campo", tipo:"verbal", acierto:false, efectos:{nota:-2.5,control:-11,fama:-3},
        resultado:"Omitís una agresión flagrante fuera del campo. El Tribunal de Disciplina te sanciona con dos fechas de suspensión." }
    ]},

  { id:"tarjeta_cabezazo_pelea", tag:"Conducta Violenta / Regla 12", playAnim:"cabezazo_pelea",
    texto:function(l,v){ return "En un cruce verbal cara a cara tras un lateral disputado, el delantero de <b>"+l+"</b> le asesta un cabezazo violento directo al mentón al zaguero de <b>"+v+"</b>, quien cae sangrando al césped."; },
    opciones:[
      { texto:"Tarjeta roja directa inmediata por conducta violenta flagrante (Regla 12 IFAB)", tipo:"riguroso", acierto:true, efectos:{nota:1.8,control:8,fama:2}, tarjeta:"roja", quien:"local",
        resultado:"Expulsás al agresor sin dudar. Cuidás la integridad y sentás un precedente de tolerancia cero a la violencia." },
      { texto:"Mostrar solo tarjeta amarilla considerándolo un 'roce de cabezas sin fuerza'", tipo:"permisivo", acierto:false, efectos:{nota:-2.5,control:-12,fama:-4}, tarjeta:"amarilla", quien:"local",
        resultado:"Grosero error disciplinario: perdonás una agresión física directa. El partido se transforma en una batalla campal." },
      { texto:"Amonestar a ambos futbolistas por 'forcejeo mutuo' sin expulsar a nadie", tipo:"verbal", acierto:false, efectos:{nota:-1.8,control:-8,fama:-2}, tarjeta:"amarilla", quien:"ambos",
        resultado:"Equiparás injustamente a la víctima con el agresor. La prensa deportiva condena tu falta de carácter arbitral." }
    ]},

  { id:"tarjeta_plancha_pecho_voladora", tag:"Juego Brusco Grave / Roja Directa", playAnim:"plancha_pecho",
    texto:function(l,v){ return "Salida rápida en contragolpe. El defensor de <b>"+v+"</b> salta con los tapones de punta hacia adelante e impacta de lleno en el esternón del atacante de <b>"+l+"</b> a la altura del pecho con fuerza desmedida."; },

    "discusion_bancos": [ 0, +5 ],
    "descuento": [ 0, 0, 0 ]
  };

  var arr = mapLocal[evId];
  var delta = 0;
  if(arr && arr[opIdx] !== undefined){
    delta = arr[opIdx];
    if(eqFavorecido === "visitante"){
      delta = -delta; // Invertir si el sobornador es el visitante
    }
  }

  if(delta > 0){
    return { delta: delta, hint: "💼 Complace al dirigente (+"+delta+"%)", cls:"pos" };

    return { delta: delta, hint: "⚠️ Enoja al dirigente ("+delta+"%)", cls:"neg" };

  }
}

function generarPrensa(){
  var ultimaNota = state.carreraNotas.length ? state.carreraNotas[state.carreraNotas.length-1] : null;
  var tono;
  if(ultimaNota!==null && ultimaNota<4.5) tono = "neg";
  else if(ultimaNota!==null && ultimaNota>=8) tono = "pos";
  else if(state.fama>=65) tono = "pos";
  else if(state.fama<=35) tono = "neg";
  else tono = "neu";

  var texto = pick(TITULARES[tono]).replace("{nombre}", state.ref.nombre);
  var famaDelta = tono==="pos" ? 1 : (tono==="neg" ? -1 : 0);
  state.fama = clamp(state.fama + famaDelta, 0, 100);

  agregarPostRedes({
    tipo: "prensa",
    icon: tono==="pos" ? "📈" : (tono==="neg" ? "📉" : "🗞️"),
    plataforma: pick(["Twitter/X", "Instagram", "Foro de Hinchas", "Grupo de WhatsApp de la Comisión"]),
    texto: texto,
    tono: tono
  });

  return { tono:tono, texto:texto };
}

function getAudioCtx(){
  if(!audioCtx){
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ audioCtx = null; }
  }
  if(audioCtx && audioCtx.state === "suspended"){

  }
  return audioCtx;
}

function generarBufferRuido(ctx, segundos){
  var bufferSize = Math.floor(ctx.sampleRate * segundos);
  var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  var data = buffer.getChannelData(0);
  var b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
  for(var i=0;i<bufferSize;i++){
    var white = Math.random()*2-1;
    b0 = 0.99886*b0 + white*0.0555179;
    b1 = 0.99332*b1 + white*0.0750759;
    b2 = 0.96900*b2 + white*0.1538520;
    b3 = 0.86650*b3 + white*0.3104856;
    b4 = 0.55000*b4 + white*0.5329522;
    b5 = -0.7616*b5 - white*0.0168980;
    var pink = b0+b1+b2+b3+b4+b5+b6+white*0.5362;
    b6 = white*0.115926;
    data[i] = pink * 0.11;
  }
  return buffer;
}

function sfxWhistle(){

  osc.frequency.setValueAtTime(2150, t);
  osc.frequency.linearRampToValueAtTime(2500, t+0.05);
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(0.10, t+0.02);
  gain.gain.linearRampToValueAtTime(0.10, t+0.15);
  gain.gain.linearRampToValueAtTime(0, t+0.24);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t); osc.stop(t+0.26);
}

  gain.gain.linearRampToValueAtTime(pico, t+0.3);
  gain.gain.linearRampToValueAtTime(0, t+1.3);

function sfxRadioChirp(){
  if(!sfxEnabled) return;
  var ctx = getAudioCtx(); if(!ctx) return;
  var t = ctx.currentTime;
  var osc = ctx.createOscillator(); var gain = ctx.createGain();
  osc.type = "sawtooth";
  osc.frequency.setValueAtTime(2200, t);
  osc.frequency.exponentialRampToValueAtTime(1400, t+0.07);
  gain.gain.setValueAtTime(0.04, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t+0.08);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t); osc.stop(t+0.09);
}

var intercomStaticNode = null;
var intercomGainNode = null;

function iniciarIntercomNoise(volume){
  if(!sfxEnabled) return;
  var ctx = getAudioCtx(); if(!ctx) return;
  detenerIntercomNoise();
  try {
    var buffer = generarBufferRuido(ctx, 3);
    var source = ctx.createBufferSource();
    source.buffer = buffer; source.loop = true;
    
    var bandpass = ctx.createBiquadFilter();
    bandpass.type = "bandpass";
    bandpass.frequency.value = 1350;
    bandpass.Q.value = 2.2;

    var highpass = ctx.createBiquadFilter();
    highpass.type = "highpass";
    highpass.frequency.value = 450;

    var gain = ctx.createGain();
    var targetVol = typeof volume === "number" ? volume : 0.055;
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(targetVol, ctx.currentTime + 0.08);

    source.connect(bandpass);
    bandpass.connect(highpass);
    highpass.connect(gain);
    gain.connect(ctx.destination);

    source.start();
    intercomStaticNode = source;
    intercomGainNode = gain;
  } catch(e){}
}

function detenerIntercomNoise(){
  if(intercomStaticNode && intercomGainNode){
    try {
      var ctx = getAudioCtx();
      var t = ctx ? ctx.currentTime : 0;
      intercomGainNode.gain.linearRampToValueAtTime(0, t+0.1);
      intercomStaticNode.stop(t+0.12);
    } catch(e){}
    intercomStaticNode = null;
    intercomGainNode = null;
  }
}

function sfxPTTPress(){
  if(!sfxEnabled) return;
  var ctx = getAudioCtx(); if(!ctx) return;
  var t = ctx.currentTime;
  // Roger click / Beep
  var osc = ctx.createOscillator();
  var gain = ctx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(1780, t);
  osc.frequency.setValueAtTime(2450, t+0.03);
  gain.gain.setValueAtTime(0.06, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t+0.09);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t); osc.stop(t+0.1);
  iniciarIntercomNoise(0.065);
}

function sfxPTTRelease(){
  if(!sfxEnabled) return;
  var ctx = getAudioCtx(); if(!ctx) return;
  var t = ctx.currentTime;
  detenerIntercomNoise();
  // Squelch tail / Click final
  var osc = ctx.createOscillator();
  var gain = ctx.createGain();
  osc.type = "square";
  osc.frequency.setValueAtTime(880, t);
  osc.frequency.exponentialRampToValueAtTime(320, t+0.05);
  gain.gain.setValueAtTime(0.04, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t+0.06);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t); osc.stop(t+0.07);
}
function sfxVARConfirmed(){
  if(!sfxEnabled) return;
  var ctx = getAudioCtx(); if(!ctx) return;
  var t = ctx.currentTime;
  [523.25, 783.99, 1046.50].forEach(function(freq, idx){
    var osc = ctx.createOscillator(); var gain = ctx.createGain();
    osc.type = "triangle"; osc.frequency.value = freq;
    var t0 = t + idx*0.06;
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(0.05, t0+0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t0+0.25);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t0); osc.stop(t0+0.28);
  });
}
function iniciarAmbienteMultitud(){
  if(!sfxEnabled) return;
  var ctx = getAudioCtx(); if(!ctx) return;
  detenerAmbienteMultitud();
  try {
    var buffer = generarBufferRuido(ctx, 4);
    var source = ctx.createBufferSource();
    source.buffer = buffer; source.loop = true;
    var filtro = ctx.createBiquadFilter();
    filtro.type = "lowpass"; filtro.frequency.value = 850;
    var gain = ctx.createGain();
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.045, ctx.currentTime + 1.2);
    source.connect(filtro); filtro.connect(gain); gain.connect(ctx.destination);
    source.start();
    crowdNodes = { source:source, gain:gain };
  } catch(e){}
}
function detenerAmbienteMultitud(){
  if(crowdNodes){
    try {
      var ctx = getAudioCtx();
      var t = ctx ? ctx.currentTime : 0;
      crowdNodes.gain.gain.linearRampToValueAtTime(0, t+0.4);
      crowdNodes.source.stop(t+0.45);
    } catch(e){}
    crowdNodes = null;
  }
}
window.toggleSonido = function(){
  state.sonido = state.sonido === false ? true : false;
  sfxEnabled = state.sonido;
  if(!sfxEnabled){
    detenerAmbienteMultitud();
  } else if(["matchLive","event","feedback","tension","tensionResultado","halftime"].indexOf(state.screen) !== -1){
    iniciarAmbienteMultitud();
  }
  render();
};
function fmtMoney(n){
  n = Math.round(n);
  return "$" + n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

function agregarPostRedes(post){
  if(!Array.isArray(state.redesFeed)) state.redesFeed = [];
  post.id = "post_" + Date.now() + "_" + Math.floor(Math.random()*9999);
  post.fecha = state.fecha;
  state.redesFeed.unshift(post);
  if(state.redesFeed.length > 50) state.redesFeed = state.redesFeed.slice(0, 50);
}
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function categoriaActual(){ return CATEGORIAS[state.catIndex]; }
function estiloActual(){ return ESTILOS[state.ref.estiloId]; }
function promedio(arr){
  if(!arr.length) return 0;
  var s=0; for(var i=0;i<arr.length;i++) s+=arr[i];
  return s/arr.length;
}
function calcularOVR(){
  var cat = categoriaActual();
  var confMedia = state.carreraNotas.length ? promedio(state.carreraNotas) : 6;
  var bonusShop = 0;
  if(state.compras["reloj_hublot"]) bonusShop += 2;
  if(state.compras["mansion_nordelta"]) bonusShop += 3;
  var val = cat.ovrBase + (confMedia-6)*4 + (state.fama-50)*0.12 + bonusShop;
  return Math.round(clamp(val,20,99));
}
function calcularConfianza(){
  return state.carreraNotas.length ? promedio(state.carreraNotas) : 0;
}

function bonusControlTienda(){
  var b = 0;
  if(state.compras["silbato_fox"]) b += 3;
  if(state.compras["spray_pro"]) b += 4;
  if(state.compras["intercom_var"]) b += 5;

  if(state.compras["casa_pileta"]) b += 6;
  if(state.compras["preparador_fisico"]) b += 5;
  return b;
}

    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function dots(total, actual){
  total = Math.min(total, 20);
  var out = "";
  for(var i=1;i<=total;i++){
    var cls = i<actual ? "done" : (i===actual ? "now" : "");
    out += '<span class="'+cls+'"></span>';
  }
  return out;
}

window.comprarItem = function(itemId){
  var it = TIENDA_ITEMS.find(function(item){ return item.id === itemId; });
  if(!it || state.compras[itemId] || state.ingresos < it.precio) return;
  state.ingresos -= it.precio;
  state.compras[itemId] = true;

  // Bonificaciones inmediatas de fama si corresponde
  if(itemId === "tarjetas_neon") state.fama = clamp(state.fama + 3, 0, 100);
  if(itemId === "reloj_hublot") state.fama = clamp(state.fama + 8, 0, 100);
  if(itemId === "suv_premium") state.fama = clamp(state.fama + 6, 0, 100);
  if(itemId === "deportivo_lujo") state.fama = clamp(state.fama + 12, 0, 100);
  if(itemId === "mansion_nordelta") state.fama = clamp(state.fama + 15, 0, 100);
  if(itemId === "asesor_prensa") state.fama = clamp(state.fama + 7, 0, 100);

  render();
};

window.irAProximoPartido = function(){
  var cat = categoriaActual();
  var equipos = shuffle(cat.equipos);
  var local = equipos[0], visitante = equipos[1];

  // Garantizar que las 3 situaciones de descuento (2, 5 y 8 min) salgan aleatoriamente de forma balanceada y rotativa
  if(!state.descuentosPool || !state.descuentosPool.length){
    state.descuentosPool = shuffle(["fluido", "normal", "accidentado"]);
  }
  var tipoDesc = state.descuentosPool.pop();
  var evDescuento = crearEventoDescuento(tipoDesc);

  var nExtra = rand(2,4);
  var pool = shuffle(EVENTOS).slice(0, nExtra);

  // Bonus de control desde la tienda
  var controlInicial = clamp(70 + bonusControlTienda(), 50, 95);

  state.match = {
    local:local, visitante:visitante,
    minuto:0,
    eventos: pool.concat([evDescuento]),
    idx:0,
    nota:6.0,
    control:controlInicial,
    amarillas:0, rojas:0, penales:0,
    tipoDescuento: tipoDesc,
    soborno: null,
    lastFeedback:null,
    golesLocal:0, golesVisitante:0,
    ticker:[], arrancoTicker:false, descansoMostrado:false,
    minutoDestino:0, onLlegada:null
  };

  state.prensaActual = generarPrensa();

  // Nueva situación previa relacionada a la vida cotidiana del árbitro (dinero + reputación)
  if(!state.situacionesPreviasPool || !state.situacionesPreviasPool.length){
    state.situacionesPreviasPool = shuffle(SITUACIONES_PREVIAS.map(function(s){ return s.id; }));
  }
  var idSituacion = state.situacionesPreviasPool.pop();
  var situacionBase = SITUACIONES_PREVIAS.find(function(s){ return s.id === idSituacion; });
  state.situacionPrevia = {
    id: situacionBase.id,
    respondida: false,
    opcionElegida: null
  };
  state.screen = "situacion_previa";
  render();
};

function decidirEventoApriete(){
  var cat = categoriaActual();
  var local = state.match.local, visitante = state.match.visitante;

  // Posibilidad de evento de apriete / soborno antes de partido (35% de probabilidad)
  var hayApriete = Math.random() < 0.35;
  if(hayApriete){
    var favoreceA = Math.random() < 0.5 ? "local" : "visitante";
    var eqNombre = favoreceA === "local" ? local : visitante;
    var montoBase = Math.round(cat.salario * (1.5 + Math.random()*2));

    state.bribeOffer = {
      equipo: favoreceA,
      equipoNombre: eqNombre,
      monto: montoBase,
      dirigente: pick(["Un influyente dirigente de la CD de ","El presidente y hombre fuerte de ","Un emisario cercano a la barra pesada de "]) + eqNombre
    };
    state.screen = "bribe";
  } else {
    state.screen = "week";
  }
  render();
}

window.resolverSituacionPrevia = function(optIdx){
  var sp = state.situacionPrevia;
  if(!sp || sp.respondida) return;
  var base = SITUACIONES_PREVIAS.find(function(s){ return s.id === sp.id; });
  var op = base.opciones[optIdx];
  var cat = categoriaActual();

  var ingresosDelta = Math.round(cat.salario * (op.factorIngresos || 0));
  state.ingresos = Math.max(0, state.ingresos + ingresosDelta);
  state.fama = clamp(state.fama + (op.famaDelta || 0), 0, 100);

  sp.respondida = true;
  sp.opcionElegida = { texto: op.texto, badge: op.badge, cls: op.cls, resultado: op.resultado, ingresosDelta: ingresosDelta, famaDelta: op.famaDelta || 0 };

  triggerHaptic("decision");
  render();
};

window.continuarTrasSituacionPrevia = function(){
  triggerHaptic("light");
  decidirEventoApriete();
};
