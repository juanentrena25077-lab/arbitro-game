<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Carrera Arbitral — Simulador de Árbitro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap');

:root{
  --bg:#0a0e13;
  --bg-grad:#0d1420;
  --panel:#131a23;
  --card:#181f2a;
  --card-hi:#1e2733;
  --border:#262f3b;
  --text:#e9eef3;
  --text-dim:#8b96a3;
  --text-faint:#5c6673;
  --green:#00e676;
  --green-deep:#00a856;
  --gold:#f0c419;
  --gold-deep:#c99e0e;
  --red:#ff4d5e;
  --yellow:#ffd400;
  --purple:#b388ff;
  --font-display:'Oswald', 'Arial Narrow', sans-serif;
  --font-body:'Inter', -apple-system, sans-serif;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html,body{
  margin:0; padding:0;
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(0,230,118,0.07), transparent 60%),
    linear-gradient(180deg, var(--bg-grad) 0%, var(--bg) 100%);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
}

#app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  padding:18px 16px 40px;
  position:relative;
}

/* ---------- Scrollbar / focus ---------- */
::-webkit-scrollbar{ width:8px; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
  outline:2px solid var(--green); outline-offset:2px;
}

/* ---------- Typography helpers ---------- */
h1,h2,h3{ font-family:var(--font-display); margin:0; letter-spacing:0.3px; }
.eyebrow{
  font-family:var(--font-body); font-weight:800; font-size:10.5px;
  letter-spacing:1.6px; text-transform:uppercase; color:var(--text-faint);
}
.muted{ color:var(--text-dim); }

/* ---------- Buttons ---------- */
.btn{
  display:block; width:100%; box-sizing:border-box;
  font-family:var(--font-display); font-size:18px; font-style:italic;
  text-align:center; text-transform:uppercase; letter-spacing:0.4px;
  padding:15px 14px; border-radius:12px; border:none; cursor:pointer;
  font-weight:600; margin-top:10px; transition:transform .08s ease, filter .15s ease, opacity .15s ease;
}
.btn:active{ transform:scale(0.97); }
.btn-primary{
  background:linear-gradient(180deg, var(--green) 0%, var(--green-deep) 100%);
  color:#04140b;
  box-shadow:0 6px 18px rgba(0,230,118,0.25);
}
.btn-primary:hover{ filter:brightness(1.06); }
.btn-gold{
  background:linear-gradient(180deg, var(--gold) 0%, var(--gold-deep) 100%);
  color:#221a02;
  box-shadow:0 6px 18px rgba(240,196,25,0.2);
}
.btn-purple{
  background:linear-gradient(180deg, #b388ff 0%, #7c4dff 100%);
  color:#0d051a;
  box-shadow:0 6px 18px rgba(179,136,255,0.25);
}
.btn-outline{
  background:transparent; color:var(--text); border:1.5px solid var(--border);
  box-shadow:none;
}
.btn-outline:hover{ border-color:var(--text-dim); }
.btn-danger{
  background:linear-gradient(180deg, #ff5b6b 0%, #d8283a 100%); color:#1a0508;
}
.btn:disabled{ opacity:0.4; cursor:not-allowed; }
.btn-small{ font-size:13px; padding:9px 10px; border-radius:9px; margin-top:8px; }

/* ---------- Cards / panels ---------- */
.panel{
  background:var(--panel); border:1px solid var(--border); border-radius:16px;
  padding:16px; margin-top:14px;
}
.card{
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  padding:14px; margin-top:12px;
}

/* ---------- Referee ID card ---------- */
.id-card{
  position:relative; overflow:hidden;
  border-radius:18px; padding:18px 16px 16px;
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 22px),
    linear-gradient(160deg, #111820 0%, #0c1117 100%);
  border:1px solid var(--border);
  box-shadow: inset 0 0 0 1px rgba(0,230,118,0.06), 0 10px 30px rgba(0,0,0,0.35);
}
.id-card::before{
  content:"FEDERACIÓN";
  position:absolute; right:-38px; top:22px; width:180px;
  transform:rotate(35deg); text-align:center;
  font-family:var(--font-display); font-size:13px; font-weight:700;
  letter-spacing:3px; color:rgba(240,196,25,0.10);
}
.id-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.id-serial{ font-family:'Courier New', monospace; font-size:10.5px; color:var(--text-faint); letter-spacing:1px; }
.id-badge{
  font-family:var(--font-body); font-weight:800; font-size:9.5px; letter-spacing:1px;
  text-transform:uppercase; color:#04140b; background:var(--green);
  padding:4px 9px; border-radius:20px; white-space:nowrap;
}
.id-main{ display:flex; align-items:center; gap:14px; margin-top:12px; }
.id-photo{
  width:58px; height:58px; border-radius:50%; flex:none;
  background:radial-gradient(circle at 35% 30%, #2a3542, #0e131a 75%);
  border:2px solid var(--gold);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-size:22px; color:var(--gold);
}
.id-name{ font-family:var(--font-display); font-size:21px; color:#fff; line-height:1.1; }
.id-sub{ font-size:11.5px; color:var(--text-dim); margin-top:3px; }
.id-ovr{
  margin-left:auto; text-align:center; flex:none;
}
.id-ovr .num{ font-family:var(--font-display); font-size:30px; color:var(--gold); line-height:1; }
.id-ovr .lbl{ font-size:9px; letter-spacing:1.5px; color:var(--text-faint); text-transform:uppercase; }
.id-stamp{
  margin-top:14px; padding-top:12px; border-top:1px dashed var(--border);
  display:flex; justify-content:space-between; font-size:11px; color:var(--text-dim);
}
.id-stamp b{ color:var(--text); }

/* ---------- Stat grid ---------- */
.stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:12px; }
.stat-box{
  background:var(--card); border:1px solid var(--border); border-radius:12px;
  padding:11px 12px; text-align:left;
}
.stat-box .v{ font-family:var(--font-display); font-size:19px; color:var(--green); font-weight:600; }
.stat-box .l{ font-size:9.5px; color:var(--text-faint); text-transform:uppercase; font-weight:800; letter-spacing:0.6px; margin-top:2px; }
.stat-box.gold .v{ color:var(--gold); }
.stat-box.red .v{ color:var(--red); }
.stat-box.purple .v{ color:var(--purple); }
.stat-box.wide{ grid-column:span 2; }

/* ---------- Meters ---------- */
.meter-row{ margin-top:10px; }
.meter-head{ display:flex; justify-content:space-between; font-size:11px; margin-bottom:5px; }
.meter-head b{ color:var(--text); font-weight:700; }
.meter-track{ height:8px; background:#0d131a; border-radius:6px; overflow:hidden; border:1px solid var(--border); }
.meter-fill{ height:100%; border-radius:6px; transition:width .4s ease; }

/* ---------- Match header ---------- */
.match-title{
  text-align:center; margin-top:6px;
}
.match-title .vs{
  font-family:var(--font-display); font-size:23px; font-style:italic; color:#fff; margin-top:4px;
}
.match-title .vs .sep{ color:var(--green); margin:0 8px; }
.minute-badge{
  display:inline-flex; align-items:center; gap:6px; margin-top:10px;
  background:#0d131a; border:1px solid var(--border); border-radius:20px;
  padding:6px 14px; font-family:var(--font-display); font-size:14px; color:var(--gold);
}

/* ---------- Event card ---------- */
.event-tag{
  display:inline-block; font-size:9.5px; font-weight:800; letter-spacing:1px;
  text-transform:uppercase; color:var(--bg); background:var(--gold);
  padding:3px 9px; border-radius:6px; margin-bottom:9px;
}
.event-text{ font-size:15.5px; line-height:1.5; color:var(--text); }
.option-btn{
  display:block; width:100%; text-align:left; background:var(--card-hi);
  border:1.5px solid var(--border); color:var(--text); border-radius:12px;
  padding:13px 14px; margin-top:10px; font-family:var(--font-body); font-size:14.5px;
  font-weight:600; cursor:pointer; position:relative; overflow:hidden;
  transition:border-color .18s ease, transform .12s cubic-bezier(0.2, 0, 0.2, 1), background .18s ease, box-shadow .18s ease;
  user-select:none; -webkit-tap-highlight-color:transparent;
}
.option-btn:hover{ border-color:var(--green); background:#1c2632; }
.option-btn:active{
  transform:scale(0.97) translateY(1px);
  background:#223040; border-color:var(--green);
  box-shadow:0 0 14px rgba(0,230,118,0.3);
}

/* Transiciones Fluidas entre Partido y Feedback */
.trans-event-container{
  animation: transEventIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes transEventIn{
  0%{ opacity:0; transform:translateY(14px) scale(0.985); }
  100%{ opacity:1; transform:translateY(0) scale(1); }
}

.trans-feedback-container{
  animation: transFeedbackIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes transFeedbackIn{
  0%{ opacity:0; transform:translateY(18px) scale(0.97); }
  60%{ opacity:1; transform:translateY(-2px) scale(1.006); }
  100%{ opacity:1; transform:translateY(0) scale(1); }
}

.verdict-banner-enter{
  animation: verdictBannerPop 0.42s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}
@keyframes verdictBannerPop{
  0%{ opacity:0; transform:scale(0.86) translateY(-10px); }
  100%{ opacity:1; transform:scale(1) translateY(0); }
}

.feedback-box-enter{
  animation: feedbackBoxSlide 0.38s cubic-bezier(0.16, 1, 0.3, 1) 0.06s both;
}
@keyframes feedbackBoxSlide{
  0%{ opacity:0; transform:translateY(12px); }
  100%{ opacity:1; transform:translateY(0); }
}

/* Bribe Hint on Option */
.bribe-hint-tag{
  display:inline-block; font-size:10px; font-weight:800; letter-spacing:0.5px;
  padding:2px 8px; border-radius:6px; margin-bottom:6px; text-transform:uppercase;
}
.bribe-hint-tag.pos{ background:rgba(0,230,118,0.18); color:var(--green); border:1px solid rgba(0,230,118,0.4); }
.bribe-hint-tag.neg{ background:rgba(255,77,94,0.18); color:var(--red); border:1px solid rgba(255,77,94,0.4); }
.bribe-hint-tag.neu{ background:rgba(139,150,163,0.15); color:var(--text-dim); border:1px solid var(--border); }

/* ---------- Feedback ---------- */
.feedback-box{
  border-radius:14px; padding:14px; margin-top:12px; border:1px solid var(--border);
  background:var(--card);
}
.feedback-box.pos{ border-color:rgba(0,230,118,0.35); background:rgba(0,230,118,0.06); }
.feedback-box.neg{ border-color:rgba(255,77,94,0.35); background:rgba(255,77,94,0.06); }
.feedback-box.bribe{ border-color:rgba(179,136,255,0.4); background:rgba(179,136,255,0.08); }
.feedback-title{ font-family:var(--font-display); font-size:14px; text-transform:uppercase; letter-spacing:0.5px; }
.feedback-title.pos{ color:var(--green); }
.feedback-title.neg{ color:var(--red); }
.feedback-title.bribe{ color:var(--purple); }
.delta-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
.delta-pill{
  font-size:11px; font-weight:700; padding:3px 8px; border-radius:20px;
  background:#0d131a; border:1px solid var(--border);
}
.delta-pill.up{ color:var(--green); border-color:rgba(0,230,118,0.3); }
.delta-pill.down{ color:var(--red); border-color:rgba(255,77,94,0.3); }
.delta-pill.purple{ color:var(--purple); border-color:rgba(179,136,255,0.4); }
.card-flag{
  display:inline-block; width:14px; height:19px; border-radius:2px; margin-right:6px; vertical-align:middle;
}
.card-flag.amarilla{ background:var(--yellow); }
.card-flag.roja{ background:var(--red); }

/* ---------- Misc ---------- */
.center{ text-align:center; }
.section-title{ font-family:var(--font-display); font-size:19px; color:#fff; margin-top:4px; }
.divider{ height:1px; background:var(--border); margin:16px 0; border:none; }
.progress-dots{ display:flex; gap:5px; justify-content:center; margin-top:10px; }
.progress-dots span{ width:7px; height:7px; border-radius:50%; background:var(--border); }
.progress-dots span.done{ background:var(--green); }
.progress-dots span.now{ background:var(--gold); }

.form-group{ margin-top:14px; }
.form-label{ font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.8px; color:var(--text-faint); display:block; margin-bottom:6px; }
.form-input{
  width:100%; background:#0d131a; border:1.5px solid var(--border); color:var(--text);
  padding:12px 13px; border-radius:10px; font-family:var(--font-body); font-size:15px;
}
.form-input:focus{ border-color:var(--green); outline:none; }

.style-option{
  border:1.5px solid var(--border); border-radius:14px; padding:13px 14px; margin-top:10px;
  cursor:pointer; background:var(--card); transition:border-color .15s ease, background .15s ease;
}
.style-option.selected{ border-color:var(--green); background:rgba(0,230,118,0.07); }
.style-option .st-name{ font-family:var(--font-display); font-size:16px; color:#fff; }
.style-option .st-desc{ font-size:12.5px; color:var(--text-dim); margin-top:4px; line-height:1.4; }

.badge-cat{
  display:inline-block; font-size:10px; font-weight:800; letter-spacing:0.6px; text-transform:uppercase;
  color:var(--bg); background:var(--green); padding:3px 10px; border-radius:20px; margin-top:6px;
}
.result-big{
  font-family:var(--font-display); font-size:52px; text-align:center; color:var(--gold); line-height:1; margin-top:6px;
}
.result-big small{ font-size:20px; color:var(--text-faint); }

.headline{ font-family:var(--font-display); font-size:15px; color:var(--text); line-height:1.5; margin-top:10px; }
.footer-note{ text-align:center; font-size:10.5px; color:var(--text-faint); margin-top:26px; letter-spacing:0.3px; }

.toprow{ display:flex; align-items:center; justify-content:space-between; }
.logo{ font-family:var(--font-display); font-size:15px; letter-spacing:1px; color:var(--text-dim); text-transform:uppercase; }
.logo b{ color:var(--green); }

/* ---------- Shop Styles ---------- */
.shop-cat-header{
  font-family:var(--font-display); font-size:16px; color:var(--gold); letter-spacing:0.8px;
  text-transform:uppercase; margin-top:18px; margin-bottom:8px; border-bottom:1px solid var(--border); padding-bottom:4px;
}
.shop-item{
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  padding:14px; margin-top:10px;
}
.shop-item.owned{
  border-color:rgba(0,230,118,0.4); background:rgba(0,230,118,0.04);
}
.shop-item-title{
  display:flex; justify-content:space-between; align-items:center;
}
.shop-item-name{ font-family:var(--font-display); font-size:17px; color:#fff; }
.shop-item-price{ font-family:var(--font-display); font-size:16px; color:var(--gold); font-weight:700; }
.shop-item-desc{ font-size:12.5px; color:var(--text-dim); margin-top:5px; line-height:1.4; }
.shop-item-perk{ font-size:11.5px; color:var(--green); font-weight:700; margin-top:6px; }
.tag-owned{
  display:inline-block; font-size:10px; font-weight:800; letter-spacing:0.6px;
  text-transform:uppercase; color:var(--green); background:rgba(0,230,118,0.12);
  border:1px solid rgba(0,230,118,0.3); padding:3px 8px; border-radius:12px;
}
.inventory-list{
  display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;
}
.inventory-tag{
  font-size:11px; background:#0d131a; border:1px solid var(--border);
  padding:3px 8px; border-radius:6px; color:var(--text-dim);
}

.id-photo{
  width:58px; height:58px; border-radius:50%; flex:none;
  background:#121820;
  border:2px solid var(--gold);
  overflow:hidden;
  display:flex; align-items:center; justify-content:center;
}
.id-photo svg{ width:100%; height:100%; display:block; }

.avatar-tabs{ display:flex; gap:8px; margin-top:12px; }
.avatar-tab-btn{
  flex:1; padding:9px 12px; border-radius:10px; font-family:var(--font-display);
  font-size:14px; background:var(--card); color:var(--text-dim); border:1px solid var(--border);
  cursor:pointer; text-transform:uppercase; text-align:center;
}
.avatar-tab-btn.active{
  background:rgba(0,230,118,0.12); color:var(--green); border-color:rgba(0,230,118,0.4); font-weight:700;
}

.avatar-grid{
  display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-top:12px;
}
.avatar-card{
  background:var(--card); border:1.5px solid var(--border); border-radius:14px;
  padding:10px 8px; text-align:center; cursor:pointer;
  transition:border-color .15s ease, background .15s ease, transform .08s ease;
}
.avatar-card:hover{ border-color:var(--text-dim); }
.avatar-card:active{ transform:scale(0.96); }
.avatar-card.selected{
  border-color:var(--green); background:rgba(0,230,118,0.08); box-shadow:0 0 0 1px var(--green);
}
.avatar-preview-box{
  width:64px; height:64px; border-radius:50%; margin:0 auto; overflow:hidden;
  border:2px solid var(--gold); background:#121820;
}
.avatar-name{ font-family:var(--font-display); font-size:13.5px; color:#fff; margin-top:6px; }
.avatar-desc{ font-size:9.5px; color:var(--text-faint); margin-top:2px; line-height:1.2; }

/* ---------- ANIMACIONES ARBITRALES MEJORADAS ---------- */
.anim-stage{
  position:relative; background:radial-gradient(circle at 50% 25%, #1f2c3d 0%, #0c1219 90%);
  border:1.5px solid var(--border); border-radius:14px; padding:16px 12px; margin-bottom:12px;
  overflow:hidden; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,0.45);
}
.anim-stage::before{
  content:""; position:absolute; inset:0;
  background:radial-gradient(circle at 50% -10%, rgba(0,230,118,0.14), transparent 70%);
  pointer-events:none;
}
.anim-stage::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(255,255,255,0.04) 0%, transparent 60%);
  pointer-events:none;
}
.anim-badge{
  display:inline-block; font-family:var(--font-display); font-size:13px; letter-spacing:1px;
  text-transform:uppercase; padding:5px 14px; border-radius:20px; font-weight:700; margin-top:10px;
  animation:animPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.anim-badge.amarilla{ background:var(--yellow); color:#121820; box-shadow:0 0 20px rgba(255,212,0,0.6); }
.anim-badge.roja{ background:var(--red); color:#fff; box-shadow:0 0 20px rgba(255,77,94,0.7); }
.anim-badge.var{ background:#00d2ff; color:#04141e; box-shadow:0 0 20px rgba(0,210,255,0.6); }
.anim-badge.penal{ background:var(--gold); color:#121820; box-shadow:0 0 18px rgba(240,196,25,0.6); }
.anim-badge.siga{ background:var(--green); color:#04140b; box-shadow:0 0 18px rgba(0,230,118,0.5); }
.anim-badge.calma{ background:#9c27b0; color:#fff; box-shadow:0 0 18px rgba(156,39,176,0.5); }
.anim-badge.silbato{ background:var(--gold); color:#121820; box-shadow:0 0 16px rgba(240,196,25,0.4); }

@keyframes animPop{ 0%{ transform:scale(0.5) translateY(8px); opacity:0; } 70%{ transform:scale(1.08) translateY(-2px); } 100%{ transform:scale(1) translateY(0); opacity:1; } }

/* Tarjeta subiendo con inercia elástica */
.anim-arm-raise{
  transform-origin: bottom center;
  animation: armUp 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}
@keyframes armUp{
  0%{ transform: translateY(45px) scale(0.8); opacity:0; }
  65%{ transform: translateY(-6px) scale(1.04); opacity:1; }
  100%{ transform: translateY(0) scale(1); opacity:1; }
}

.anim-card-glow{
  animation: cardFlash 1.4s infinite alternate ease-in-out;
}
@keyframes cardFlash{
  0%{ filter: drop-shadow(0 0 6px rgba(255,255,255,0.5)); }
  50%{ filter: drop-shadow(0 0 14px currentColor) brightness(1.1); }
  100%{ filter: drop-shadow(0 0 22px currentColor) brightness(1.2); }
}

.anim-shine-sweep{
  animation: shineSweep 2s infinite ease-in-out;
}
@keyframes shineSweep{
  0%{ transform: translateX(-40px) skewX(-20deg); opacity:0; }
  30%{ opacity:0.8; }
  60%{ transform: translateX(50px) skewX(-20deg); opacity:0; }
  100%{ transform: translateX(50px) skewX(-20deg); opacity:0; }
}

/* VAR Dibujando pantalla */
.anim-var-screen{
  stroke-dasharray: 260;
  stroke-dashoffset: 260;
  animation: drawRect 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}
@keyframes drawRect{
  0%{ stroke-dashoffset: 260; opacity:0; }
  50%{ opacity:1; }
  100%{ stroke-dashoffset: 0; opacity:1; }
}

.anim-var-scanline{
  animation: scanMove 1.4s infinite linear;
}
@keyframes scanMove{

/* GENERADOR DINÁMICO DE EVENTO DE DESCUENTO (2, 5 u 8 MINUTOS) */
function crearEventoDescuento(tipo){
  if(tipo === "fluido"){
    return {
      id:"descuento",
      tag:"⏱️ Tiempo Adicional · Partido Limpio y Fluido",
      playAnim:"descuento_tablero",
      texto:function(l,v){ return "El segundo tiempo entre <b>"+l+"</b> y <b>"+v+"</b> fue extraordinariamente ágil: sin atenciones médicas, sin tumultos y con cambios muy veloces. Es momento de indicar los minutos adicionales al cuarto árbitro."; },
      opciones:[
        { texto:"Mínimo reglamentario por cambios rápidos (2 minutos)", minutos:2, tipo:"riguroso", acierto:true, efectos:{nota:1.7,control:5,fama:2},
          resultado:"Adicionás 2 minutos exactos y justos para un partido sin demoras. Ambos cuerpos técnicos aprueban tu criterio." },
        { texto:"Cinco minutos estándar por costumbre (5 minutos)", minutos:5, tipo:"verbal", acierto:false, efectos:{nota:-1.1,control:-4,fama:-1},
          resultado:"Adicionás 5 minutos innecesarios en un trámite que no tuvo interrupciones. Los jugadores se miran extrañados." },
        { texto:"Ocho minutos exagerados (8 minutos)", minutos:8, tipo:"permisivo", acierto:false, efectos:{nota:-2.3,control:-9,fama:-3},
          resultado:"Adicionás 8 minutos insólitos. La crítica unánime de los relatores te cuestiona por regalar tiempo de más." }
      ]
    };
  } else if(tipo === "accidentado"){
    return {
      id:"descuento",
      tag:"⏱️ Tiempo Adicional · Partido Plagado de Demoras",
      playAnim:"descuento_tablero",

    "festejo_provocador": [ -20, +15 ],
    "banco_suplente": [ +25, -15 ],
    "arquero_saque_lateral": [ -15, +15 ],
    "arquero_finge_lesion": [ +20, -15 ],
    "empujon_tumulto": [ 0, +5 ],

    "simulacion_area_real": [ +25, -30 ],
    "mano_intencional": [ -30, +30 ],
    "invasion_cancha": [ -20, +20 ],
    "bengalas_humo": [ +15, -20 ],
    "corte_luz_estadio": [ +20, -25 ],
    "invasion_cancha_hincha": [ +15, -20 ],

    "offside_interferencia_vision": [ -25, +25 ],

    "ingreso_sin_permiso_arbitro": [ -25, +25, +15 ],
    "agarrar_camiseta_descarada": [ -20, +20, +10 ],
    "pedido_reiterado_tarjeta_rival": [ +20, +15, -20 ],
    "simulacion_piscina_tropezon": [ +25, -30, -15 ],
    "gol_fantasma_travesano_pique_linea": [ -25, +25, 0 ],
    "gol_salvada_arquero_brazos_adentro": [ +30, -30, -15 ],
    "gol_red_lateral_rota_ilusion": [ -25, +30, 0 ],
    "gol_despeje_chilena_linea_dentro": [ -30, +30, 0 ],
    "gol_poste_interno_rebote_afuera": [ +30, -30, 0 ],
    "gol_obstruccion_arquero_offside_linea": [ +25, -25, -15 ],
    "gol_barrida_desesperada_linea_salvada": [ -25, +25, 0 ],

    "discusion_bancos": [ 0, +5 ],
    "descuento": [ 0, 0, 0 ]
  };

  var arr = mapLocal[evId];
  var delta = 0;
  if(arr && arr[opIdx] !== undefined){
    delta = arr[opIdx];
    if(eqFavorecido === "visitante"){
      delta = -delta; // Invertir si el sobornador es el visitante
    }
  }

  if(delta > 0){
    return { delta: delta, hint: "💼 Complace al dirigente (+"+delta+"%)", cls:"pos" };
  } else if(delta < 0){
    return { delta: delta, hint: "⚠️ Enoja al dirigente ("+delta+"%)", cls:"neg" };

  }
}

function generarPrensa(){
  var ultimaNota = state.carreraNotas.length ? state.carreraNotas[state.carreraNotas.length-1] : null;
  var tono;
  if(ultimaNota!==null && ultimaNota<4.5) tono = "neg";
  else if(ultimaNota!==null && ultimaNota>=8) tono = "pos";
  else if(state.fama>=65) tono = "pos";
  else if(state.fama<=35) tono = "neg";
  else tono = "neu";

  var texto = pick(TITULARES[tono]).replace("{nombre}", state.ref.nombre);
  var famaDelta = tono==="pos" ? 1 : (tono==="neg" ? -1 : 0);
  state.fama = clamp(state.fama + famaDelta, 0, 100);
  return { tono:tono, texto:texto };
}

}

function clamp(n,min,max){ return Math.max(min, Math.min(max,n)); }
function rand(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[rand(0,arr.length-1)]; }

function triggerHaptic(type){
  if(typeof navigator !== "undefined" && navigator.vibrate){
    try {
      if(type === "success"){
        navigator.vibrate([16, 28, 18]);
      } else if(type === "error"){
        navigator.vibrate([28, 40, 28]);
      } else if(type === "decision"){
        navigator.vibrate([18, 22, 18]);
      } else {
        navigator.vibrate(14);
      }
    } catch(e){}
  }
}
function fmtMoney(n){
  n = Math.round(n);
  return "$" + n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function categoriaActual(){ return CATEGORIAS[state.catIndex]; }
function estiloActual(){ return ESTILOS[state.ref.estiloId]; }
function promedio(arr){
  if(!arr.length) return 0;
  var s=0; for(var i=0;i<arr.length;i++) s+=arr[i];
  return s/arr.length;
}
function calcularOVR(){
  var cat = categoriaActual();
  var confMedia = state.carreraNotas.length ? promedio(state.carreraNotas) : 6;
  var bonusShop = 0;
  if(state.compras["reloj_hublot"]) bonusShop += 2;
  if(state.compras["mansion_nordelta"]) bonusShop += 3;
  var val = cat.ovrBase + (confMedia-6)*4 + (state.fama-50)*0.12 + bonusShop;
  return Math.round(clamp(val,20,99));
}
function calcularConfianza(){
  return state.carreraNotas.length ? promedio(state.carreraNotas) : 0;
}

function bonusControlTienda(){
  var b = 0;
  if(state.compras["silbato_fox"]) b += 3;
  if(state.compras["spray_pro"]) b += 4;
  if(state.compras["intercom_var"]) b += 5;
  if(state.compras["sedan_cero"]) b += 4;
  if(state.compras["casa_pileta"]) b += 6;
  if(state.compras["preparador_fisico"]) b += 5;
  return b;
}

window.irAProximoPartido = function(){
  var cat = categoriaActual();
  var equipos = shuffle(cat.equipos);
  var local = equipos[0], visitante = equipos[1];

  // Garantizar que las 3 situaciones de descuento (2, 5 y 8 min) salgan aleatoriamente de forma balanceada y rotativa
  if(!state.descuentosPool || !state.descuentosPool.length){
    state.descuentosPool = shuffle(["fluido", "normal", "accidentado"]);
  }
  var tipoDesc = state.descuentosPool.pop();
  var evDescuento = crearEventoDescuento(tipoDesc);

  var nExtra = rand(2,4);
  var pool = shuffle(EVENTOS).slice(0, nExtra);

  // Bonus de control desde la tienda
  var controlInicial = clamp(70 + bonusControlTienda(), 50, 95);

  state.match = {
    local:local, visitante:visitante,
    minuto:0,
    eventos: pool.concat([evDescuento]),
    idx:0,
    nota:6.0,
    control:controlInicial,
    amarillas:0, rojas:0, penales:0,
    tipoDescuento: tipoDesc,
    soborno: null,
    lastFeedback:null
  };

  state.prensaActual = generarPrensa();

  // Posibilidad de evento de apriete / soborno antes de partido (35% de probabilidad)
  var hayApriete = Math.random() < 0.35;
  if(hayApriete){
    var favoreceA = Math.random() < 0.5 ? "local" : "visitante";
    var eqNombre = favoreceA === "local" ? local : visitante;
    var montoBase = Math.round(cat.salario * (1.5 + Math.random()*2));

    state.bribeOffer = {
      equipo: favoreceA,
      equipoNombre: eqNombre,
      monto: montoBase,
      dirigente: pick(["Un influyente dirigente de la CD de ","El presidente y hombre fuerte de ","Un emisario cercano a la barra pesada de "]) + eqNombre
    };
    state.screen = "bribe";
  } else {
    state.screen = "week";
  }
  render();
};

window.elegirOpcion = function(i){
  var m = state.match;
  var ev = m.eventos[m.idx];
  var op = ev.opciones[i];
  var estilo = estiloActual();

  var efectos = {
    nota: op.efectos.nota || 0,
    control: op.efectos.control || 0,
    fama: op.efectos.fama || 0
  };

  // Bonus de reloj inteligente si es descuento
  if(ev.id === "descuento" && state.compras["reloj_spintso"] && efectos.nota > 0){
    efectos.nota += 1.0;
  }

  var sinergia = false;
  if(estilo && op.tipo===estilo.bonusTipo){
    efectos.control += estilo.bonusControl;
    efectos.fama += estilo.bonusFama;
    sinergia = true;
  }

  m.nota = m.nota + efectos.nota;
  m.control = clamp(m.control + efectos.control, 0, 100);
  state.fama = clamp(state.fama + efectos.fama, 0, 100);

  if(op.tarjeta==="amarilla"){ m.amarillas++; }
  if(op.tarjeta==="roja"){ m.rojas++; }
  var PENAL_EN_OPCION_0 = ["mano_area","plancha_penal","mano_intencional"];
  var PENAL_EN_OPCION_1 = ["simulacion_area","simulacion_area_real"];
  if(PENAL_EN_OPCION_0.indexOf(ev.id)!==-1 && i===0){ m.penales++; }
  if(PENAL_EN_OPCION_1.indexOf(ev.id)!==-1 && i===1){ m.penales++; }

  // Calcular efecto de soborno si existe
  var bribeDelta = 0;
  if(m.soborno){
    var resSob = calcularEfectoSoborno(ev.id, i, m.soborno.equipo);
    bribeDelta = resSob.delta;
    m.soborno.satisfaccion = clamp(m.soborno.satisfaccion + bribeDelta, 0, 100);
  }

  // Determinar tipo de animación visual
  var animType = "silbato";
  var resLower = (op.resultado || "").toLowerCase();
  var txtLower = (op.texto || "").toLowerCase();
  var evId = (ev.id || "").toLowerCase();

  if(ev.id === "descuento"){
    animType = "cartel_descuento";
  } else if(op.tarjeta === "roja" || resLower.indexOf("roja") !== -1 || txtLower.indexOf("roja") !== -1 || resLower.indexOf("expuls") !== -1){
    animType = "tarjeta_roja";
  } else if(op.tarjeta === "amarilla" || resLower.indexOf("amarilla") !== -1 || txtLower.indexOf("amarilla") !== -1 || resLower.indexOf("amonest") !== -1){
    animType = "tarjeta_amarilla";
  } else if(evId.indexOf("var") !== -1 || txtLower.indexOf("pantalla") !== -1 || resLower.indexOf("var") !== -1 || txtLower.indexOf("var") !== -1){
    animType = "var_check";
  } else if(resLower.indexOf("penal") !== -1 || txtLower.indexOf("penal") !== -1 || resLower.indexOf("doce pasos") !== -1){
    animType = "gesto_penal";
  } else if(resLower.indexOf("siga") !== -1 || txtLower.indexOf("seguir") !== -1 || resLower.indexOf("correr") !== -1 || resLower.indexOf("pegada al cuerpo") !== -1){
    animType = "gesto_siga";
  } else if(op.tipo === "verbal" || resLower.indexOf("calm") !== -1 || resLower.indexOf("habl") !== -1 || resLower.indexOf("avisa") !== -1){
    animType = "gesto_calma";
  }

  var esAcierto = (op.acierto !== undefined) ? op.acierto : (efectos.nota >= 0);

  // Respuesta háptica sutil en el dispositivo
  triggerHaptic(esAcierto ? "success" : "decision");

  m.lastFeedback = {
    resultado: op.resultado,
    efectos: efectos,
    tarjeta: op.tarjeta || null,
    sinergia: sinergia,
    bribeDelta: bribeDelta,
    animType: animType,
    acierto: esAcierto,
    minutosDescuento: op.minutos || (ev.id==="descuento" ? 5 : null)
  };

  state.screen = "feedback";
  render();
};

function screenFeedback(){
  var m = state.match;
  var fb = m.lastFeedback;
  var pos = fb.efectos.nota >= 0;

  var chips = "";
  if(fb.efectos.nota) chips += deltaPill("Nota partido", fb.efectos.nota, 1);
  if(fb.efectos.control) chips += deltaPill("Control", fb.efectos.control, 0);
  if(fb.efectos.fama) chips += deltaPill("Fama", fb.efectos.fama, 0);
  if(m.soborno && fb.bribeDelta !== 0){
    var bUp = fb.bribeDelta > 0;
    chips += '<span class="delta-pill purple">💼 Dirigente '+(bUp?'+':'')+fb.bribeDelta+'%</span>';
  }

  var tarjetaHtml = "";
  if(fb.tarjeta){
    tarjetaHtml = '<div style="margin-top:10px;"><span class="card-flag '+fb.tarjeta+'"></span>' +
      (fb.tarjeta==="roja" ? "Tarjeta roja mostrada" : "Tarjeta amarilla mostrada") + '</div>';
  }

  var sinergiaHtml = fb.sinergia ? '<div class="muted" style="font-size:11.5px; margin-top:8px;">✓ Decisión alineada con tu estilo declarado.</div>' : "";
  var animVisualHtml = renderDecisionAnimation(fb.animType || "silbato", state.ref.avatarId, { minutos: fb.minutosDescuento });

  var verdictClass = fb.acierto ? "correct" : "error";
  var verdictText = fb.acierto ? "✅ DECISIÓN ACERTADA (+PRECISIÓN TÉCNICA)" : "❌ ERROR ARBITRAL (-PRECISIÓN TÉCNICA)";

  return topbar() +
    '<div class="trans-feedback-container">' +
      animVisualHtml +
      '<div class="verdict-banner verdict-banner-enter '+verdictClass+'">'+verdictText+'</div>' +
      '<div class="feedback-box feedback-box-enter '+(pos?"pos":"neg")+'" style="margin-top:10px;">' +
        '<div class="feedback-title '+(pos?"pos":"neg")+'">'+ (pos?"Buena lectura de juego":"Decisión cuestionada") +'</div>' +
        '<div class="headline">'+ fb.resultado +'</div>' +
        tarjetaHtml +
        '<div class="delta-row">'+ chips +'</div>' +
        sinergiaHtml +
      '</div>' +
      '<button class="btn btn-primary" onclick="continuarTrasFeedback()">'+ (esUltimoEvento()?"Concluir partido e ir a Conferencia de Prensa →":"Continuar el partido") +'</button>' +
    '</div>';
}

function deltaPill(label, value, decimals){
  var up = value>=0;
  var txt = (up?"+":"") + value.toFixed(decimals);
  return '<span class="delta-pill '+(up?"up":"down")+'">'+label+' '+txt+'</span>';
}

function esUltimoEvento(){
  return state.match.idx >= state.match.eventos.length-1;
}

window.continuarTrasFeedback = function(){
  triggerHaptic("decision");
  var m = state.match;
  if(esUltimoEvento()){
    cerrarPartido();
  } else {
    m.idx++;
    siguienteEvento();
  }
};

/* ---------- CIERRE DE PARTIDO ---------- */
function cerrarPartido(){
  var m = state.match;
  var notaFinal = m.nota;

  if(m.control < 30) notaFinal -= 1.5;
  else if(m.control > 80) notaFinal += 0.4;

  notaFinal = clamp(Math.round(notaFinal*10)/10, 1, 10);

  var cat = categoriaActual();
  var pagoBase = cat.salario * (0.65 + notaFinal/10);
  state.ingresos += Math.round(pagoBase);

  // Pago de soborno según satisfacción
  var extraSoborno = 0;
  var mensajeSoborno = "";
  if(m.soborno){
    if(m.soborno.satisfaccion >= 65){
      extraSoborno = m.soborno.monto;
      state.ingresos += extraSoborno;
      mensajeSoborno = "💼 <b>Trato cumplido:</b> El dirigente de "+ m.soborno.equipoNombre +" quedó sumamente satisfecho y te entrega el sobre completo de "+ fmtMoney(extraSoborno) +".";
    } else if(m.soborno.satisfaccion >= 40){
      extraSoborno = Math.round(m.soborno.monto * 0.4);
      state.ingresos += extraSoborno;
      mensajeSoborno = "💼 <b>Pago parcial:</b> “No cobraste todo lo que pedimos”. Te entregan el 40% del sobre ("+ fmtMoney(extraSoborno) +").";
    } else {
      state.fama = clamp(state.fama - 6, 0, 100);
      mensajeSoborno = "⚠️ <b>Dirigente furioso:</b> No cumpliste el acuerdo. No ves ni un peso y recibís llamados amenazantes tras el partido (-Fama).";
    }
  }

  state.stats.partidos++;
  state.stats.amarillas += m.amarillas;
  state.stats.rojas += m.rojas;
  state.stats.penales += m.penales;

  state.carreraNotas.push(notaFinal);
  state.temporadaNotas.push(notaFinal);

  m.notaFinal = notaFinal;
  m.pago = Math.round(pagoBase);
  m.extraSoborno = extraSoborno;
  m.mensajeSoborno = mensajeSoborno;

  // Iniciar Conferencia de Prensa tras el partido
  state.pressConference = generarConferenciaDePrensa(m);
  state.screen = "press_conference";
  render();
}

      '<div class="panel">' +
        '<div class="eyebrow" style="display:flex; justify-content:space-between; align-items:center;">' +
          '<span>Rueda de Prensa · '+ m.local +' vs '+ m.visitante +'</span>' +
          '<span class="media-badge '+mediaBadgeCls+'">'+ conf.medio +'</span>' +
        '</div>' +
        '<div style="margin-top:8px;">' +
          '<div style="font-size:12px; font-weight:700; color:#bbb; text-transform:uppercase; letter-spacing:0.5px;">Pregunta de '+ conf.periodista +' ('+ conf.medio +'):</div>' +
          '<div class="press-question">“'+ conf.pregunta +'”</div>' +
        '</div>' +
        (!conf.respondida ? '<p class="muted" style="font-size:12px; margin-top:10px;">Elegí con qué postura y tono responderás a los cronistas deportivos:</p>' : '') +
        opcionesHtml +
      '</div>' +
    '</div>';
}

window.responderPrensa = function(optIdx){
  var conf = state.pressConference;
  if(conf.respondida) return;
  triggerHaptic("decision");
  var op = conf.opciones[optIdx];
  conf.respondida = true;
  conf.opcionElegida = op;

  state.fama = clamp(state.fama + (op.famaDelta || 0), 0, 100);
  render();
};

window.irAResultadoFinal = function(){
  triggerHaptic("success");
  state.screen = "matchResult";
  render();
};

function screenMatchResult(){
  var m = state.match;
  var cat = categoriaActual();
  var veredicto = "";
  if(m.notaFinal>=8.5) veredicto = "Arbitraje sobresaliente. La Federación lo destaca en el informe semanal.";
  else if(m.notaFinal>=7) veredicto = "Buen partido dirigido. Control sólido de principio a fin.";
  else if(m.notaFinal>=5.5) veredicto = "Un partido correcto, sin brillar, pero sin sobresaltos graves.";
  else if(m.notaFinal>=4) veredicto = "Rendimiento flojo. Varias decisiones quedaron en duda.";
  else veredicto = "Partido para el olvido. La prensa te destroza en las redes.";

  var sobornoBoxHtml = "";
  if(m.mensajeSoborno){
    sobornoBoxHtml = '<div class="feedback-box '+(m.extraSoborno>0?'bribe':'neg')+'" style="margin-top:12px; text-align:left;">' +
      '<div class="headline" style="font-size:13.5px;">'+ m.mensajeSoborno +'</div>' +
    '</div>';
  }

  return topbar() +
    '<div class="panel center">' +
      '<div class="eyebrow">Fin del partido · '+ m.local +' vs '+ m.visitante +'</div>' +
      '<div class="result-big">'+ m.notaFinal.toFixed(1) +'<small>/10</small></div>' +
      '<p class="muted" style="font-size:13px; margin-top:8px;">'+ veredicto +'</p>' +
      sobornoBoxHtml +
    '</div>' +
    '<div class="stat-grid">' +
      '<div class="stat-box"><div class="v" style="color:var(--yellow);">'+ m.amarillas +'</div><div class="l">Amarillas del partido</div></div>' +
      '<div class="stat-box red"><div class="v">'+ m.rojas +'</div><div class="l">Rojas del partido</div></div>' +
      '<div class="stat-box gold"><div class="v">'+ fmtMoney(m.pago + (m.extraSoborno||0)) +'</div><div class="l">Total recaudado</div></div>' +
      '<div class="stat-box"><div class="v">'+ Math.round(m.control) +'</div><div class="l">Control final</div></div>' +
    '</div>' +
    '<button class="btn btn-primary" onclick="avanzarCalendario()">Continuar</button>';
}

window.avanzarCalendario = function(){
  var cat = categoriaActual();
  state.match = null;
  state.bribeOffer = null;
  if(state.fecha >= cat.fechas){
    cerrarTemporada();
  } else {
    state.fecha++;
    state.screen = "dashboard";
    render();
  }
};

/* ---------- CIERRE DE TEMPORADA ---------- */
function cerrarTemporada(){
  var avg = promedio(state.temporadaNotas);
  var cat = categoriaActual();
  var resultado = { avg: Math.round(avg*10)/10, categoriaAnterior: cat.nombre, movimiento:"mantiene", mensaje:"" };

  if(avg >= 8){
    if(state.catIndex < CATEGORIAS.length-1){
      state.catIndex++;
      resultado.movimiento = "ascenso";
      resultado.mensaje = "La Federación te asciende a "+ CATEGORIAS[state.catIndex].nombre +" por tu excelente temporada.";
      state.seasonsBajas = 0;
    } else {
      resultado.mensaje = "Ya estás en la cima del arbitraje. Consolidás tu lugar en el Mundial.";
      state.seasonsBajas = 0;
    }
  } else if(avg < 5){
    state.seasonsBajas++;
    if(state.seasonsBajas >= 2){
      state.despedido = true;
      resultado.movimiento = "despido";
      resultado.mensaje = "Dos temporadas flojas consecutivas. La Federación decide desvincularte del cuerpo arbitral.";
    } else if(state.catIndex > 0){
      state.catIndex--;
      resultado.movimiento = "descenso";
      resultado.mensaje = "Tras una temporada floja, te reasignan a "+ CATEGORIAS[state.catIndex].nombre +".";
    } else {
      resultado.movimiento = "sancion";
      resultado.mensaje = "Recibís una seria advertencia de la Federación. Una temporada más así y quedás fuera.";
    }
  } else {
    resultado.mensaje = "Temporada pareja, sin sobresaltos. Seguís en "+ cat.nombre +".";
    state.seasonsBajas = 0;
  }

  state.lastSeasonResult = resultado;
  state.temporadaNotas = [];
  state.bajadasTemporada = 0; // Se resetea el contador de bajadas por temporada
  state.fecha = 1;
  state.ref.edad++;

  if(state.despedido){
    state.screen = "gameover";
  } else if(state.ref.edad >= 48){
    state.retirado = true;
    state.screen = "retirement";
  } else {
    state.screen = "seasonSummary";
  }
  render();
}

function screenSeasonSummary(){
  var r = state.lastSeasonResult;
  var color = r.movimiento==="ascenso" ? "var(--green)" : (r.movimiento==="descenso"||r.movimiento==="sancion" ? "var(--red)" : "var(--gold)");
  var tag = { ascenso:"ASCENSO", descenso:"DESCENSO", sancion:"ADVERTENCIA", mantiene:"SE MANTIENE" }[r.movimiento] || "TEMPORADA CERRADA";

  return topbar() +
    '<div class="panel center">' +
      '<div class="eyebrow">Resumen de temporada</div>' +
      '<h2 class="section-title" style="margin-top:6px;">'+ r.categoriaAnterior +'</h2>' +
      '<div class="result-big" style="color:'+color+';">'+ r.avg.toFixed(1) +'<small>/10</small></div>' +
      '<div class="muted" style="font-size:11px; text-transform:uppercase; letter-spacing:1px; margin-top:2px;">Nota media de la temporada</div>' +
      '<div class="badge-cat" style="background:'+color+';">'+ tag +'</div>' +
      '<p class="headline" style="margin-top:14px;">'+ r.mensaje +'</p>' +
    '</div>' +
    '<div class="stat-grid">' +
      '<div class="stat-box"><div class="v">'+ state.ref.edad +'</div><div class="l">Edad actual</div></div>' +
      '<div class="stat-box gold"><div class="v">'+ fmtMoney(state.ingresos) +'</div><div class="l">Billetera actual</div></div>' +
    '</div>' +
    '<button class="btn btn-primary" onclick="comenzarProximaTemporada()">Comenzar próxima temporada</button>';
}

window.comenzarProximaTemporada = function(){
  state.screen = "dashboard";
  render();
};

/* ---------- RETIRO / GAME OVER ---------- */
function screenRetirement(){
  var conf = calcularConfianza();
  return topbar() +
    '<div class="panel center">' +
      '<div class="eyebrow">Fin de la carrera</div>' +
      '<h1 class="section-title" style="font-size:26px; margin-top:8px;">RETIRO DEL<br/>ÁRBITRO '+ escapeHtml(state.ref.nombre).toUpperCase() +'</h1>' +
      '<p class="muted" style="font-size:13px; margin-top:10px;">A los '+ state.ref.edad +' años, colgás el silbato. Así cierra tu paso por el arbitraje profesional.</p>' +
    '</div>' +
    resumenCarreraHtml(conf) +
    '<button class="btn btn-gold" onclick="reiniciarCarrera()">Iniciar una nueva carrera</button>';
}

function screenGameOver(){
  var conf = calcularConfianza();
  return topbar() +
    '<div class="panel center">' +
      '<div class="eyebrow">Desvinculado de la Federación</div>' +
      '<h1 class="section-title" style="font-size:24px; color:var(--red); margin-top:8px;">FIN DE LA CARRERA</h1>' +
      '<p class="muted" style="font-size:13px; margin-top:10px;">'+ state.lastSeasonResult.mensaje +'</p>' +
    '</div>' +
    resumenCarreraHtml(conf) +
    '<button class="btn btn-danger" onclick="reiniciarCarrera()">Empezar de nuevo</button>';
}

function resumenCarreraHtml(conf){
  return '<div class="stat-grid">' +
      '<div class="stat-box wide"><div class="v">'+ categoriaActual().nombre +'</div><div class="l">Categoría más alta alcanzada</div></div>' +
      '<div class="stat-box"><div class="v">'+ state.stats.partidos +'</div><div class="l">Partidos dirigidos</div></div>' +
      '<div class="stat-box gold"><div class="v">'+ (conf?conf.toFixed(1):"–") +'</div><div class="l">Valoración media histórica</div></div>' +
      '<div class="stat-box"><div class="v" style="color:var(--yellow);">'+ state.stats.amarillas +'</div><div class="l">Amarillas mostradas</div></div>' +
      '<div class="stat-box red"><div class="v">'+ state.stats.rojas +'</div><div class="l">Rojas mostradas</div></div>' +
      '<div class="stat-box wide gold"><div class="v">'+ fmtMoney(state.ingresos) +'</div><div class="l">Billetera final acumulada</div></div>' +
    '</div>';
}

window.reiniciarCarrera = function(){
  borrarGuardado();
  state = nuevoEstado();
  render();
};

/* =========================================================
   INICIO
   ========================================================= */

var saved = cargarGuardado();
if(saved && saved.ref && saved.ref.nombre && saved.screen !== "start"){
  state = saved;
  if(state.screen !== "shop" && state.screen !== "retirement" && state.screen !== "gameover" && state.screen !== "seasonSummary"){
    state.screen = "dashboard";
  }
} else {
  state = nuevoEstado();
}
render();

})();
</script>
</body>
</html>
