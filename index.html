<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Carrera Arbitral — Simulador de Árbitro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap');

:root{
  --bg:#0a0e13;
  --bg-grad:#0d1420;
  --panel:#131a23;
  --card:#181f2a;
  --card-hi:#1e2733;
  --border:#262f3b;
  --text:#e9eef3;
  --text-dim:#8b96a3;
  --text-faint:#5c6673;
  --green:#00e676;
  --green-deep:#00a856;
  --gold:#f0c419;
  --gold-deep:#c99e0e;
  --red:#ff4d5e;
  --yellow:#ffd400;
  --purple:#b388ff;
  --font-display:'Oswald', 'Arial Narrow', sans-serif;
  --font-body:'Inter', -apple-system, sans-serif;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html,body{
  margin:0; padding:0;
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(0,230,118,0.07), transparent 60%),
    linear-gradient(180deg, var(--bg-grad) 0%, var(--bg) 100%);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
}

#app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  padding:18px 16px 40px;
  position:relative;
}

/* ---------- Scrollbar / focus ---------- */
::-webkit-scrollbar{ width:8px; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
  outline:2px solid var(--green); outline-offset:2px;
}

/* ---------- Typography helpers ---------- */
h1,h2,h3{ font-family:var(--font-display); margin:0; letter-spacing:0.3px; }
.eyebrow{
  font-family:var(--font-body); font-weight:800; font-size:10.5px;
  letter-spacing:1.6px; text-transform:uppercase; color:var(--text-faint);
}
.muted{ color:var(--text-dim); }

/* ---------- Buttons ---------- */
.btn{
  display:block; width:100%; box-sizing:border-box;
  font-family:var(--font-display); font-size:18px; font-style:italic;
  text-align:center; text-transform:uppercase; letter-spacing:0.4px;
  padding:15px 14px; border-radius:12px; border:none; cursor:pointer;
  font-weight:600; margin-top:10px; transition:transform .08s ease, filter .15s ease, opacity .15s ease;
}
.btn:active{ transform:scale(0.97); }
.btn-primary{
  background:linear-gradient(180deg, var(--green) 0%, var(--green-deep) 100%);
  color:#04140b;
  box-shadow:0 6px 18px rgba(0,230,118,0.25);
}
.btn-primary:hover{ filter:brightness(1.06); }
.btn-gold{
  background:linear-gradient(180deg, var(--gold) 0%, var(--gold-deep) 100%);
  color:#221a02;
  box-shadow:0 6px 18px rgba(240,196,25,0.2);
}
.btn-purple{
  background:linear-gradient(180deg, #b388ff 0%, #7c4dff 100%);
  color:#0d051a;
  box-shadow:0 6px 18px rgba(179,136,255,0.25);
}
.btn-outline{
  background:transparent; color:var(--text); border:1.5px solid var(--border);
  box-shadow:none;
}
.btn-outline:hover{ border-color:var(--text-dim); }
.btn-danger{
  background:linear-gradient(180deg, #ff5b6b 0%, #d8283a 100%); color:#1a0508;
}
.btn:disabled{ opacity:0.4; cursor:not-allowed; }
.btn-small{ font-size:13px; padding:9px 10px; border-radius:9px; margin-top:8px; }

/* ---------- Cards / panels ---------- */
.panel{
  background:var(--panel); border:1px solid var(--border); border-radius:16px;
  padding:16px; margin-top:14px;
}
.card{
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  padding:14px; margin-top:12px;
}

/* ---------- Referee ID card ---------- */
.id-card{
  position:relative; overflow:hidden;
  border-radius:18px; padding:18px 16px 16px;
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 22px),
    linear-gradient(160deg, #111820 0%, #0c1117 100%);
  border:1px solid var(--border);
  box-shadow: inset 0 0 0 1px rgba(0,230,118,0.06), 0 10px 30px rgba(0,0,0,0.35);
}
.id-card::before{
  content:"FEDERACIÓN";
  position:absolute; right:-38px; top:22px; width:180px;
  transform:rotate(35deg); text-align:center;
  font-family:var(--font-display); font-size:13px; font-weight:700;
  letter-spacing:3px; color:rgba(240,196,25,0.10);
}
.id-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.id-serial{ font-family:'Courier New', monospace; font-size:10.5px; color:var(--text-faint); letter-spacing:1px; }
.id-badge{
  font-family:var(--font-body); font-weight:800; font-size:9.5px; letter-spacing:1px;
  text-transform:uppercase; color:#04140b; background:var(--green);
  padding:4px 9px; border-radius:20px; white-space:nowrap;
}
.id-main{ display:flex; align-items:center; gap:14px; margin-top:12px; }
.id-photo{
  width:58px; height:58px; border-radius:50%; flex:none;
  background:radial-gradient(circle at 35% 30%, #2a3542, #0e131a 75%);
  border:2px solid var(--gold);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-size:22px; color:var(--gold);
}
.id-name{ font-family:var(--font-display); font-size:21px; color:#fff; line-height:1.1; }
.id-sub{ font-size:11.5px; color:var(--text-dim); margin-top:3px; }
.id-ovr{
  margin-left:auto; text-align:center; flex:none;
}
.id-ovr .num{ font-family:var(--font-display); font-size:30px; color:var(--gold); line-height:1; }
.id-ovr .lbl{ font-size:9px; letter-spacing:1.5px; color:var(--text-faint); text-transform:uppercase; }
.id-stamp{
  margin-top:14px; padding-top:12px; border-top:1px dashed var(--border);
  display:flex; justify-content:space-between; font-size:11px; color:var(--text-dim);
}
.id-stamp b{ color:var(--text); }

/* ---------- Stat grid ---------- */
.stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:12px; }
.stat-box{
  background:var(--card); border:1px solid var(--border); border-radius:12px;
  padding:11px 12px; text-align:left;
}
.stat-box .v{ font-family:var(--font-display); font-size:19px; color:var(--green); font-weight:600; }
.stat-box .l{ font-size:9.5px; color:var(--text-faint); text-transform:uppercase; font-weight:800; letter-spacing:0.6px; margin-top:2px; }
.stat-box.gold .v{ color:var(--gold); }
.stat-box.red .v{ color:var(--red); }
.stat-box.purple .v{ color:var(--purple); }
.stat-box.wide{ grid-column:span 2; }

/* ---------- Meters ---------- */
.meter-row{ margin-top:10px; }
.meter-head{ display:flex; justify-content:space-between; font-size:11px; margin-bottom:5px; }
.meter-head b{ color:var(--text); font-weight:700; }
.meter-track{ height:8px; background:#0d131a; border-radius:6px; overflow:hidden; border:1px solid var(--border); }
.meter-fill{ height:100%; border-radius:6px; transition:width .4s ease; }

/* ---------- Match header ---------- */
.match-title{
  text-align:center; margin-top:6px;
}
.match-title .vs{
  font-family:var(--font-display); font-size:23px; font-style:italic; color:#fff; margin-top:4px;
}
.match-title .vs .sep{ color:var(--green); margin:0 8px; }
.minute-badge{
  display:inline-flex; align-items:center; gap:6px; margin-top:10px;
  background:#0d131a; border:1px solid var(--border); border-radius:20px;
  padding:6px 14px; font-family:var(--font-display); font-size:14px; color:var(--gold);
}

/* ---------- Event card ---------- */
.event-tag{
  display:inline-block; font-size:9.5px; font-weight:800; letter-spacing:1px;
  text-transform:uppercase; color:var(--bg); background:var(--gold);
  padding:3px 9px; border-radius:6px; margin-bottom:9px;
}
.event-text{ font-size:15.5px; line-height:1.5; color:var(--text); }
.option-btn{
  display:block; width:100%; text-align:left; background:var(--card-hi);
  border:1.5px solid var(--border); color:var(--text); border-radius:12px;
  padding:13px 14px; margin-top:10px; font-family:var(--font-body); font-size:14.5px;
  font-weight:600; cursor:pointer; position:relative; overflow:hidden;
  transition:border-color .18s ease, transform .12s cubic-bezier(0.2, 0, 0.2, 1), background .18s ease, box-shadow .18s ease;
  user-select:none; -webkit-tap-highlight-color:transparent;
}
.option-btn:hover{ border-color:var(--green); background:#1c2632; }
.option-btn:active{
  transform:scale(0.97) translateY(1px);
  background:#223040; border-color:var(--green);
  box-shadow:0 0 14px rgba(0,230,118,0.3);
}

/* Transiciones Fluidas entre Partido y Feedback */
.trans-event-container{
  animation: transEventIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes transEventIn{
  0%{ opacity:0; transform:translateY(14px) scale(0.985); }
  100%{ opacity:1; transform:translateY(0) scale(1); }
}

.trans-feedback-container{
  animation: transFeedbackIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes transFeedbackIn{
  0%{ opacity:0; transform:translateY(18px) scale(0.97); }
  60%{ opacity:1; transform:translateY(-2px) scale(1.006); }
  100%{ opacity:1; transform:translateY(0) scale(1); }
}

.verdict-banner-enter{
  animation: verdictBannerPop 0.42s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}
@keyframes verdictBannerPop{
  0%{ opacity:0; transform:scale(0.86) translateY(-10px); }
  100%{ opacity:1; transform:scale(1) translateY(0); }
}

.feedback-box-enter{
  animation: feedbackBoxSlide 0.38s cubic-bezier(0.16, 1, 0.3, 1) 0.06s both;
}
@keyframes feedbackBoxSlide{
  0%{ opacity:0; transform:translateY(12px); }
  100%{ opacity:1; transform:translateY(0); }
}

/* Bribe Hint on Option */
.bribe-hint-tag{
  display:inline-block; font-size:10px; font-weight:800; letter-spacing:0.5px;
  padding:2px 8px; border-radius:6px; margin-bottom:6px; text-transform:uppercase;
}
.bribe-hint-tag.pos{ background:rgba(0,230,118,0.18); color:var(--green); border:1px solid rgba(0,230,118,0.4); }
.bribe-hint-tag.neg{ background:rgba(255,77,94,0.18); color:var(--red); border:1px solid rgba(255,77,94,0.4); }
.bribe-hint-tag.neu{ background:rgba(139,150,163,0.15); color:var(--text-dim); border:1px solid var(--border); }

/* ---------- Feedback ---------- */
.feedback-box{
  border-radius:14px; padding:14px; margin-top:12px; border:1px solid var(--border);
  background:var(--card);
}
.feedback-box.pos{ border-color:rgba(0,230,118,0.35); background:rgba(0,230,118,0.06); }
.feedback-box.neg{ border-color:rgba(255,77,94,0.35); background:rgba(255,77,94,0.06); }
.feedback-box.bribe{ border-color:rgba(179,136,255,0.4); background:rgba(179,136,255,0.08); }
.feedback-title{ font-family:var(--font-display); font-size:14px; text-transform:uppercase; letter-spacing:0.5px; }
.feedback-title.pos{ color:var(--green); }
.feedback-title.neg{ color:var(--red); }
.feedback-title.bribe{ color:var(--purple); }
.delta-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
.delta-pill{
  font-size:11px; font-weight:700; padding:3px 8px; border-radius:20px;
  background:#0d131a; border:1px solid var(--border);
}
.delta-pill.up{ color:var(--green); border-color:rgba(0,230,118,0.3); }
.delta-pill.down{ color:var(--red); border-color:rgba(255,77,94,0.3); }
.delta-pill.purple{ color:var(--purple); border-color:rgba(179,136,255,0.4); }
.card-flag{
  display:inline-block; width:14px; height:19px; border-radius:2px; margin-right:6px; vertical-align:middle;
}
.card-flag.amarilla{ background:var(--yellow); }
.card-flag.roja{ background:var(--red); }

/* ---------- Simulación en vivo ---------- */
.live-panel{ position:relative; }
.live-dot{
  display:inline-block; width:7px; height:7px; border-radius:50%;
  background:var(--red); margin:0 3px 0 8px; vertical-align:middle;
  animation: liveDotPulse 1.1s ease-in-out infinite;
}
@keyframes liveDotPulse{
  0%,100%{ opacity:1; box-shadow:0 0 0 0 rgba(255,77,94,0.5); }
  50%{ opacity:0.5; box-shadow:0 0 0 5px rgba(255,77,94,0); }
}
.live-scoreboard{
  display:flex; align-items:center; justify-content:center; gap:12px;
  margin-top:12px;
}
.live-team{
  font-family:var(--font-display); font-size:14.5px; color:#fff; text-align:center; flex:1;
  text-transform:uppercase; letter-spacing:0.3px; line-height:1.2;
}
.live-score{
  font-family:var(--font-display); font-size:27px; color:var(--gold); letter-spacing:2px;
  background:#0d131a; border:1px solid var(--border); border-radius:10px; padding:4px 14px;
  flex:none;
}
.ticker-feed{
  max-height:280px; overflow-y:auto; scroll-behavior:smooth;
}
.ticker-item{
  display:flex; gap:9px; align-items:baseline; padding:7px 0; border-bottom:1px dashed var(--border);
  font-size:13px; color:var(--text-dim); animation: tickerIn 0.25s ease forwards;
}
.ticker-item:last-child{ border-bottom:none; }
.ticker-item.gol{ color:var(--green); font-weight:700; }
.ticker-min{
  font-family:var(--font-display); font-size:12px; color:var(--text-faint); flex:none; width:30px;
}
.ticker-txt{ flex:1; line-height:1.4; }
@keyframes tickerIn{ 0%{ opacity:0; transform:translateY(4px); } 100%{ opacity:1; transform:translateY(0); } }

/* ---------- Toggle de sonido ---------- */
.sound-toggle{
  background:transparent; border:1px solid var(--border); color:var(--text-dim);
  border-radius:8px; padding:4px 8px; font-size:13px; cursor:pointer; line-height:1;
}
.sound-toggle:active{ transform:scale(0.94); }

/* ---------- Escudos de Equipos (Vector Crests) ---------- */
.team-crest-box{
  display:inline-flex; align-items:center; justify-content:center;
  vertical-align:middle; filter:drop-shadow(0 2px 5px rgba(0,0,0,0.45));
}
.team-match-box{
  display:flex; flex-direction:column; align-items:center; gap:6px; flex:1;
}
.team-match-box .crest-wrap{
  transition:transform 0.2s ease;
}
.team-match-box:hover .crest-wrap{ transform:scale(1.06); }
.team-match-name{
  font-family:var(--font-display); font-size:13.5px; text-transform:uppercase;
  color:#fff; text-align:center; letter-spacing:0.4px; line-height:1.2;
}

/* ---------- Minijuego de tensión / autoridad ---------- */
.tension-card{ padding:18px 14px; text-align:center; }
.tension-track{
  position:relative; height:42px; border-radius:12px; overflow:hidden;
  background:#141a22;
  border:2px solid var(--border);
  box-shadow:inset 0 2px 6px rgba(0,0,0,0.6);
  margin-top:10px;
}
.tension-zone-danger-left{
  position:absolute; left:0; width:37.5%; top:0; bottom:0;
  background:linear-gradient(90deg, rgba(255,77,94,0.35), rgba(255,77,94,0.18));
}
.tension-zone-danger-right{
  position:absolute; right:0; width:37.5%; top:0; bottom:0;
  background:linear-gradient(90deg, rgba(255,77,94,0.18), rgba(255,77,94,0.35));
}
.tension-zone-green{
  position:absolute; left:37.5%; width:25%; top:0; bottom:0;
  background:rgba(0,230,118,0.32);
  border-left:2px solid var(--green); border-right:2px solid var(--green);
  box-shadow:0 0 16px rgba(0,230,118,0.35) inset;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-size:11px; font-weight:800;
  color:var(--green); letter-spacing:1px; text-shadow:0 0 4px rgba(0,0,0,0.8);
  user-select:none;
}
.tension-needle{
  position:absolute; top:-4px; bottom:-4px; width:6px; background:#fff;
  left:50%; transform:translateX(-50%); border-radius:3px;
  box-shadow:0 0 12px #fff, 0 0 4px #00e676;
  z-index:5; pointer-events:none;
  transition:none;
}
.tension-needle.hit{
  background:var(--green) !important;
  box-shadow:0 0 20px var(--green), 0 0 8px #fff !important;
  animation: needleHitPulse 0.4s ease infinite alternate;
}
.tension-needle.miss{
  background:var(--red) !important;
  box-shadow:0 0 20px var(--red), 0 0 8px #fff !important;
}
@keyframes needleHitPulse{
  0%{ transform:translateX(-50%) scaleY(1); }
  100%{ transform:translateX(-50%) scaleY(1.15); }
}
.tension-btn{ margin-top:16px; width:100%; font-size:15px; font-weight:700; }

/* ---------- Minijuego 1: Túnel y Revisión de Memoria ---------- */
.memory-grid{
  display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin-top:14px;
}
@media(max-width:380px){
  .memory-grid{ grid-template-columns:repeat(3, 1fr); gap:6px; }
}
.memory-card{
  aspect-ratio: 1/1;
  perspective: 600px;
  cursor:pointer; user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.memory-card-inner{
  position:relative; width:100%; height:100%;
  text-align:center; transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  transform-style: preserve-3d;
  border-radius:12px;
}
.memory-card.flipped .memory-card-inner,
.memory-card.matched .memory-card-inner{
  transform: rotateY(180deg);
}
.memory-card-front, .memory-card-back{
  position:absolute; width:100%; height:100%;
  -webkit-backface-visibility: hidden; backface-visibility: hidden;
  border-radius:12px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; padding:6px;
}
.memory-card-front{
  background:linear-gradient(145deg, #18222d, #0f161e);
  border:1.5px solid var(--border);
  color:var(--gold);
}
.memory-card-front:hover{ border-color:var(--green); }
.memory-card-back{
  background:linear-gradient(145deg, #1f2b38, #131c25);
  border:1.5px solid var(--gold);
  transform: rotateY(180deg);
}
.memory-card.matched .memory-card-back{
  border-color:var(--green);
  background:rgba(0,230,118,0.12);
  box-shadow:0 0 10px rgba(0,230,118,0.3);
}
.memory-icon{ font-size:24px; line-height:1; }
.memory-label{
  font-size:9.5px; font-weight:700; color:#fff;
  margin-top:4px; text-transform:uppercase; letter-spacing:0.3px;
  line-height:1.1; text-align:center;
}
.memory-stats-bar{
  display:flex; justify-content:space-between; align-items:center;
  background:#0d131a; border:1px solid var(--border); border-radius:10px;
  padding:8px 12px; margin-top:10px; font-size:12.5px;
}

/* ---------- Minijuego 2: Sorteo de Capitanes ---------- */
.sorteo-stage{
  background:radial-gradient(circle at 50% 30%, #172433, #0c1218 80%);
  border:1px solid var(--border); border-radius:16px; padding:18px 14px;
  margin-top:14px; text-align:center;
}
.sorteo-captains-row{
  display:flex; justify-content:space-around; align-items:flex-end;
  gap:12px; margin-top:8px;
}
.sorteo-captain-card{
  display:flex; flex-direction:column; align-items:center; flex:1;
  padding:10px 8px; border-radius:12px; background:rgba(0,0,0,0.25);
  border:1px solid var(--border); position:relative;
}
.sorteo-captain-card.winner{
  border-color:var(--green); background:rgba(0,230,118,0.1);
  box-shadow:0 0 14px rgba(0,230,118,0.25);
}
.captain-armband{
  position:absolute; top:6px; right:6px; background:var(--gold);
  color:#000; font-size:9px; font-weight:900; width:16px; height:16px;
  border-radius:50%; display:flex; align-items:center; justify-content:center;
}
.coin-box{
  width:72px; height:72px; margin:16px auto; position:relative; perspective:800px;
}
.coin-disc{
  width:100%; height:100%; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff7a1, #e5a700 70%, #996e00 100%);
  border:2.5px solid #fff;
  box-shadow:0 6px 16px rgba(0,0,0,0.6), 0 0 14px rgba(240,196,25,0.4);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-family:var(--font-display); font-size:20px; font-weight:900; color:#422a00;
  text-shadow:0 1px 1px rgba(255,255,255,0.6);
  user-select:none;
}
.coin-flipping{
  animation: coinFlip3D 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}
@keyframes coinFlip3D{
  0%{ transform: rotateY(0) scale(1) translateY(0); }
  25%{ transform: rotateY(720deg) scale(1.4) translateY(-35px); }
  50%{ transform: rotateY(1440deg) scale(1.6) translateY(-50px); }
  75%{ transform: rotateY(2160deg) scale(1.2) translateY(-20px); }
  100%{ transform: rotateY(2880deg) scale(1) translateY(0); }
}
.dialogue-balloon{
  background:#131c26; border:1px solid var(--border); border-radius:12px;
  padding:12px; margin-top:12px; font-size:13.5px; line-height:1.45; text-align:left;
  position:relative;
}
.dialogue-balloon::after{
  content:""; position:absolute; bottom:-7px; left:28px;

/* ---------- Speed / Pacing controls live match ---------- */

}
.speed-btn{

}

/* ---------- Misc ---------- */
.center{ text-align:center; }
.section-title{ font-family:var(--font-display); font-size:19px; color:#fff; margin-top:4px; }

.form-group{ margin-top:14px; }

.style-option{

.style-option .st-name{ font-family:var(--font-display); font-size:16px; color:#fff; }
.style-option .st-desc{ font-size:12.5px; color:var(--text-dim); margin-top:4px; line-height:1.4; }

.badge-cat{

}
.result-big{

}

.headline{ font-family:var(--font-display); font-size:15px; color:var(--text); line-height:1.5; margin-top:10px; }
.footer-note{ text-align:center; font-size:10.5px; color:var(--text-faint); margin-top:26px; letter-spacing:0.3px; }

.toprow{ display:flex; align-items:center; justify-content:space-between; }
.logo{ font-family:var(--font-display); font-size:15px; letter-spacing:1px; color:var(--text-dim); text-transform:uppercase; }
.logo b{ color:var(--green); }

/* ---------- Shop Styles ---------- */
.shop-cat-header{
  font-family:var(--font-display); font-size:16px; color:var(--gold); letter-spacing:0.8px;
  text-transform:uppercase; margin-top:18px; margin-bottom:8px; border-bottom:1px solid var(--border); padding-bottom:4px;
}
.shop-item{
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  padding:14px; margin-top:10px;
}
.shop-item.owned{
  border-color:rgba(0,230,118,0.4); background:rgba(0,230,118,0.04);
}
.shop-item-title{
  display:flex; justify-content:space-between; align-items:center;
}
.shop-item-name{ font-family:var(--font-display); font-size:17px; color:#fff; }
.shop-item-price{ font-family:var(--font-display); font-size:16px; color:var(--gold); font-weight:700; }
.shop-item-desc{ font-size:12.5px; color:var(--text-dim); margin-top:5px; line-height:1.4; }
.shop-item-perk{ font-size:11.5px; color:var(--green); font-weight:700; margin-top:6px; }
.tag-owned{
  display:inline-block; font-size:10px; font-weight:800; letter-spacing:0.6px;
  text-transform:uppercase; color:var(--green); background:rgba(0,230,118,0.12);

}
.inventory-list{
  display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;
}
.inventory-tag{

}

.id-photo{
  width:58px; height:58px; border-radius:50%; flex:none;
  background:#121820;
  border:2px solid var(--gold);

  display:flex; align-items:center; justify-content:center;
}
.id-photo svg{ width:100%; height:100%; display:block; }

.avatar-tabs{ display:flex; gap:8px; margin-top:12px; }
.avatar-tab-btn{
  flex:1; padding:9px 12px; border-radius:10px; font-family:var(--font-display);
  font-size:14px; background:var(--card); color:var(--text-dim); border:1px solid var(--border);
  cursor:pointer; text-transform:uppercase; text-align:center;
}
.avatar-tab-btn.active{
  background:rgba(0,230,118,0.12); color:var(--green); border-color:rgba(0,230,118,0.4); font-weight:700;
}

.avatar-grid{
  display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-top:12px;
}
.avatar-card{
  background:var(--card); border:1.5px solid var(--border); border-radius:14px;
  padding:10px 8px; text-align:center; cursor:pointer;
  transition:border-color .15s ease, background .15s ease, transform .08s ease;
}
.avatar-card:hover{ border-color:var(--text-dim); }
.avatar-card:active{ transform:scale(0.96); }
.avatar-card.selected{
  border-color:var(--green); background:rgba(0,230,118,0.08); box-shadow:0 0 0 1px var(--green);
}
.avatar-preview-box{
  width:64px; height:64px; border-radius:50%; margin:0 auto; overflow:hidden;
  border:2px solid var(--gold); background:#121820;
}
.avatar-name{ font-family:var(--font-display); font-size:13.5px; color:#fff; margin-top:6px; }
.avatar-desc{ font-size:9.5px; color:var(--text-faint); margin-top:2px; line-height:1.2; }

/* ---------- ANIMACIONES ARBITRALES MEJORADAS ---------- */
.anim-stage{
  position:relative; background:radial-gradient(circle at 50% 25%, #1f2c3d 0%, #0c1219 90%);
  border:1.5px solid var(--border); border-radius:14px; padding:16px 12px; margin-bottom:12px;
  overflow:hidden; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,0.45);
}
.anim-stage::before{
  content:""; position:absolute; inset:0;
  background:radial-gradient(circle at 50% -10%, rgba(0,230,118,0.14), transparent 70%);
  pointer-events:none;
}
.anim-stage::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(255,255,255,0.04) 0%, transparent 60%);
  pointer-events:none;
}
.anim-badge{
  display:inline-block; font-family:var(--font-display); font-size:13px; letter-spacing:1px;
  text-transform:uppercase; padding:5px 14px; border-radius:20px; font-weight:700; margin-top:10px;
  animation:animPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.anim-badge.amarilla{ background:var(--yellow); color:#121820; box-shadow:0 0 20px rgba(255,212,0,0.6); }
.anim-badge.roja{ background:var(--red); color:#fff; box-shadow:0 0 20px rgba(255,77,94,0.7); }
.anim-badge.var{ background:#00d2ff; color:#04141e; box-shadow:0 0 20px rgba(0,210,255,0.6); }
.anim-badge.penal{ background:var(--gold); color:#121820; box-shadow:0 0 18px rgba(240,196,25,0.6); }
.anim-badge.siga{ background:var(--green); color:#04140b; box-shadow:0 0 18px rgba(0,230,118,0.5); }
.anim-badge.calma{ background:#9c27b0; color:#fff; box-shadow:0 0 18px rgba(156,39,176,0.5); }
.anim-badge.silbato{ background:var(--gold); color:#121820; box-shadow:0 0 16px rgba(240,196,25,0.4); }

@keyframes animPop{ 0%{ transform:scale(0.5) translateY(8px); opacity:0; } 70%{ transform:scale(1.08) translateY(-2px); } 100%{ transform:scale(1) translateY(0); opacity:1; } }

/* Tarjeta subiendo con inercia elástica */
.anim-arm-raise{
  transform-origin: bottom center;
  animation: armUp 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}
@keyframes armUp{
  0%{ transform: translateY(45px) scale(0.8); opacity:0; }
  65%{ transform: translateY(-6px) scale(1.04); opacity:1; }
  100%{ transform: translateY(0) scale(1); opacity:1; }
}

.anim-card-glow{
  animation: cardFlash 1.4s infinite alternate ease-in-out;
}
@keyframes cardFlash{
  0%{ filter: drop-shadow(0 0 6px rgba(255,255,255,0.5)); }
  50%{ filter: drop-shadow(0 0 14px currentColor) brightness(1.1); }
  100%{ filter: drop-shadow(0 0 22px currentColor) brightness(1.2); }
}

.anim-shine-sweep{
  animation: shineSweep 2s infinite ease-in-out;
}
@keyframes shineSweep{
  0%{ transform: translateX(-40px) skewX(-20deg); opacity:0; }
  30%{ opacity:0.8; }
  60%{ transform: translateX(50px) skewX(-20deg); opacity:0; }
  100%{ transform: translateX(50px) skewX(-20deg); opacity:0; }
}

/* VAR Dibujando pantalla */
.anim-var-screen{
  stroke-dasharray: 260;
  stroke-dashoffset: 260;
  animation: drawRect 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}
@keyframes drawRect{
  0%{ stroke-dashoffset: 260; opacity:0; }
  50%{ opacity:1; }
  100%{ stroke-dashoffset: 0; opacity:1; }
}

.anim-var-scanline{
  animation: scanMove 1.4s infinite linear;
}
@keyframes scanMove{
  0%{ transform: translateY(-4px); opacity:0.8; }
  50%{ opacity:1; filter: drop-shadow(0 0 6px #00ffff); }
  100%{ transform: translateY(36px); opacity:0.1; }
}

/* Gesto Siga-Siga con inercia fluida */
.anim-wave-left{
  transform-origin: 30px 60px;
  animation: waveArmL 1.1s infinite alternate ease-in-out;
}
@keyframes waveArmL{
  0%{ transform: rotate(-10deg) translateX(-3px); }
  100%{ transform: rotate(20deg) translateX(6px); }
}
.anim-wave-right{
  transform-origin: 70px 60px;
  animation: waveArmR 1.1s infinite alternate ease-in-out;
}
@keyframes waveArmR{
  0%{ transform: rotate(10deg) translateX(3px); }
  100%{ transform: rotate(-20deg) translateX(-6px); }
}

/* Gesto Señalar Penal con pulso de radar */
.anim-point-penal{
  transform-origin: 20px 70px;
  animation: pointPenal 0.9s cubic-bezier(0.25, 1, 0.3, 1.2) infinite alternate;
}
@keyframes pointPenal{
  0%{ transform: rotate(-10deg) scale(0.96); }
  100%{ transform: rotate(10deg) scale(1.06); }
}

.anim-radar-ping{
  animation: radarPing 1.2s infinite ease-out;
}
@keyframes radarPing{
  0%{ transform: scale(0.5); opacity:1; }
  100%{ transform: scale(2.2); opacity:0; }
}

/* Ondas del Silbato */
.anim-whistle-ring{
  transform-origin: 65px 45px;
  animation: whistlePulse 1.1s infinite ease-out;
}
@keyframes whistlePulse{
  0%{ transform: scale(0.5); opacity:1; stroke-width:3.5; }
  100%{ transform: scale(2.4); opacity:0; stroke-width:0.4; }
}

/* Cartel electrónico de descuento */
.anim-board-glow{
  animation: boardPulse 1.2s infinite alternate ease-in-out;
}
@keyframes boardPulse{
  0%{ filter: drop-shadow(0 0 6px #00e676); transform: scale(0.99); }
  100%{ filter: drop-shadow(0 0 18px #00e676); transform: scale(1.02); }
}

/* ---------- ANIMACIONES DE SITUACIONES DE JUEGO (EN CANCHA) ---------- */
.play-stage{
  position:relative; background:radial-gradient(ellipse at 50% 35%, #183323 0%, #0d1a12 70%, #070d09 100%);
  border:1.5px solid rgba(0,230,118,0.28); border-radius:14px; padding:14px 10px; margin-bottom:12px;
  overflow:hidden; text-align:center; box-shadow:inset 0 0 32px rgba(0,0,0,0.65), 0 6px 20px rgba(0,0,0,0.4);
}
.play-stage::before{
  content:""; position:absolute; inset:0;
  background:radial-gradient(ellipse at 50% 0%, rgba(0,230,118,0.15) 0%, transparent 65%);
  pointer-events:none;
}
.play-stage::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(255,255,255,0.04) 0%, transparent 55%);
  pointer-events:none;
}
.play-badge{
  display:inline-block; font-family:var(--font-display); font-size:12px; letter-spacing:1px;
  text-transform:uppercase; padding:4px 12px; border-radius:18px; font-weight:700;
  background:rgba(0,230,118,0.18); color:var(--green); border:1px solid rgba(0,230,118,0.4);
  margin-top:8px; box-shadow:0 0 12px rgba(0,230,118,0.25);
}

.anim-tackle-slide{
  animation: tackleSlide 1.7s infinite cubic-bezier(0.45, 0.05, 0.55, 0.95);
}
@keyframes tackleSlide{
  0%{ transform: translateX(-26px) rotate(6deg); }
  45%{ transform: translateX(8px) rotate(-14deg); }
  75%{ transform: translateX(6px) rotate(-10deg); }
  100%{ transform: translateX(-26px) rotate(6deg); }
}

.anim-grass-burst{
  animation: grassBurst 1.7s infinite ease-out;
}
@keyframes grassBurst{
  0%, 40%{ transform: scale(0); opacity:0; }
  50%{ transform: scale(1.2) translateY(-6px); opacity:1; }
  80%{ transform: scale(1) translateY(4px); opacity:0; }
  100%{ transform: scale(0); opacity:0; }
}

.anim-ball-bounce{
  animation: ballBounce 1.4s infinite cubic-bezier(0.28, 0.84, 0.42, 1);
}
@keyframes ballBounce{
  0%, 100%{ transform: translateY(0) rotate(0deg); }
  50%{ transform: translateY(-18px) rotate(180deg); }
}

.anim-dive-fall{
  animation: diveFall 1.8s infinite ease-in-out;
}
@keyframes diveFall{
  0%{ transform: translate(0, 0) rotate(0deg); }
  35%{ transform: translate(16px, -12px) rotate(-28deg); }
  70%{ transform: translate(24px, 8px) rotate(38deg); }
  100%{ transform: translate(0, 0) rotate(0deg); }
}

.anim-brawl-push{
  animation: brawlPush 1.1s infinite alternate ease-in-out;
}
@keyframes brawlPush{
  0%{ transform: translateX(-5px) scale(0.98); }
  50%{ transform: translateX(6px) scale(1.02); }
  100%{ transform: translateX(-5px) scale(0.98); }
}

.anim-dt-rage{
  animation: dtRage 0.75s infinite alternate ease-in-out;
}
@keyframes dtRage{
  0%{ transform: rotate(-7deg) translateY(0); }
  100%{ transform: rotate(10deg) translateY(-5px); }
}

.anim-line-scan{
  animation: lineScan 1.5s infinite linear;
}
@keyframes lineScan{
  0%{ stroke-dashoffset: 80; opacity:0.3; }
  50%{ opacity:1; filter:drop-shadow(0 0 6px #00e676); }
  100%{ stroke-dashoffset: 0; opacity:0.3; }
}

.anim-smoke-float{
  animation: smokeFloat 2.2s infinite ease-in-out alternate;
}
@keyframes smokeFloat{
  0%{ transform: translateY(0) scale(1); opacity:0.5; }
  50%{ transform: translateY(-8px) scale(1.08); opacity:0.85; }
  100%{ transform: translateY(-14px) scale(1.15); opacity:0.4; }
}

.anim-light-sweep{
  animation: lightSweep 2.5s infinite alternate ease-in-out;
}
@keyframes lightSweep{
  0%{ transform: rotate(-25deg); opacity:0.4; }
  50%{ opacity:0.85; }
  100%{ transform: rotate(25deg); opacity:0.4; }
}

.anim-flag-wave{
  transform-origin: 0 0;
  animation: flagWave 0.8s infinite alternate ease-in-out;
}
@keyframes flagWave{
  0%{ transform: skewY(-8deg) scaleX(0.95); }
  100%{ transform: skewY(12deg) scaleX(1.05); }
}

/* Badge de Acierto / Error */

.press-opt-btn{
  width: 100%;
  display: block;
  text-align: left;
  background: var(--card-hi);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 13px 14px;
  margin-top: 10px;
  cursor: pointer;
  color: var(--text);
  position: relative;
  overflow: hidden;
  transition: border-color .18s ease, transform .12s cubic-bezier(0.2, 0, 0.2, 1), background .18s ease, box-shadow .18s ease;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.press-opt-btn:hover{
  border-color: var(--green);
  background: #1f2c3b;
}
.press-opt-btn:active{
  transform: scale(0.975) translateY(1px);
  background: #243547;
  border-color: var(--green);
  box-shadow: 0 0 14px rgba(0,230,118,0.25);
}

.press-style-badge{
  display: inline-block;
  font-size: 11px;
  font-family: var(--font-display);
  font-weight: 800;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 6px;
  margin-bottom: 6px;
}
.press-style-badge.autocritico{ background: rgba(186,104,200,0.18); color: #ce93d8; border: 1px solid rgba(186,104,200,0.4); }
.press-style-badge.firme{ background: rgba(0,230,118,0.18); color: var(--green); border: 1px solid rgba(0,230,118,0.4); }
.press-style-badge.relajado{ background: rgba(240,196,25,0.18); color: var(--gold); border: 1px solid rgba(240,196,25,0.4); }
.press-style-badge.prudente{ background: rgba(0,210,255,0.18); color: #00d2ff; border: 1px solid rgba(0,210,255,0.4); }
.press-style-badge.nervioso{ background: rgba(255,77,94,0.18); color: var(--red); border: 1px solid rgba(255,77,94,0.4); }

.press-opt-text{
  font-size: 14.5px;
  line-height: 1.45;
  color: #e6ebf2;
}

/* Tarjeta de impacto post-respuesta */
.press-feedback-box{
  background: rgba(15, 23, 33, 0.95);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  margin-top: 12px;
}
.press-news-headline{
  font-family: var(--font-display);
  font-size: 15px;
  color: var(--gold);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  border-bottom: 1px solid rgba(240,196,25,0.25);
  padding-bottom: 6px;
}

/* =========================================================
   ESTILOS: MENÚ PRINCIPAL DE MODOS DE JUEGO
   ========================================================= */
.mode-card{
  background: radial-gradient(circle at 85% 20%, rgba(0,230,118,0.06), transparent 70%), var(--card);
  border: 1.5px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  margin-top: 14px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.mode-card:hover{
  border-color: var(--green);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,230,118,0.15);
}
.mode-card.president-mode{
  background: radial-gradient(circle at 85% 20%, rgba(240,196,25,0.07), transparent 70%), var(--card);
}
.mode-card.president-mode:hover{
  border-color: var(--gold);
  box-shadow: 0 8px 24px rgba(240,196,25,0.18);
}
.mode-header-row{
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.mode-badge-tag{
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  padding: 3px 9px;
  border-radius: 6px;
}
.mode-badge-tag.ref{ background: rgba(0,230,118,0.15); color: var(--green); border: 1px solid rgba(0,230,118,0.4); }
.mode-badge-tag.pres{ background: rgba(240,196,25,0.15); color: var(--gold); border: 1px solid rgba(240,196,25,0.4); }
.mode-title{
  font-family: var(--font-display);
  font-size: 20px;
  color: #fff;
  margin-top: 8px;
  letter-spacing: 0.3px;
}
.mode-desc{
  font-size: 12.5px;
  color: var(--text-dim);
  margin-top: 6px;
  line-height: 1.45;
}
.mode-features-list{
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}
.mode-feat-pill{
  font-size: 10.5px;
  background: #0d131a;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 2px 7px;
  color: var(--text-dim);
}

/* =========================================================
   ESTILOS: TICKER EN VIVO REFINADO & CRONOLOGÍA
   ========================================================= */
.live-active-stage{
  background: #0c1218;
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 12px;
  margin-top: 12px;
  min-height: 160px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: 8px;
  overflow: hidden;
  position: relative;
}
.live-active-stage::before{
  content: "CANCHA EN VIVO";
  position: absolute;
  top: 8px;
  right: 12px;
  font-family: var(--font-display);
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: 1.2px;
  color: var(--text-faint);
}
.active-play-item{
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  display: flex;
  gap: 10px;
  align-items: baseline;
  transition: opacity 0.25s ease, transform 0.25s ease, border-color 0.25s ease;
}
.active-play-item.current{
  border-color: rgba(0,230,118,0.4);
  background: rgba(0,230,118,0.06);
  box-shadow: 0 0 12px rgba(0,230,118,0.15);
}
.active-play-item.gol{
  border-color: rgba(240,196,25,0.6);
  background: rgba(240,196,25,0.1);
  box-shadow: 0 0 16px rgba(240,196,25,0.25);
}
.active-play-item.old{
  opacity: 0.55;
  transform: scale(0.98);
}

/* Timer para revisión técnica de indumentaria */
.tunnel-timer-container{
  background: #0d131a;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.tunnel-timer-top{
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.tunnel-timer-label{
  font-size: 12px;
  font-weight: 700;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.tunnel-timer-val{
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 800;
  color: var(--green);
  letter-spacing: 1px;
}
.tunnel-timer-bar-wrap{
  width: 100%;
  height: 8px;
  background: rgba(255,255,255,0.08);
  border-radius: 4px;
  overflow: hidden;
}
.tunnel-timer-bar{
  height: 100%;
  width: 100%;
  background: var(--green);
  transition: width 0.3s linear, background 0.3s ease;
}

/* Vitrina de Logros en Modo Dirigente */
.pres-achievement-grid{
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  margin-top: 12px;
}
@media(min-width: 580px){
  .pres-achievement-grid{ grid-template-columns: repeat(2, 1fr); }
}
.pres-achievement-card{
  background: #0d131a;
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  gap: 12px;
  align-items: flex-start;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
  position: relative;
  overflow: hidden;
}
.pres-achievement-card.unlocked{
  border-color: rgba(240,196,25,0.5);
  background: linear-gradient(145deg, rgba(240,196,25,0.06), #0d131a);
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
}
.pres-achievement-card.locked{
  opacity: 0.65;
}
.pres-achievement-icon{
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex: none;
  background: #141c26;
  border: 1.5px solid var(--border);
}
.pres-achievement-card.unlocked .pres-achievement-icon{
  border-color: var(--gold);
  background: rgba(240,196,25,0.12);
  box-shadow: 0 0 10px rgba(240,196,25,0.25);
}
.pres-achievement-body{
  flex: 1;
  min-width: 0;
}
.pres-achievement-title{
  font-family: var(--font-display);
  font-size: 14.5px;
  font-weight: 700;
  color: #fff;
  line-height: 1.2;
}
.pres-achievement-desc{
  font-size: 12px;
  color: var(--text-dim);
  margin-top: 3px;
  line-height: 1.35;
}
.pres-achievement-progress-wrap{
  margin-top: 8px;
}
.pres-achievement-progress-head{
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  color: var(--text-faint);
  font-weight: 600;
}
.pres-achievement-progress-track{
  width: 100%;
  height: 5px;
  background: rgba(255,255,255,0.08);
  border-radius: 3px;
  overflow: hidden;
  margin-top: 3px;
}
.pres-achievement-progress-fill{
  height: 100%;
  background: var(--gold);
  border-radius: 3px;
}
.pres-achievement-badge{
  display: inline-block;
  padding: 3px 7px;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.pres-achievement-badge.unlocked{
  background: rgba(240,196,25,0.15);
  color: var(--gold);
  border: 1px solid var(--gold);
}
.pres-achievement-badge.locked{
  background: rgba(255,255,255,0.05);
  color: var(--text-faint);
  border: 1px solid var(--border);
}

/* Timeline completo de fin de partido */
.match-timeline-accordion{
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px;
  margin-top: 14px;
}
.timeline-scroll-feed{
  max-height: 280px;
  overflow-y: auto;
  margin-top: 10px;
  padding-right: 4px;
}
.timeline-event-row{
  display: flex;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px dashed var(--border);
  font-size: 12.5px;
  align-items: baseline;
}
.timeline-event-row:last-child{ border-bottom: none; }
.timeline-event-min{
  font-family: var(--font-display);
  font-size: 12px;
  color: var(--gold);
  width: 32px;
  flex: none;
  font-weight: 700;
}
.timeline-event-txt{
  flex: 1;
  color: var(--text);
  line-height: 1.4;
}

/* =========================================================
   ESTILOS: MODO PRESIDENTE DE LA ASOCIACIÓN (DARK LUXURY GOLD)
   ========================================================= */
.pres-office-panel{
  background: radial-gradient(circle at 50% 10%, #172333 0%, #0a0f16 90%);
  border: 1.5px solid rgba(240,196,25,0.3);
  border-radius: 16px;
  padding: 16px;
  margin-top: 14px;
  box-shadow: 0 8px 28px rgba(0,0,0,0.45);
}
.pres-stats-grid{
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 12px;
}
@media(min-width: 500px){
  .pres-stats-grid{ grid-template-columns: repeat(4, 1fr); }
}
.pres-stat-card{
  background: #0d131a;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 12px;
  transition: transform 0.15s ease, border-color 0.15s ease;
}
.pres-stat-card:hover{
  border-color: rgba(240,196,25,0.4);
}
.pres-stat-card .v{
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 800;
  color: #fff;
  line-height: 1.1;
}
.pres-stat-card .l{
  font-size: 9.5px;
  color: var(--text-faint);
  text-transform: uppercase;
  font-weight: 800;
  letter-spacing: 0.6px;
  margin-top: 4px;
}

/* Pestañas de Navegación del Despacho */
.pres-nav-tabs{
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 4px 2px 8px 2px;
  margin-top: 12px;
  scrollbar-width: none;
}
.pres-nav-tabs::-webkit-scrollbar{ display: none; }
.pres-nav-tab{
  flex: none;
  background: #0d131a;
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 10px;
  padding: 8px 13px;
  font-family: var(--font-display);
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
}
.pres-nav-tab:hover{
  border-color: var(--gold);
  color: #fff;
}
.pres-nav-tab.active{
  background: rgba(240,196,25,0.15);
  border-color: var(--gold);
  color: var(--gold);
  box-shadow: 0 0 12px rgba(240,196,25,0.2);
}

/* Roster de Árbitros en Presidencia */
.ref-roster-grid{
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  margin-top: 12px;
}
.ref-roster-card{
  background: #0e151e;
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 12px 14px;
  transition: border-color 0.16s ease, transform 0.16s ease;
}
.ref-roster-card:hover{
  border-color: rgba(0,230,118,0.35);
}
.ref-roster-card.tired{
  border-color: rgba(255,212,0,0.5);
  background: rgba(255,212,0,0.03);
}
.ref-roster-card.exhausted{
  border-color: rgba(255,77,94,0.6);
  background: rgba(255,77,94,0.05);
}
.ref-roster-card.international{
  border-color: rgba(64,196,255,0.6);
  background: rgba(64,196,255,0.04);
}
.ref-roster-head{
  display: flex;
  align-items: center;
  gap: 12px;
}
.ref-roster-avatar{
  width: 46px;
  height: 46px;
  border-radius: 50%;
  overflow: hidden;
  border: 2px solid var(--gold);
  flex: none;
  background: #141c26;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ref-roster-info{ flex: 1; min-width: 0; }
.ref-roster-name{
  font-family: var(--font-display);
  font-size: 15.5px;
  color: #fff;
  font-weight: 700;
  line-height: 1.15;
}
.ref-roster-sub{
  font-size: 11.5px;
  color: var(--gold);
  font-weight: 600;
  margin-top: 2px;
}
.ref-attr-row{
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 10px;
}
.ref-attr-pill{
  font-size: 10.5px;
  background: #080c11;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 3px 8px;
  color: var(--text-dim);
}
.ref-attr-pill b{ color: #fff; }
.ref-energy-track{
  height: 8px;
  background: #080d12;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid var(--border);
  margin-top: 9px;
}
.ref-energy-fill{
  height: 100%;
  border-radius: 6px;
  transition: width 0.3s ease;
}
.ref-energy-fill.high{ background: linear-gradient(90deg, #00c853, #00e676); }
.ref-energy-fill.med{ background: linear-gradient(90deg, #ffd600, #ffab00); }
.ref-energy-fill.low{ background: linear-gradient(90deg, #d50000, #ff1744); }
.ref-energy-status{
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 4px;
  font-weight: 600;
}

/* Fixture y Asignaciones Multi-División */
.division-filter-bar{
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 2px 2px 8px 2px;
  margin-top: 10px;
}
.div-btn{
  flex: 1;
  min-width: 95px;
  background: #0d131a;
  border: 1.5px solid var(--border);
  color: var(--text-dim);
  border-radius: 10px;
  padding: 7px 10px;
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  cursor: pointer;
  text-align: center;
  transition: all 0.15s ease;
}
.div-btn:hover{ border-color: var(--gold); color: #fff; }
.div-btn.active{
  background: rgba(240,196,25,0.15);
  border-color: var(--gold);
  color: var(--gold);
}

.match-assign-grid{
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  margin-top: 12px;
}
.match-assign-card{
  background: #0e151e;
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 13px 14px;
  transition: border-color 0.16s ease;
}
.match-assign-card.high-tension{
  border-color: rgba(255,77,94,0.45);
  background: radial-gradient(circle at top right, rgba(255,77,94,0.06), #0e151e 70%);
}
.match-assign-header{
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}
.match-tension-badge{
  font-family: var(--font-display);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 3px;
}
.match-teams-title{
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  line-height: 1.2;
}
.ref-select-box{
  width: 100%;
  background: #080c11;
  border: 1.5px solid var(--border);
  color: #fff;
  padding: 10px 12px;
  border-radius: 10px;
  font-family: var(--font-body);
  font-size: 13.5px;
  font-weight: 600;
  margin-top: 8px;
  cursor: pointer;
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.ref-select-box:focus{
  border-color: var(--gold);
  box-shadow: 0 0 10px rgba(240,196,25,0.25);
}
.ref-select-box option{
  background: #0e151e;
  color: #fff;
  padding: 8px;
}

/* Eventos de Corrupción, Polémicas y Declaraciones */
.corrupt-event-box{
  background: radial-gradient(circle at 50% 15%, #2a1f33 0%, #0d0a14 90%);
  border: 1.5px solid rgba(179,136,255,0.45);
  border-radius: 16px;
  padding: 16px;
  margin-top: 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.corrupt-caller-badge{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(179,136,255,0.2);

  border: 1px solid rgba(179,136,255,0.45);
  padding: 4px 10px;
  border-radius: 20px;
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.8px;

.corrupt-title{

  color: #e0e6ed;

.bribe-choice-btn{

.bribe-choice-btn:hover{
  border-color: var(--purple);
  background: #1a2230;
  transform: translateY(-1px);

/* Comisión Asesora / Consejo Consultivo */
.advisor-card{
  background: #0e151e;
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 13px 14px;
  margin-top: 10px;
}
.advisor-head{
  display: flex;
  align-items: center;
  gap: 10px;
}
.advisor-avatar{
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #182230;
  border: 2px solid var(--gold);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex: none;
}
.advisor-name{
  font-family: var(--font-display);
  font-size: 15px;
  color: #fff;
  font-weight: 700;
}
.advisor-role{
  font-size: 11px;
  color: var(--text-faint);
  text-transform: uppercase;
  font-weight: 700;
}
.advisor-quote{
  background: #080c11;
  border-radius: 8px;
  padding: 9px 12px;

  border-left: 2px solid var(--gold);
}

/* Sponsors de Árbitros */
.sponsor-slot-card{

function hashString(str){
  var hash = 0;
  for(var i=0; i<str.length; i++){
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}

function getTeamCrestConfig(name){
  if(CLUB_CRESTS[name]) return CLUB_CRESTS[name];
  // Deterministic generator if not in list
  var h = hashString(name);
  var palette = [
    { p:"#002b7f", s:"#fdb913", border:"#fff", pattern:"stripes" },
    { p:"#e30613", s:"#ffffff", border:"#111", pattern:"sash" },
    { p:"#007a3d", s:"#ffffff", border:"#fff", pattern:"solid" },
    { p:"#5bc2e7", s:"#ffffff", border:"#003366", pattern:"stripes" },
    { p:"#000000", s:"#e30613", border:"#fff", pattern:"halves" },
    { p:"#7a0026", s:"#ffffff", border:"#fff", pattern:"solid" },
    { p:"#002855", s:"#c8102e", border:"#fff", pattern:"band" }
  ];
  var chosen = palette[h % palette.length];
  var initials = name.replace(/[^A-Za-z0-9]/g, "").substring(0,3).toUpperCase();
  return {
    p: chosen.p, s: chosen.s, border: chosen.border,
    pattern: chosen.pattern, text: initials, textColor: chosen.s === "#ffffff" ? "#ffffff" : chosen.p
  };
}

      '</g>';
  } else if(cfg.pattern === "globo"){
    svgInner =
      '<path d="'+shieldD+'" fill="'+cfg.p+'"/>' +

  { id:"bengalas_humo", tag:"Seguridad y Visibilidad", playAnim:"bengalas_humo",

  { id:"corte_luz_estadio", tag:"Falla de Infraestructura", playAnim:"corte_luz_estadio",

  { id:"invasion_cancha_hincha", tag:"Incidencia e Intrusos", playAnim:"invasion_cancha",

  { id:"perro_en_cancha", tag:"Situación Insólita", playAnim:"perro_cancha",

  { id:"offside_interferencia_vision", tag:"Fuera de Juego / IFAB", playAnim:"offside_interferencia",

function generarPrensa(){
  var ultimaNota = state.carreraNotas.length ? state.carreraNotas[state.carreraNotas.length-1] : null;
  var tono;
  if(ultimaNota!==null && ultimaNota<4.5) tono = "neg";
  else if(ultimaNota!==null && ultimaNota>=8) tono = "pos";
  else if(state.fama>=65) tono = "pos";
  else if(state.fama<=35) tono = "neg";
  else tono = "neu";

  var texto = pick(TITULARES[tono]).replace("{nombre}", state.ref.nombre);
  var famaDelta = tono==="pos" ? 1 : (tono==="neg" ? -1 : 0);
  state.fama = clamp(state.fama + famaDelta, 0, 100);
  return { tono:tono, texto:texto };
}

function triggerHaptic(type){
  if(typeof navigator !== "undefined" && navigator.vibrate){
    try {
      if(type === "success"){
        navigator.vibrate([16, 28, 18]);
      } else if(type === "error"){
        navigator.vibrate([28, 40, 28]);
      } else if(type === "decision"){
        navigator.vibrate([18, 22, 18]);
      } else {
        navigator.vibrate(14);
      }
    } catch(e){}
  }
}

function getAudioCtx(){

  }
  if(audioCtx && audioCtx.state === "suspended"){

  }
  return audioCtx;
}

function generarBufferRuido(ctx, segundos){
  var bufferSize = Math.floor(ctx.sampleRate * segundos);
  var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  var data = buffer.getChannelData(0);
  var b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
  for(var i=0;i<bufferSize;i++){
    var white = Math.random()*2-1;
    b0 = 0.99886*b0 + white*0.0555179;
    b1 = 0.99332*b1 + white*0.0750759;
    b2 = 0.96900*b2 + white*0.1538520;
    b3 = 0.86650*b3 + white*0.3104856;
    b4 = 0.55000*b4 + white*0.5329522;
    b5 = -0.7616*b5 - white*0.0168980;
    var pink = b0+b1+b2+b3+b4+b5+b6+white*0.5362;
    b6 = white*0.115926;
    data[i] = pink * 0.11;
  }
  return buffer;
}

function sfxWhistle(){
  if(!sfxEnabled) return;
  var ctx = getAudioCtx(); if(!ctx) return;
  var t = ctx.currentTime;
  var osc = ctx.createOscillator();
  var gain = ctx.createGain();
  osc.type = "square";
  osc.frequency.setValueAtTime(2150, t);
  osc.frequency.linearRampToValueAtTime(2500, t+0.05);
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(0.10, t+0.02);
  gain.gain.linearRampToValueAtTime(0.10, t+0.15);
  gain.gain.linearRampToValueAtTime(0, t+0.24);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t); osc.stop(t+0.26);
}
function sfxCoinFlip(){
  if(!sfxEnabled) return;
  var ctx = getAudioCtx(); if(!ctx) return;
  var t = ctx.currentTime;
  // Sonido de giro y tintineo metálico de moneda al aire
  [1800, 2400, 3100, 4200, 2600].forEach(function(freq, i){
    var osc = ctx.createOscillator(); var gain = ctx.createGain();
    osc.type = "sine";
    var t0 = t + i * 0.08;
    osc.frequency.setValueAtTime(freq, t0);
    osc.frequency.exponentialRampToValueAtTime(freq*1.2, t0 + 0.09);
    gain.gain.setValueAtTime(0.045, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.12);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + 0.13);
  });
}

  sfxWhistle();
  setTimeout(sfxWhistle, 200);
  setTimeout(sfxWhistle, 400);
}
function sfxTarjeta(){
  if(!sfxEnabled) return;
  var ctx = getAudioCtx(); if(!ctx) return;
  var t = ctx.currentTime;
  var osc = ctx.createOscillator(); var gain = ctx.createGain();
  osc.type = "sawtooth";
  osc.frequency.setValueAtTime(170, t);
  osc.frequency.exponentialRampToValueAtTime(55, t+0.18);
  gain.gain.setValueAtTime(0.08, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t+0.2);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t); osc.stop(t+0.22);
}
function sfxCantico(intensidad){
  if(!sfxEnabled) return;
  var ctx = getAudioCtx(); if(!ctx) return;
  var buffer = generarBufferRuido(ctx, 1.3);
  var source = ctx.createBufferSource();
  source.buffer = buffer;
  var filtro = ctx.createBiquadFilter();
  filtro.type = "bandpass"; filtro.frequency.value = 480; filtro.Q.value = 0.7;
  var gain = ctx.createGain();
  var t = ctx.currentTime;
  var pico = (intensidad||1) * 0.07;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(pico, t+0.3);
  gain.gain.linearRampToValueAtTime(0, t+1.3);
  source.connect(filtro); filtro.connect(gain); gain.connect(ctx.destination);
  source.start(t); source.stop(t+1.3);
}
function sfxGol(){
  if(!sfxEnabled) return;
  sfxCantico(1.4);
  var ctx = getAudioCtx(); if(!ctx) return;
  var t = ctx.currentTime;
  [440,554,659].forEach(function(freq, idx){
    var osc = ctx.createOscillator(); var gain = ctx.createGain();
    osc.type = "triangle"; osc.frequency.value = freq;
    var t0 = t + idx*0.09;
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(0.045, t0+0.03);
    gain.gain.linearRampToValueAtTime(0, t0+0.25);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t0); osc.stop(t0+0.3);
  });
}
function iniciarAmbienteMultitud(){
  if(!sfxEnabled) return;
  var ctx = getAudioCtx(); if(!ctx) return;
  detenerAmbienteMultitud();
  try {
    var buffer = generarBufferRuido(ctx, 4);
    var source = ctx.createBufferSource();
    source.buffer = buffer; source.loop = true;
    var filtro = ctx.createBiquadFilter();
    filtro.type = "lowpass"; filtro.frequency.value = 850;
    var gain = ctx.createGain();
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.045, ctx.currentTime + 1.2);
    source.connect(filtro); filtro.connect(gain); gain.connect(ctx.destination);
    source.start();
    crowdNodes = { source:source, gain:gain };
  } catch(e){}
}
function detenerAmbienteMultitud(){
  if(crowdNodes){
    try {
      var ctx = getAudioCtx();
      var t = ctx ? ctx.currentTime : 0;
      crowdNodes.gain.gain.linearRampToValueAtTime(0, t+0.4);
      crowdNodes.source.stop(t+0.45);
    } catch(e){}
    crowdNodes = null;
  }
}
window.toggleSonido = function(){
  state.sonido = state.sonido === false ? true : false;
  sfxEnabled = state.sonido;

};
function fmtMoney(n){
  n = Math.round(n);
  return "$" + n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function categoriaActual(){ return CATEGORIAS[state.catIndex]; }
function estiloActual(){ return ESTILOS[state.ref.estiloId]; }
function promedio(arr){
  if(!arr.length) return 0;
  var s=0; for(var i=0;i<arr.length;i++) s+=arr[i];
  return s/arr.length;
}
function calcularOVR(){
  var cat = categoriaActual();
  var confMedia = state.carreraNotas.length ? promedio(state.carreraNotas) : 6;
  var bonusShop = 0;
  if(state.compras["reloj_hublot"]) bonusShop += 2;
  if(state.compras["mansion_nordelta"]) bonusShop += 3;
  var val = cat.ovrBase + (confMedia-6)*4 + (state.fama-50)*0.12 + bonusShop;
  return Math.round(clamp(val,20,99));
}
function calcularConfianza(){
  return state.carreraNotas.length ? promedio(state.carreraNotas) : 0;
}

function bonusControlTienda(){
  var b = 0;
  if(state.compras["silbato_fox"]) b += 3;
  if(state.compras["spray_pro"]) b += 4;
  if(state.compras["intercom_var"]) b += 5;

  return b;
}

window.irAProximoPartido = function(){
  var cat = categoriaActual();
  var equipos = shuffle(cat.equipos);
  var local = equipos[0], visitante = equipos[1];

  // Garantizar que las 3 situaciones de descuento (2, 5 y 8 min) salgan aleatoriamente de forma balanceada y rotativa
  if(!state.descuentosPool || !state.descuentosPool.length){
    state.descuentosPool = shuffle(["fluido", "normal", "accidentado"]);
  }
  var tipoDesc = state.descuentosPool.pop();
  var evDescuento = crearEventoDescuento(tipoDesc);

  var nExtra = rand(2,4);
  var pool = shuffle(EVENTOS).slice(0, nExtra);

  // Bonus de control desde la tienda
  var controlInicial = clamp(70 + bonusControlTienda(), 50, 95);

  state.match = {
    local:local, visitante:visitante,
    minuto:0,
    eventos: pool.concat([evDescuento]),
    idx:0,
    nota:6.0,
    control:controlInicial,
    amarillas:0, rojas:0, penales:0,
    tipoDescuento: tipoDesc,
    soborno: null,
    lastFeedback:null,
    golesLocal:0, golesVisitante:0,
    ticker:[], arrancoTicker:false, descansoMostrado:false,
    minutoDestino:0, onLlegada:null
  };

  state.prensaActual = generarPrensa();

  // Posibilidad de evento de apriete / soborno antes de partido (35% de probabilidad)
  var hayApriete = Math.random() < 0.35;
  if(hayApriete){
    var favoreceA = Math.random() < 0.5 ? "local" : "visitante";
    var eqNombre = favoreceA === "local" ? local : visitante;
    var montoBase = Math.round(cat.salario * (1.5 + Math.random()*2));

    state.bribeOffer = {
      equipo: favoreceA,
      equipoNombre: eqNombre,
      monto: montoBase,
      dirigente: pick(["Un influyente dirigente de la CD de ","El presidente y hombre fuerte de ","Un emisario cercano a la barra pesada de "]) + eqNombre
    };
    state.screen = "bribe";
  } else {
    state.screen = "week";
  }
  render();
};

/* =========================================================
   MINIJUEGO 1: REVISIÓN DE INDUMENTARIA EN EL TÚNEL (FIFA Regla 4)
   ========================================================= */
var PROHIBITED_ITEMS = [
  { id:"collar", icon:"📿", nombre:"Cadenita / Collar" },
  { id:"anillo", icon:"💍", nombre:"Anillo Metálico" },
  { id:"aros", icon:"👂", nombre:"Aros Colgantes" },
  { id:"reloj", icon:"⌚", nombre:"Reloj Pulsera" },
  { id:"pulsera", icon:"🧵", nombre:"Pulsera de Hilo" },
  { id:"trinchete", icon:"📎", nombre:"Hebilla / Trinchete" }
];

var tunnelMemoryState = null;
var tunnelTimerHandle = null;

function tickTunnelTimer(){
  if(!tunnelMemoryState || state.screen !== "tunnel_memory" || tunnelMemoryState.completado || tunnelMemoryState.tiempoAgotado){
    clearInterval(tunnelTimerHandle);
    return;
  }
  tunnelMemoryState.tiempoRestante--;

  var timeEl = document.getElementById("tunnelTimerVal");
  var barEl = document.getElementById("tunnelTimerBar");
  if(timeEl){
    var mins = Math.floor(Math.max(0, tunnelMemoryState.tiempoRestante) / 60);
    var secs = Math.max(0, tunnelMemoryState.tiempoRestante) % 60;
    timeEl.textContent = (mins < 10 ? "0" + mins : mins) + ":" + (secs < 10 ? "0" + secs : secs);
    if(tunnelMemoryState.tiempoRestante <= 15){
      timeEl.style.color = "var(--red)";
    }
  }
  if(barEl){
    var pct = Math.max(0, (tunnelMemoryState.tiempoRestante / 60) * 100);
    barEl.style.width = pct + "%";
    barEl.style.background = tunnelMemoryState.tiempoRestante <= 15 ? "var(--red)" : (tunnelMemoryState.tiempoRestante <= 30 ? "var(--yellow)" : "var(--green)");
  }

  if(tunnelMemoryState.tiempoRestante <= 0){
    clearInterval(tunnelTimerHandle);
    tunnelMemoryState.tiempoAgotado = true;
    tunnelMemoryState.bloqueado = true;
    if(!tunnelMemoryState.penalizado){
      tunnelMemoryState.penalizado = true;
      state.match.control = clamp(state.match.control - 15, 0, 100);
      sfxWhistle();
      triggerHaptic("error");
    }
    render();
  }
}

window.iniciarTunelRevision = function(){
  var deck = [];
  PROHIBITED_ITEMS.forEach(function(it){
    deck.push({ id: it.id, icon: it.icon, nombre: it.nombre, uid: it.id+"_a" });
    deck.push({ id: it.id, icon: it.icon, nombre: it.nombre, uid: it.id+"_b" });
  });
  deck = shuffle(deck);

  clearInterval(tunnelTimerHandle);

  tunnelMemoryState = {
    cards: deck,
    flipped: [],
    matchedIds: {},
    intentos: 0,
    completado: false,
    bloqueado: false,
    tiempoRestante: 60,
    tiempoAgotado: false,
    penalizado: false
  };

  state.screen = "tunnel_memory";
  render();
  tunnelTimerHandle = setInterval(tickTunnelTimer, 1000);
};

window.voltearCartaMemoria = function(idx){
  var s = tunnelMemoryState;
  if(!s || s.bloqueado || s.completado || s.tiempoAgotado) return;
  if(s.flipped.indexOf(idx) !== -1) return;
  if(s.matchedIds[s.cards[idx].id]) return;

  sfxCardFlip();
  s.flipped.push(idx);
  render();

  if(s.flipped.length === 2){
    s.intentos++;
    var c1 = s.cards[s.flipped[0]];
    var c2 = s.cards[s.flipped[1]];

    if(c1.id === c2.id){
      // Coincidencia
      s.matchedIds[c1.id] = true;
      s.flipped = [];
      sfxCardMatch();
      triggerHaptic("success");

      // Comprobar si completó todos los 6 pares
      var totalMatches = Object.keys(s.matchedIds).length;
      if(totalMatches === PROHIBITED_ITEMS.length){
        s.completado = true;
        clearInterval(tunnelTimerHandle);
        // Bonificación
        state.match.control = clamp(state.match.control + 5, 0, 100);
        state.fama = clamp(state.fama + 1, 0, 100);
      }
      render();
    } else {
      // No coincide, dar tiempo para memorizar y dar vuelta
      s.bloqueado = true;
      setTimeout(function(){
        if(s.tiempoAgotado) return;
        s.flipped = [];
        s.bloqueado = false;
        render();
      }, 700);
    }
  }
};

function screenTunnelMemory(){
  var s = tunnelMemoryState;
  var m = state.match;
  var totalMatches = s ? Object.keys(s.matchedIds).length : 0;

  var mins = s ? Math.floor(Math.max(0, s.tiempoRestante) / 60) : 1;
  var secs = s ? Math.max(0, s.tiempoRestante) % 60 : 0;
  var timeStr = (mins < 10 ? "0" + mins : mins) + ":" + (secs < 10 ? "0" + secs : secs);
  var pctBar = s ? Math.max(0, (s.tiempoRestante / 60) * 100) : 100;

var liveTimerHandle = null;
var LIVE_SPEED_MULT = 1; // 1 = 650ms, 2 = 280ms
var BASE_TICK_MS = 650;

var COMENTARIOS_GOL = [
  "¡GOL de {eq}! Remate furibundo e inatajable al ángulo superior.",
  "¡GOOOL! {eq} anota tras una brillante pared en la puerta del área.",
  "¡GOL de {eq}! Anticipo ofensivo de cabeza en el primer palo.",
  "{eq} celebra un zapatazo de media distancia que sacude las redes.",
  "El delantero de {eq} elude al arquero y define con el arco libre.",
  "¡GOLAZO de {eq}! Ejecución magistral de tiro libre por encima de la barrera."
];
var COMENTARIOS_JUEGO = [
  "Intensa presión en la mitad de la cancha por parte de {eq}.",
  "Desborde a toda velocidad por la banda derecha de {eq}.",
  "Gran tapada del arquero de {eq} enviando la pelota al córner.",
  "Centro venenoso de {eq} que cruza toda el área chica sin remate.",
  "La hinchada de {eq} canta y empuja a su equipo en busca del gol.",
  "Firme cruce defensivo de {eq} barriendo la pelota limpia sobre el lateral.",
  "Tiro libre peligroso en tres cuartos de cancha para {eq}.",
  "Circulación limpia y asociación corta de pases en {eq}.",
  "Remate potente de {eq} que pasa besando el poste izquierdo.",
  "Despeje largo y contraataque veloz encabezado por {eq}."
];

function generarTickComentario(m){
  var r = Math.random();
  if(r < 0.026){
    var esLocal = Math.random() < 0.5;
    if(esLocal) m.golesLocal++; else m.golesVisitante++;
    var equipoGol = esLocal ? m.local : m.visitante;
    var txtGol = pick(COMENTARIOS_GOL).replace(/\{eq\}/g, equipoGol);
    m.ticker.push({ minuto:m.minuto, texto:"⚽ "+txtGol, gol:true });
    sfxGol();
  } else if(r < 0.38){
    var equipo2 = Math.random() < 0.5 ? m.local : m.visitante;
    var txt = pick(COMENTARIOS_JUEGO).replace(/\{eq\}/g, equipo2);
    m.ticker.push({ minuto:m.minuto, texto: txt });
  }
  if(Math.random() < 0.035){ sfxCantico(0.65); }
}

function renderActivePlaysHtml(m){
  if(!m || !m.ticker || !m.ticker.length){
    return '<div class="active-play-item"><span style="color:var(--text-faint);">⏱️ Esperando la próxima acción en el terreno...</span></div>';
  }
  // Tomamos solo las últimas 3 jugadas activas: las anteriores se van borrando por arriba
  var activeSlice = m.ticker.slice(-3);
  return activeSlice.map(function(item, idx){
    var isNewest = idx === activeSlice.length - 1;
    var isOldest = idx === 0 && activeSlice.length > 1;
    var cls = "active-play-item" + (isNewest ? " current" : (isOldest ? " old" : "")) + (item.gol ? " gol" : "");
    return '<div class="' + cls + '">' +
      '<span class="ticker-min" style="color:var(--gold); font-family:var(--font-display); font-size:13px; font-weight:700; width:34px; flex:none;">' + item.minuto + "'</span>" +
      '<span class="ticker-txt" style="flex:1; font-size:13px; line-height:1.4; color:#fff;">' + item.texto + '</span>' +
    '</div>';
  }).join("");
}

function renderMatchTimelineHtml(ticker){
  if(!ticker || !ticker.length) return "";
  var rows = ticker.map(function(item){
    return '<div class="timeline-event-row' + (item.gol ? " gol" : "") + '">' +
      '<span class="timeline-event-min">' + item.minuto + "'</span>" +
      '<span class="timeline-event-txt">' + item.texto + '</span>' +
    '</div>';
  }).join("");

  return '<div class="match-timeline-accordion">' +
    '<div class="eyebrow" style="color:var(--gold);">📜 Cronología Completa de Jugadas del Partido (90\')</div>' +
    '<div class="timeline-scroll-feed">' + rows + '</div>' +
  '</div>';
}

function getLiveTickMs(){
  return Math.round(BASE_TICK_MS / LIVE_SPEED_MULT);
}

window.cambiarVelocidadLive = function(mult){
  LIVE_SPEED_MULT = mult;
  if(liveTimerHandle && state.screen === "matchLive"){
    clearInterval(liveTimerHandle);
    liveTimerHandle = setInterval(tickLive, getLiveTickMs());
  }
  render();
};

window.saltarAlEventoLive = function(){
  var m = state.match;
  if(!m) return;
  clearInterval(liveTimerHandle);
  m.minuto = m.minutoDestino;
  resolverLlegadaEnVivo();
};

function iniciarTramoEnVivo(destino, onLlegada){
  var m = state.match;
  if(!m.ticker) m.ticker = [];
  if(!m.arrancoTicker){
    m.arrancoTicker = true;
    m.ticker.push({ minuto:0, texto:"⚽ ¡Pitazo inicial! Rueda la pelota en el choque "+ m.local +" vs "+ m.visitante +"." });
    iniciarAmbienteMultitud();
    sfxWhistle();
  }
  m._lastRenderedTickerLen = -1;
  m.minutoDestino = destino;
  m.onLlegada = onLlegada;
  state.screen = "matchLive";
  render();
  clearInterval(liveTimerHandle);
  liveTimerHandle = setInterval(tickLive, getLiveTickMs());
}

function tickLive(){
  var m = state.match;
  if(!m || state.screen !== "matchLive"){ clearInterval(liveTimerHandle); return; }
  if(m.minuto >= m.minutoDestino){
    clearInterval(liveTimerHandle);
    resolverLlegadaEnVivo();
    return;
  }
  m.minuto++;
  if(m.minuto === 45 && !m.descansoMostrado && m.minutoDestino > 45){
    m.descansoMostrado = true;
    clearInterval(liveTimerHandle);
    sfxWhistle();
    state.screen = "halftime";
    render();
    return;
  }
  generarTickComentario(m);
  
  // Actualización limpia en vivo del DOM para evitar parpadeos y bugs de scroll
  var minEl = document.getElementById("liveMinuteEl");
  if(minEl) minEl.textContent = "⏱️ Minuto " + m.minuto + "'";
  var scoreEl = document.getElementById("liveScoreEl");
  if(scoreEl) scoreEl.textContent = m.golesLocal + " - " + m.golesVisitante;
  var stageEl = document.getElementById("liveActiveFeed");
  if(stageEl && m.ticker && m.ticker.length !== m._lastRenderedTickerLen){
    m._lastRenderedTickerLen = m.ticker.length;
    stageEl.innerHTML = renderActivePlaysHtml(m);
  }
  var fillEl = document.getElementById("liveMeterFillEl");
  if(fillEl){
    fillEl.style.width = Math.round(m.control) + "%";
    fillEl.style.background = controlColor(m.control);
  }
}

function resolverLlegadaEnVivo(){
  var m = state.match;
  var accion = m.onLlegada;
  if(accion === "final"){
    m.ticker.push({ minuto:m.minuto, texto:"🏁 ¡Final del partido! Pitazo final: "+ m.local +" "+ m.golesLocal +" - "+ m.golesVisitante +" "+ m.visitante +"." });
    sfxSilbatoFinal();
    render();
    setTimeout(function(){ detenerAmbienteMultitud(); cerrarPartido(); }, 1000);
  } else {
    state.screen = "event";
    render();
  }
}

window.elegirOpcion = function(i){
  var m = state.match;
  var ev = m.eventos[m.idx];
  var op = ev.opciones[i];
  var estilo = estiloActual();

  var efectos = {
    nota: op.efectos.nota || 0,
    control: op.efectos.control || 0,
    fama: op.efectos.fama || 0
  };

  // Bonus de reloj inteligente si es descuento
  if(ev.id === "descuento" && state.compras["reloj_spintso"] && efectos.nota > 0){
    efectos.nota += 1.0;
  }

  var sinergia = false;
  if(estilo && op.tipo===estilo.bonusTipo){
    efectos.control += estilo.bonusControl;
    efectos.fama += estilo.bonusFama;
    sinergia = true;
  }

  m.nota = m.nota + efectos.nota;
  m.control = clamp(m.control + efectos.control, 0, 100);
  state.fama = clamp(state.fama + efectos.fama, 0, 100);

  if(op.tarjeta==="amarilla"){ m.amarillas++; }
  if(op.tarjeta==="roja"){ m.rojas++; }
  var PENAL_EN_OPCION_0 = ["mano_area","plancha_penal","mano_intencional"];
  var PENAL_EN_OPCION_1 = ["simulacion_area","simulacion_area_real"];
  if(PENAL_EN_OPCION_0.indexOf(ev.id)!==-1 && i===0){ m.penales++; }
  if(PENAL_EN_OPCION_1.indexOf(ev.id)!==-1 && i===1){ m.penales++; }

  // Calcular efecto de soborno si existe
  var bribeDelta = 0;
  if(m.soborno){
    var resSob = calcularEfectoSoborno(ev.id, i, m.soborno.equipo);
    bribeDelta = resSob.delta;
    m.soborno.satisfaccion = clamp(m.soborno.satisfaccion + bribeDelta, 0, 100);
  }

  // Determinar tipo de animación visual
  var animType = "silbato";
  var resLower = (op.resultado || "").toLowerCase();
  var txtLower = (op.texto || "").toLowerCase();
  var evId = (ev.id || "").toLowerCase();

  if(ev.id === "descuento"){
    animType = "cartel_descuento";
  } else if(op.tarjeta === "roja" || resLower.indexOf("roja") !== -1 || txtLower.indexOf("roja") !== -1 || resLower.indexOf("expuls") !== -1){
    animType = "tarjeta_roja";
  } else if(op.tarjeta === "amarilla" || resLower.indexOf("amarilla") !== -1 || txtLower.indexOf("amarilla") !== -1 || resLower.indexOf("amonest") !== -1){
    animType = "tarjeta_amarilla";
  } else if(evId.indexOf("var") !== -1 || txtLower.indexOf("pantalla") !== -1 || resLower.indexOf("var") !== -1 || txtLower.indexOf("var") !== -1){
    animType = "var_check";
  } else if(resLower.indexOf("penal") !== -1 || txtLower.indexOf("penal") !== -1 || resLower.indexOf("doce pasos") !== -1){
    animType = "gesto_penal";
  } else if(resLower.indexOf("siga") !== -1 || txtLower.indexOf("seguir") !== -1 || resLower.indexOf("correr") !== -1 || resLower.indexOf("pegada al cuerpo") !== -1){
    animType = "gesto_siga";
  } else if(op.tipo === "verbal" || resLower.indexOf("calm") !== -1 || resLower.indexOf("habl") !== -1 || resLower.indexOf("avisa") !== -1){
    animType = "gesto_calma";
  }

  var esAcierto = (op.acierto !== undefined) ? op.acierto : (efectos.nota >= 0);

  // Respuesta háptica sutil en el dispositivo
  triggerHaptic(esAcierto ? "success" : "decision");

  if(op.tarjeta){ sfxTarjeta(); }

  m.lastFeedback = {
    resultado: op.resultado,
    efectos: efectos,
    tarjeta: op.tarjeta || null,
    sinergia: sinergia,
    bribeDelta: bribeDelta,
    animType: animType,
    acierto: esAcierto,
    minutosDescuento: op.minutos || (ev.id==="descuento" ? 5 : null)
  };

  if(esJugadaGrave(ev, op)){
    iniciarMinijuegoTension();
  } else {
    state.screen = "feedback";
    render();
  }
};

/* =========================================================
   MINIJUEGO: MANTENER LA AUTORIDAD (barra de tensión precisa)
   ========================================================= */
function esJugadaGrave(ev, op){
  if(op.tarjeta === "roja") return true;
  var tagLower = (ev.tag || "").toLowerCase();
  if(tagLower.indexOf("grave") !== -1) return true;
  if(tagLower.indexOf("violenta") !== -1) return true;
  return false;
}

var tensionAnimHandle = null;
var tensionState = null;
var TENSION_PERIODO_MS = 1850; // Ritmo cómodo y preciso
var TENSION_ZONA = { min:37.5, max:62.5 }; // Zona verde central exacta de 25% de ancho

function posicionAguja(){
  if(!tensionState) return 50;
  var elapsed = performance.now() - tensionState.inicio;
  var frac = (elapsed % TENSION_PERIODO_MS) / TENSION_PERIODO_MS;
  // Curva sinusoidal suave de ida y vuelta de 4% a 96%
  var rad = frac * Math.PI * 2;
  var sinVal = (Math.sin(rad - Math.PI/2) + 1) / 2; // de 0 a 1
  return 4 + sinVal * 92;
}

function iniciarMinijuegoTension(){
  tensionState = { inicio: performance.now(), resuelto:false, hitPos:50 };
  state.screen = "tension";
  render();
  cancelAnimationFrame(tensionAnimHandle);
  tensionLoop();
}

function tensionLoop(){
  if(!tensionState || tensionState.resuelto || state.screen !== "tension"){ return; }
  var needle = document.getElementById("tensionNeedle");
  if(needle){
    var pos = posicionAguja();
    needle.style.left = pos.toFixed(2) + "%";
  }
  tensionAnimHandle = requestAnimationFrame(tensionLoop);
}

window.intentarControlarTension = function(){
  if(!tensionState || tensionState.resuelto) return;
  tensionState.resuelto = true;
  cancelAnimationFrame(tensionAnimHandle);

  var pos = posicionAguja();
  tensionState.hitPos = pos;

  // Congelar la aguja en el DOM instantáneamente en el valor exacto
  var needle = document.getElementById("tensionNeedle");
  var exito = (pos >= TENSION_ZONA.min && pos <= TENSION_ZONA.max);

  if(needle){
    needle.style.left = pos.toFixed(2) + "%";
    needle.classList.add(exito ? "hit" : "miss");
  }

  var m = state.match;
  var fb = m.lastFeedback;
  var deltaControl = exito ? rand(5,9) : -rand(10,16);
  var deltaNota = exito ? 0.3 : -0.5;

  m.control = clamp(m.control + deltaControl, 0, 100);
  m.nota = m.nota + deltaNota;
  fb.tension = { exito:exito, deltaControl:deltaControl, deltaNota:deltaNota, pos:pos };

  triggerHaptic(exito ? "success" : "error");
  if(exito){ sfxWhistle(); } else { sfxCantico(1.3); }

  // Breve pausa para que el jugador aprecie la aguja congelada en el lugar exacto donde clickeó
  setTimeout(function(){
    state.screen = "tensionResultado";
    render();
  }, 420);
};

document.addEventListener("keydown", function(e){
  if(state.screen === "tension" && (e.code === "Space" || e.key === " ")){
    e.preventDefault();
    window.intentarControlarTension();
  }
});

/* ---------- CIERRE DE PARTIDO ---------- */
function cerrarPartido(){
  var m = state.match;
  var notaFinal = m.nota;

  if(m.control < 30) notaFinal -= 1.5;
  else if(m.control > 80) notaFinal += 0.4;

  notaFinal = clamp(Math.round(notaFinal*10)/10, 1, 10);

  var cat = categoriaActual();
  var pagoBase = cat.salario * (0.65 + notaFinal/10);
  state.ingresos += Math.round(pagoBase);

  // Pago de soborno según satisfacción
  var extraSoborno = 0;
  var mensajeSoborno = "";
  if(m.soborno){
    if(m.soborno.satisfaccion >= 65){
      extraSoborno = m.soborno.monto;
      state.ingresos += extraSoborno;
      mensajeSoborno = "💼 <b>Trato cumplido:</b> El dirigente de "+ m.soborno.equipoNombre +" quedó sumamente satisfecho y te entrega el sobre completo de "+ fmtMoney(extraSoborno) +".";
    } else if(m.soborno.satisfaccion >= 40){
      extraSoborno = Math.round(m.soborno.monto * 0.4);
      state.ingresos += extraSoborno;
      mensajeSoborno = "💼 <b>Pago parcial:</b> “No cobraste todo lo que pedimos”. Te entregan el 40% del sobre ("+ fmtMoney(extraSoborno) +").";
    } else {
      state.fama = clamp(state.fama - 6, 0, 100);
      mensajeSoborno = "⚠️ <b>Dirigente furioso:</b> No cumpliste el acuerdo. No ves ni un peso y recibís llamados amenazantes tras el partido (-Fama).";
    }
  }

  state.stats.partidos++;
  state.stats.amarillas += m.amarillas;
  state.stats.rojas += m.rojas;
  state.stats.penales += m.penales;

  state.carreraNotas.push(notaFinal);
  state.temporadaNotas.push(notaFinal);

  m.notaFinal = notaFinal;
  m.pago = Math.round(pagoBase);
  m.extraSoborno = extraSoborno;
  m.mensajeSoborno = mensajeSoborno;

  // Iniciar Conferencia de Prensa tras el partido
  state.pressConference = generarConferenciaDePrensa(m);
  state.screen = "press_conference";
  render();
}

window.responderPrensa = function(optIdx){
  var conf = state.pressConference;
  if(conf.respondida) return;
  triggerHaptic("decision");
  var op = conf.opciones[optIdx];
  conf.respondida = true;
  conf.opcionElegida = op;

  state.fama = clamp(state.fama + (op.famaDelta || 0), 0, 100);
  render();
};
